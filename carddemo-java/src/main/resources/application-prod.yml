#
# PRODUCTION profile.
#
# HARD RULE (AAP §0.8.1): "No hardcoded credentials - secrets via environment variables or vault
# references", applied literally, INCLUDING the absence of defaults. Every placeholder below is
# written as ${VAR} with NO `:default` fallback, so a missing secret aborts startup instead of
# silently binding a placeholder.
#
# Required environment variables (startup fails if any is absent):
#   CARDDEMO_DB_URL                  e.g. jdbc:postgresql://db.internal:5432/carddemo
#   CARDDEMO_DB_USERNAME
#   CARDDEMO_DB_PASSWORD
#   CARDDEMO_JWT_SECRET              >= 32 bytes of entropy for HMAC signing
#   CARDDEMO_FIELD_ENCRYPTION_KEY    Base64 decoding to exactly 32 bytes - the AES-GCM key for the
#                                    encrypted personal-data columns, used directly rather than
#                                    derived, so there is no companion salt variable; rotating it
#                                    invalidates every stored value sealed under the old key
#   CARDDEMO_AWS_ACCESS_KEY_ID       omit BOTH aws credential lines to use an IAM role instead
#   CARDDEMO_AWS_SECRET_ACCESS_KEY
#   AWS_REGION
#   CARDDEMO_S3_BUCKET
#   CARDDEMO_SQS_QUEUE
#   CARDDEMO_SNS_TOPIC
#   OTEL_EXPORTER_OTLP_TRACES_ENDPOINT
#
# Seed migrations are deliberately absent from the Flyway location list: production migrates
# schema (V1) and indexes (V2) only and never inherits sample data or seeded credentials.

spring:
  datasource:
    url: ${CARDDEMO_DB_URL}
    username: ${CARDDEMO_DB_USERNAME}
    password: ${CARDDEMO_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${CARDDEMO_DB_POOL_MAX:10}
      minimum-idle: ${CARDDEMO_DB_POOL_MIN_IDLE:2}

  jpa:
    show-sql: false
    hibernate:
      ddl-auto: validate

  flyway:
    locations: classpath:db/migration
    validate-on-migrate: true
    clean-disabled: true

  batch:
    jdbc:
      # Batch metadata tables are provisioned by a controlled migration, never by the app.
      initialize-schema: never

  cloud:
    aws:
      region:
        static: ${AWS_REGION}
      credentials:
        # Remove these two lines to use the default AWS credentials provider chain
        # (EC2/ECS/EKS instance role, web identity token, or SSO) instead of static keys.
        access-key: ${CARDDEMO_AWS_ACCESS_KEY_ID}
        secret-key: ${CARDDEMO_AWS_SECRET_ACCESS_KEY}
      s3:
        path-style-access-enabled: false

server:
  # Transport security is terminated at the load balancer / ingress in the reference deployment;
  # the application trusts and honours the forwarded protocol headers and requires HTTPS.
  forward-headers-strategy: framework
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never
  # In-process TLS (uncomment and supply an SSL bundle when terminating TLS in the JVM):
  # ssl:
  #   enabled: true
  #   bundle: carddemo

# THE FOUR MANAGEMENT VALUES BELOW RESTATE THE SHARED BASELINE RATHER THAN NARROWING IT, and the
# duplication is deliberate. application.yml is now fail-closed: it publishes these same three
# endpoints and answers the probe with an aggregate status alone, and it is the local overlay that
# widens both. Restating them here is a second, independent statement of the production posture, so
# a future edit that reopens something in the shared baseline cannot silently reopen it in
# production. They are not redundant lines to be tidied away.
management:
  endpoints:
    web:
      exposure:
        # Minimal surface in production; no env/configprops/beans/metrics/loggers exposure.
        include: health,info,prometheus
  endpoint:
    health:
      show-details: never
      show-components: never
  tracing:
    sampling:
      probability: ${TRACING_SAMPLE_RATE:0.1}
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT}

# Restated for the same reason as the management block above: the interface description and its
# viewer are inherited disabled from application.yml, and this second statement means a future edit
# that reopens either one in the shared baseline cannot reach production by inheritance. Served
# openly the document is a complete map of every endpoint, field and declared error of the migrated
# screen contract, and the viewer issues requests from the browser on top of that.
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

logging:
  level:
    root: WARN
    com.carddemo: INFO
    org.springframework: WARN
    org.hibernate: WARN

carddemo:
  aws:
    s3:
      bucket: ${CARDDEMO_S3_BUCKET}
    sqs:
      job-submission-queue: ${CARDDEMO_SQS_QUEUE}
    sns:
      job-notification-topic: ${CARDDEMO_SNS_TOPIC}
  security:
    jwt:
      # No fallback. A missing value must fail startup.
      secret: ${CARDDEMO_JWT_SECRET}
      expiration: ${CARDDEMO_JWT_EXPIRATION:PT30M}
    field-encryption:
      # No fallback. Base64 of exactly 32 bytes; a missing or malformed key must fail startup rather
      # than let regulated customer identifiers be sealed under something accidental.
      key: ${CARDDEMO_FIELD_ENCRYPTION_KEY}
    # Restated, not narrowed: application.yml already requires transport security, and only the local
    # and test overlays relax it. Kept here so the production posture is stated independently of what
    # the shared baseline happens to say.
    require-https: true
