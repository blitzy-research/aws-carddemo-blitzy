# PRODUCTION profile overlay for the CardDemo Java module.
#
# PROVENANCE
#   Legacy checkout SHA : 7756d895ffeb65f7ea72aaa609e356d9899afcec
#   Upstream stamp      : CardDemo_v1.0-15-g27d6c6f-68, dated 2022-07-19
#   No COBOL, job-stream, screen-map, copybook or CICS resource-definition source text appears in
#   this file. The legacy estate is cited by member name, resource name, record width, field name
#   and attribute value only, and is never copied here.
#
# =================================================================================================
# THE ONE RULE THIS FILE EXISTS TO ENFORCE
#
#   "No hardcoded credentials - secrets via environment variables or vault references."
#
# That requirement is applied LITERALLY HERE, INCLUDING THE ABSENCE OF DEFAULTS. A defaulted secret
# violates it exactly as much as a literal one does: both put a usable value in the repository, and
# the defaulted form is worse, because it starts cleanly and nobody finds out. So every secret below
# is written as ${VARIABLE} and never as ${VARIABLE:something} - not a placeholder, not an empty
# tail, not a development convenience.
#
# A MISSING SECRET MUST ABORT START-UP, AND A CODE GUARD - NOT THIS SYNTAX - IS WHAT MAKES IT DO SO.
# Writing a value as a bare ${VARIABLE} states an intention and enforces nothing, because the
# framework is lenient about a reference nothing satisfied:
#
#   * A setting bound as a configuration-properties object binds the LITERAL TEXT ${VARIABLE} when
#     the variable is unset. That text is not blank, so a not-blank constraint on it reports no
#     violation, the context refreshes, and the application signs tokens with the text of its own
#     placeholder. The data source location, the data source user, the key store location, the key
#     store format, the key entry alias and the region all bind this way.
#   * A setting read through a value expression DOES fail - but at the moment the one bean that
#     happens to read it is created, in words that describe a placeholder rather than naming a
#     variable a deployer must set, and only for whichever such bean is reached first.
#   * A variable exported as an EMPTY STRING is silent on every path. It resolves to an empty
#     string, binds as an empty string, and is then offered to a database server as a credential.
#
# So com.carddemo.config.ProductionConfigurationValidator publishes a bean-factory post-processor
# under this profile alone. It runs while bean definitions are still being processed - before the
# data source is created, before a migration opens a connection, before the embedded server reads
# the key store, before any configuration-properties object is bound - and it refuses every required
# setting that is undeclared, still unresolved, or blank. It reports ALL of the faults at once, each
# one naming the property and the environment variable a deployer must set. See
# docs/decision-log.md DL-105.
#
# Nothing in this file may be softened to make a start "work" without its environment, and no key
# below may be given a fallback tail without being removed from that guard's list - the two are
# asserted against each other, so a mismatch fails the build rather than going unnoticed.
#
# EVERY value in the two REQUIRED lists below carries NO fallback - the secrets, and the
# deployment-specific locations a guess would turn into an accident alike. No count of them is
# written anywhere in this file on purpose: the set is enumerated in the guard, and the guard is
# compared against this document, so a count in prose would be a second place to be wrong.
# Everything that DOES carry a value below is a resource name, a published behavioural constant or a
# non-sensitive setting - see the note on that distinction above the security block, because the
# no-default rule must not be over-generalised into "nothing may have a value".
#
# -------------------------------------------------------------------------------------------------
# ENVIRONMENT VARIABLES THIS PROFILE REQUIRES
#
# This list is the authoritative one. carddemo-java/README.md and any deployment runbook are written
# from it, so a variable added or renamed here must be carried into both.
#
#   REQUIRED - SECRET. No fallback. The guard named above aborts start-up when any one of these is
#   absent, empty or left as an unresolved reference, and names it in the failure.
#     CARDDEMO_DB_PASSWORD             credential for the data source user below
#     CARDDEMO_JWT_SECRET              signing material for the bearer token that carries the
#                                      navigation state the legacy pseudo-conversation kept in its
#                                      communication area; supply ample entropy for HMAC signing
#     CARDDEMO_FIELD_ENCRYPTION_KEY    Base64 decoding to exactly 32 bytes - the AES-256-GCM key for
#                                      the encrypted customer identity columns. It is used directly
#                                      rather than derived, so there is no companion salt variable,
#                                      and each sealed value carries its own random initialisation
#                                      vector. Replacing it makes every value sealed under the
#                                      previous key unreadable: that is a property of authenticated
#                                      encryption, not a defect
#     CARDDEMO_TLS_KEYSTORE_PASSWORD   credential protecting the server key store named below
#
#   REQUIRED - NOT SECRET, but deployment-specific. No fallback, because a guessed value would be
#   worse than a failed start. Guarded on exactly the same terms as the secrets above: a location is
#   as capable of pointing somewhere accidental as a credential is of being forged.
#     CARDDEMO_DB_URL                  JDBC location of the PostgreSQL 16 server. Never defaulted: a
#                                      production data source must not be inferred
#     CARDDEMO_DB_USERNAME             data source user
#     CARDDEMO_TLS_KEYSTORE            location of the server key store
#     CARDDEMO_TLS_KEYSTORE_TYPE       key store format, for example PKCS12
#     CARDDEMO_TLS_KEY_ALIAS           alias of the server key entry inside that store
#     CARDDEMO_SQS_QUEUE               ordered job-submission queue. Never defaulted: a queue that is
#                                      well formed but names nothing is the exact input the messaging
#                                      template would otherwise resolve by creating a queue nothing
#                                      consumes, so a submission would report complete and the cards
#                                      would sit unread. The canonical value is JOBS.fifo
#     AWS_REGION                       region for the object-store, queue and notification clients.
#                                      Keeps its ecosystem-standard name deliberately, because
#                                      application.yml and docker-compose.yml already use it and the
#                                      cloud SDK reads it directly
#     OTEL_EXPORTER_OTLP_TRACES_ENDPOINT  trace collector address. Also keeps its standard name, for
#                                      the same reason
#
#   OPTIONAL. Each carries either a resource name mandated by the migration plan or a stated
#   non-sensitive value, and each may still be redirected without editing this file.
#     CARDDEMO_S3_BUCKET               object-store bucket for batch file staging
#     CARDDEMO_SQS_MESSAGE_GROUP_ID    the single message group that preserves append order
#     CARDDEMO_SNS_TOPIC               job-completion and operational notification topic
#     CARDDEMO_JWT_EXPIRATION          token lifetime, as an ISO-8601 duration
#     CARDDEMO_TRACING_SAMPLE_RATE     fraction of traces exported - a sampling decision only
#
#   INHERITED from application.yml and not restated here: the listening port, which that file binds
#   with a fallback so independent clones can run side by side.
#
#   DELIBERATELY ABSENT - no cloud access key and no cloud secret key property is declared at all.
#   Omitting them is not an oversight and is strictly better than binding a key pair from the
#   environment: with no static credential property present, the cloud SDK's default provider chain
#   resolves an instance or task role, a web-identity token, or a configured single-sign-on session,
#   none of which places a long-lived key anywhere. That chain also reads the standard access-key and
#   secret-key variables by itself, so a deployment that genuinely cannot use a role still needs no
#   property here. A role has no value to steal from a process listing, an image layer or a
#   configuration store, which a key pair does.
#
# -------------------------------------------------------------------------------------------------
# WHAT IS DELIBERATELY ABSENT - every absence below is a recorded decision, not an oversight
#
#   * THE SEED MIGRATIONS ARE UNREACHABLE FROM THIS PROFILE, and com.carddemo.config.FlywayConfig
#     is what makes that a control rather than a claim. See the schema-evolution block.
#   * THIS PROFILE MUST NOT BE ACTIVATED ALONGSIDE `local` OR `test`, IN EITHER ORDER, and it cannot
#     be: com.carddemo.config.FlywayConfig refuses the combination before any bean is instantiated.
#     No document can enforce this by itself, because a document cannot see the list that selected
#     it - see the co-activation block below.
#   * No pool sizing and no pool time-out on the data source. See the data-source block.
#   * NO CAPACITY OR SERVICE-LEVEL FIGURE OF ANY KIND, in a property or in a comment: no heap
#     figure, no worker-thread count, no latency figure, no volume figure, no availability figure.
#     No numeric service level is documented anywhere in the legacy estate - not in the programs,
#     not in the job streams, not in the CICS resource definitions - so there is nothing to assert
#     against and any figure written here would be invented. Performance is MEASURED through the
#     meters wired further down, which establish the first baseline for this implementation rather
#     than testing it against a threshold. A future reader should not "fill in" this gap.
#   * No application-level caching layer. The legacy system had none, and introducing one would
#     move the very latency and consistency behaviour that baseline is meant to record.
#   * No secondary read source and no table-splitting scheme. Both are durability and performance
#     engineering beyond behavioural fidelity, with no legacy baseline to justify a shape.
#   * No object-store retention rule. Retention is object versioning on the staging bucket.
#   * No cloud endpoint override. See the cloud-integration block.
#   * No certificate, no ingress definition and no infrastructure resource. See the server block.
#   * No framework-managed initialisation script and no bootstrap SQL file. The versioned migrations
#     are the only path by which a table or a row is created.
#
# -------------------------------------------------------------------------------------------------
# CO-ACTIVATION IS REFUSED IN CODE, BECAUSE A DOCUMENT CANNOT REFUSE IT
#
# Every guarantee this file makes is a guarantee about the values IT declares. None of them is a
# guarantee about the values a deployment RESOLVES, and the two differ the moment more than one
# profile is active: overlapping property sources are resolved by activation order, so the last
# profile that declares a key wins it. Activating `prod,local` therefore starts a deployment that
# reads this file and then lets the local overlay overwrite whatever it also declares - the seed
# migration location among it, together with repository-known signing and field-encryption material,
# an emulator endpoint standing in for the real services, and a transport rule relaxed for loopback
# development. Activating `local,prod` changes which document wins a contested key and changes
# nothing about the fact that both were loaded. Neither ordering is a configuration anyone writes on
# purpose; both are a plausible accident in a deployment script or a container definition.
#
# This file cannot detect that, and neither can its siblings: a profile document is selected BY the
# active-profile list and never sees it. So the refusal lives in com.carddemo.config.FlywayConfig,
# which publishes a bean-factory post-processor - a hook that runs after every bean definition is
# loaded and before any bean is instantiated. `prod` activated together with `local` or with `test`
# aborts start-up there, ahead of the data source, ahead of the migration, ahead of the messaging
# clients and ahead of every @ConfigurationProperties binding. That ordering is the point: a refusal
# raised by a listener, a health indicator or the migration itself would already be too late for at
# least one of them.
#
# The same class also refuses, at migration time, any location resolving under classpath:db/seed
# while this profile is active - so a merged environment, an operator override or a copied overlay
# block cannot reintroduce the seeds in silence even if the co-activation guard were ever removed.
# =================================================================================================

spring:

  # -----------------------------------------------------------------------------------------------
  # DATA SOURCE - PostgreSQL 16, standing in for the ten indexed base clusters plus the sequential
  # daily-transaction input.
  #
  # ALL THREE VALUES ARE BARE ENVIRONMENT REFERENCES, AND ALL THREE ARE GUARDED. The credential is
  # the single most important line in this file, and the location and the user are held to the same
  # standard: a defaulted location would silently aim a production deployment at whatever host
  # happened to be guessed, and a defaulted user would do the same for the identity it connects as.
  # The driver is the only fixed value, and it is fixed so that nothing can fall back to an embedded
  # database.
  #
  # These three are the reason the guard described at the head of this file exists rather than being
  # left to the framework. They are bound as a configuration-properties object, so an unset variable
  # binds the LITERAL text ${CARDDEMO_DB_URL} and the pool then fails on a URL no driver accepts -
  # far from the missing variable and in words that do not name it. An EMPTY credential variable is
  # worse: it binds as an empty string and is offered to the server as a password, and whether that
  # is refused is the server's decision rather than this module's. See docs/decision-log.md DL-105.
  #
  # THE POOL KEEPS ITS SHIPPED DEFAULTS, AND THAT IS DELIBERATE. No sizing property and no time-out
  # override is declared, here or anywhere else in this module. A production profile is exactly where
  # an unbriefed reviewer will want to tune one, so the reason is recorded rather than left implicit:
  # there is no legacy baseline to tune against, tuning is outside the scope of this migration, and a
  # figure chosen without a baseline is a guess that later reads as a measurement. Tune it when the
  # meters wired further down have produced something to tune against.
  datasource:
    url: ${CARDDEMO_DB_URL}
    username: ${CARDDEMO_DB_USERNAME}
    password: ${CARDDEMO_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  # -----------------------------------------------------------------------------------------------
  # PERSISTENCE PROVIDER. The migrations own the schema; the provider only checks that the mapped
  # entities still agree with the migrated tables. `validate` is never `create`, `create-drop` or
  # `update`: nothing here may author or alter a table outside a versioned migration.
  #
  # Statement echo is off. The local profile turns it on because seeing the generated statement is
  # what makes a fixed-width mapping or a truncating decimal store visible while parity evidence is
  # gathered. In production the same output would put row values and query text into the log, so it
  # is restated as off here rather than left to a framework default.
  #
  # A view-scoped session is refused, so no lazy association can be resolved while a response is
  # being written.
  jpa:
    open-in-view: false
    show-sql: false
    hibernate:
      ddl-auto: validate

  # -----------------------------------------------------------------------------------------------
  # SCHEMA EVOLUTION - AND `target: 2` IS A SECURITY CONTROL, NOT A TIDINESS PREFERENCE.
  #
  # THE CONTROL IS `target: 2`, A VERSION CEILING. It is re-asserted here rather than inherited: the
  # shared baseline in application.yml already defaults it to the same restrictive value, so a profile
  # that forgets the property inherits the safe ceiling, and this overlay states the most consequential
  # setting in the file out loud for anyone reading only this file. Five migrations exist in this
  # module, all five in the single classpath:db/migration location, and production applies the first
  # three of them:
  #
  #   V1__create_schema.sql             the eleven application tables         APPLIED HERE
  #   V1_1__create_batch_metadata.sql   batch job-repository metadata         APPLIED HERE
  #   V2__create_indexes.sql            keys and alternate-index equivalents  APPLIED HERE
  #   -------------------------------------------------------------- ceiling: target 2
  #   V3__seed_reference_data.sql       sample reference rows                 NEVER HERE
  #   V4__seed_user_security.sql        sign-on identities                    NEVER HERE
  #
  # WHY THE TWO SEEDS MUST NOT REACH THIS PROFILE. The sign-on seed inserts ten known identities -
  # five with the administrative user type and five with the standard one - whose stored credentials
  # are all hashes of one single well-known value. Were that migration ever to run against a
  # production database, the deployment would ship with ten predictable identities, half of them
  # capable of reaching the administrative user-management surface. The reference seed inserts fifty
  # sample customer rows carrying synthetic personal data, including the two identity fields this
  # module encrypts at rest. Neither belongs in production, and neither reaching it would be
  # untidiness: it would be a credential incident and a privacy incident respectively.
  #
  # WHY A CEILING RATHER THAN A SEPARATE LOCATION. An earlier revision put the two seeds in a
  # classpath:db/seed location that this file did not list. That made the guarantee depend on two
  # location lists staying different from each other - a difference no single file states and no
  # single review sees - and it made the version numbers stop describing what production would apply.
  # It also meant a new seed script was safe only if its author happened to choose the right
  # directory. The ceiling is stronger on every count: it is stated HERE, in the file whose posture it
  # governs; it is one line a reviewer can see; it cannot be defeated by moving, renaming or
  # renumbering a file, because the exclusion is arithmetic. Verified against Flyway 11.7.2 - with
  # target 2 the applied set is exactly {1, 1.1, 2} and version 3 is not resolved at all.
  #
  # THE RULE FOR ANY FUTURE SCRIPT, and it is the whole rule: a script production MUST run is
  # numbered at or below 2; a script production must NEVER run is numbered above 2. Raise this ceiling
  # only in the same commit that adds a production-required script above it, and never to admit a
  # seed. A sign-on credential is stored only as a hash regardless, so that even a mistake here leaks
  # no usable secret.
  #
  # `target` does not weaken validation: validate-on-migrate stays on, and an unapplied script sitting
  # above the ceiling is not a validation failure - only a CHANGED already-applied script is.
  #
  # A LOCATION LIST IS ONLY EXCLUDED WHILE NOTHING RE-ADDS IT, and until com.carddemo.config.
  # FlywayConfig existed the exclusion below was the whole of the mechanism. That class now refuses
  # the seed location outright whenever this profile is active - checked against the MERGED, BOUND
  # location list rather than against this document, so an inherited value, an operator override on
  # the command line and a co-activated overlay are all covered by one check. It also completes the
  # list the other way round: a profile that needs fixtures and lost the seed location has it added
  # back, because a fixture-bearing profile silently migrating no fixtures is a defect too.
  #
  # The same class registers the component that seals the seeded regulated identifiers, and registers
  # it for the local and test profiles ALONE - so this profile neither seeds an identifier nor carries
  # the component that would seal one.
  #
  # baseline-on-migrate stays off: this is a greenfield schema, nothing exists to baseline, and
  # enabling it would let V1 be skipped in silence against a database that already holds objects.
  # Destructive clean is refused outright.
  #
  # Version 11 of the migration tool resolves PostgreSQL support from a separate artefact declared
  # beside flyway-core in pom.xml; without it the build still succeeds and the application then fails
  # at run time, so the two must stay declared together.
  flyway:
    enabled: true
    # See docs/decision-log.md DL-102.
    locations: classpath:db/migration
    target: "2"
    baseline-on-migrate: false
    validate-on-migrate: true
    clean-disabled: true

  # -----------------------------------------------------------------------------------------------
  # BATCH ORCHESTRATION. Jobs run ON DEMAND ONLY - through the job-launch surface, through the
  # ordered queue bridge that replaces the legacy online-to-batch hand-off, or from a test - and
  # never at context start. Restarting a production deployment must not fire a posting run, and an
  # implicit start-up run would also write rows before any fixture comparison could read them and
  # would make every measured step duration meaningless. The value is inherited as false from
  # application.yml and restated here so the production posture is stated independently of it.
  #
  # The batch framework's own metadata tables are NOT provisioned at start-up, here or anywhere: the
  # value is `never` under EVERY profile, and V1_1__create_batch_metadata.sql creates the six tables
  # and three sequences instead. So every piece of production schema arrives through a reviewed
  # migration and nothing else.
  #
  # This file previously carried `never` while NO migration created those tables, and while local and
  # test let the framework create its own. Production was therefore the single environment in which a
  # job launch would have failed on a missing relation, and the two environments that could have
  # revealed it were the two configured not to. `never` everywhere plus one migration removes both
  # halves of that: there is exactly one owner, and local and test exercise it.
  batch:
    job:
      enabled: false
    jdbc:
      initialize-schema: never

  # -----------------------------------------------------------------------------------------------
  # CLOUD INTEGRATION - object store for batch file staging, an ordered queue for the single
  # online-to-batch bridge, and a topic for job-completion fan-out.
  #
  # NO ENDPOINT OVERRIDE IS DECLARED, AND THAT ABSENCE IS THE POINT. An override exists solely so the
  # local and test profiles can aim these three clients at the LocalStack Community container the
  # Compose stack runs. Left behind in production it would be silent and total: every publish and
  # every upload would be accepted by a client addressing a host that does not serve them, with no
  # start-up error naming the cause. So this profile declares no global override and no per-client
  # override, and the clients resolve the real service endpoints for the region below. Neither a
  # paid emulator tier nor an activation value for one has any place in this file - emulation is a
  # local concern only.
  #
  # NO STATIC CREDENTIAL PROPERTY IS DECLARED EITHER. The reasoning is recorded in the environment
  # inventory above: with none present, the SDK's default provider chain resolves a role, and the
  # placeholder pair the local profile uses for the emulator must never be carried across to here.
  #
  # The region is required rather than defaulted, and guarded. application.yml supplies a fallback so
  # a developer can start without preparing an environment; a production deployment silently landing
  # in whatever region that fallback names is a different matter, so the fallback is removed here.
  # Removing it is not by itself enough - the region is bound as a configuration-properties value, so
  # an unset variable would bind the literal text and the SDK would reject it as an unknown region
  # rather than reporting a variable nobody set. The guard at the head of this file reports it
  # correctly, before any client is built. See docs/decision-log.md DL-105.
  #
  # Path-style addressing is off. It is on locally only because the emulator does not serve
  # virtual-hosted bucket subdomains.
  cloud:
    aws:
      region:
        static: ${AWS_REGION}
      s3:
        path-style-access-enabled: false

# ===================================================================================================
# TRANSPORT SECURITY.
#
# The prior effort left transport security unconfigured; it is configured HERE, and this profile is
# the only place it belongs. A bearer token and a field sealed at rest are both worthless over
# plaintext: the token can be lifted from the wire and replayed until it expires, and the sealed value
# is sealed only at rest, so it travels in the clear the moment an endpoint decrypts it for a
# response. Requiring transport security is therefore not an independent hardening step but the
# condition under which the signing material and the field-encryption key mean anything at all.
#
# THE KEY STORE IS SUPPLIED BY THE ENVIRONMENT, AND ITS CREDENTIAL HAS NO FALLBACK. The location, the
# format and the key alias are externalised too, so one image runs in any deployment without an edit;
# they carry no fallback either, because a guessed key store path fails in a confusing way and a
# guessed alias picks an arbitrary entry out of a store that holds more than one.
#
# WHERE A LOAD BALANCER TERMINATES TLS, encryption is still required on the hop from that balancer to
# this process, which is what these settings provide; terminating once at the edge and running
# plaintext inside is a weaker posture, not an equivalent one. The forwarded-header strategy below is
# what makes that arrangement correct rather than merely encrypted: without it the application would
# build redirect and location URLs from its own local scheme, host and port instead of the ones the
# client actually used, and would attribute every request to the balancer's address rather than to the
# caller. With it, generated URLs and client-address resolution both follow the forwarded headers.
#
# THE BOUNDARY OF THIS FILE'S AUTHORITY, STATED EXPLICITLY. What is configured here is the
# APPLICATION-SIDE SURFACE and nothing beyond it. No certificate is issued, requested or bundled, no
# key store is generated, no ingress or listener is defined, and no infrastructure resource of any
# kind is created by this module. Provisioning those is outside this migration's authority and belongs
# to whoever operates the deployment; this file only states what the application expects to be handed.
#
# ALL FOUR KEY-STORE SETTINGS ARE GUARDED. They are bound as a configuration-properties object, so an
# unset variable binds the literal placeholder text and the embedded server then fails while opening a
# file whose name is that text - a confusing report of a missing file rather than a plain report of a
# missing variable, and one raised only after the context has otherwise been built. The guard
# described at the head of this file refuses all four before the server is created, and reports them
# together rather than one per restart. See docs/decision-log.md DL-105.
#
# The session cookie attributes are belt and braces. The migrated interface is stateless - navigation
# state travels in the token rather than in a server-side session, exactly as it travelled in the
# legacy communication area - so no session is expected. Should any framework component create one
# anyway, the cookie is confined to encrypted transport, hidden from scripts, and not sent on
# cross-site requests.
#
# A framework error page returns a status and nothing else: no message, no binding detail, no stack
# detail. A failed request is rendered by this module's own handler into its published error contract,
# whose per-field states carry the two conditions the legacy screens signalled by changing a field's
# display attribute; the framework page is only the fallback, and it must not narrate internals.
# ===================================================================================================
server:
  ssl:
    enabled: true
    key-store: ${CARDDEMO_TLS_KEYSTORE}
    key-store-password: ${CARDDEMO_TLS_KEYSTORE_PASSWORD}
    key-store-type: ${CARDDEMO_TLS_KEYSTORE_TYPE}
    key-alias: ${CARDDEMO_TLS_KEY_ALIAS}
  forward-headers-strategy: framework
  servlet:
    session:
      cookie:
        secure: true
        http-only: true
        same-site: strict
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never

# ===================================================================================================
# OBSERVABILITY - NARROWED, BUT PRESENT.
#
# THE FOUR MANAGEMENT VALUES BELOW RESTATE THE SHARED BASELINE RATHER THAN NARROWING IT, and the
# duplication is deliberate. application.yml is itself fail-closed: it publishes these same three
# endpoints and answers the probe with an aggregate status alone, and it is the LOCAL overlay that
# widens both. Restating them here is a second, independent statement of the production posture, so a
# future edit that reopens something in the shared baseline cannot silently reopen it in production by
# inheritance. They are not redundant lines to be tidied away.
#
# TWO ENDPOINTS MUST REMAIN REACHABLE, AND NARROWING MUST NOT REACH THEM. Each is resolved literally
# by a sibling file, and the same image runs under every profile:
#
#   /actuator/health      the HEALTHCHECK target of carddemo-java/Dockerfile and the readiness gate
#                         anything waiting on this application depends upon
#   /actuator/prometheus  the scrape target of config/prometheus/prometheus.yml and the surface every
#                         panel of config/grafana/dashboards/carddemo-overview.json reads. It is also
#                         where the performance baseline is established
#
# THE BASE PATH IS INHERITED AND DELIBERATELY NOT RESTATED. application.yml states /actuator once, and
# those two sibling files resolve it literally. Repeating it here would create a second place for it to
# drift; inheriting it means there is exactly one.
#
# ONE INTERACTION WORTH RECORDING, because it is easy to misread as a break. The container health
# check and the local scrape job both speak plaintext, and the image ships with the local profile
# selected, so they work as written for the profile they were built for. A deployment that selects
# THIS profile enables in-JVM transport security above, so its probe and its scrape must address the
# same two paths over HTTPS. The paths and the published set are unchanged either way - only the
# scheme differs, and it differs because this profile requires encryption.
#
# EVERYTHING ELSE IS CLOSED. Nothing that enumerates resolved configuration, the bean graph, the
# request mappings, the applied migrations or the registered meters is published; nothing that dumps
# memory or threads is published; nothing that rewrites a log level at run time or stops the process is
# published. Each describes or controls the running system rather than serving it, and the scrape
# endpoint already gives the collector everything it needs. The local overlay adds them back, because
# diagnosing on a developer's own machine is what they are for.
#
# THE HEALTH PROBE ANSWERS WITH AN AGGREGATE STATUS AND NO COMPONENT DETAIL. Component detail is
# genuinely useful - it is how a failed migration or an unreachable database surfaces in the probe body
# instead of only in the log - but the payload that carries it also names every health contributor, the
# database product and version, and the validation query, which together describe a system's internals
# to whoever can reach the probe. Withholding it entirely is stronger than releasing it to an
# authorised caller, and it costs nothing operationally, because the same failure is already in the
# structured log with far more context. Diagnosis belongs to the profile where diagnosis happens, and
# the local overlay opens both settings there.
#
# THE SAMPLING FRACTION BELOW IS A SAMPLING DECISION AND NOT A PERFORMANCE TARGET. It governs how many
# traces are exported, nothing more. It is not a threshold, it does not encode an expectation about
# latency or volume, and it must not be read as one or "corrected" into one.
#
# Appender selection, the structured encoder and the correlation fields live in logback-spring.xml,
# which carries per-profile appenders. Only levels are set here, so verbosity can move without
# restating the log layout.
# ===================================================================================================
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: never
      show-components: never
  tracing:
    enabled: true
    sampling:
      probability: ${CARDDEMO_TRACING_SAMPLE_RATE:0.1}
  otlp:
    tracing:
      # NO FALLBACK, and guarded. The sample rate above may default - it is a sampling decision, not
      # a destination - but a collector address must not: a defaulted address would send production
      # spans to whatever host the fallback named, or silently to nothing. An unset variable would
      # otherwise bind the literal placeholder text and the exporter would treat it as a malformed
      # address at export time, long after start-up. See docs/decision-log.md DL-105.
      endpoint: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT}

# Restated for the same reason as the management block above: both switches - the generated interface
# description and its viewer - are inherited disabled from application.yml, and this second statement
# means a future edit that reopens either one in the shared baseline cannot reach production by
# inheritance. Served openly, the document is a complete map of every endpoint, field and declared
# error of the migrated screen contract. The viewer switch is restated for that inheritance reason
# alone - the browser asset bundle it would need is excluded from the starter in pom.xml, so no
# profile has a viewer to serve. Neither published path is restated here, so neither can drift. See
# docs/decision-log.md DL-088.
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

logging:
  level:
    root: WARN
    com.carddemo: INFO
    org.springframework: WARN
    org.hibernate: WARN
    org.flywaydb: INFO

# ===================================================================================================
# APPLICATION NAMESPACE - the logical resource names the legacy job streams carried as dataset
# references and the CICS definition carried as resource definitions.
#
# THE KEY PATHS BELOW ARE IDENTICAL TO application-local.yml AND src/test/resources/application-test.yml,
# and only the values and the credential resolution differ. That is what lets a job parameter read
# identically under every profile. Two consequences follow and both are deliberate:
#   * the per-family object-store key prefixes are declared ONCE in application.yml and inherited
#     unchanged. Restating them here would be a partial re-declaration that dropped the families it
#     omitted, so no overlay restates them.
#   * region and endpoints are NOT in this namespace. They belong to the cloud integration's own
#     properties, set under spring.cloud.aws above, so the object-store, queue and notification clients
#     are configured through one mechanism rather than two.
#
# A NON-SECRET MAY CARRY A VALUE, AND THAT IS NOT A WEAKENING OF THE NO-DEFAULT RULE. The rule applies
# to secrets and to deployment-specific locations; it must not be over-generalised into "nothing may
# have a value". The four resource names below are MANDATED by the migration plan rather than chosen
# here, they are published identifiers rather than credentials, and they must be byte-identical in
# application.yml, this file, the test overlay, docker-compose.yml, localstack/init/01-create-aws-resources.sh
# and the running emulator. Carrying the canonical value while remaining environment-overridable is
# what keeps those six places in agreement; a bare reference would leave the canonical name recorded
# nowhere and let one deployment disagree with the provisioning script in silence. Knowing a queue's
# name grants nothing - reaching it needs the role that this profile deliberately does not hardcode.
#
# THE QUEUE IS AN EXTERNAL INTERFACE CONTRACT, AND THE SOLE ONLINE-TO-BATCH BRIDGE IN THE ESTATE. The
# legacy system wrote to a CICS transient-data queue from exactly one site. Its declared behaviour is
# reproduced rather than approximated:
#
#   fixed-width 80-character records  one card per message; record-length carries that width so the
#                                     publisher asserts it instead of assuming it
#   one message per card              no batching, no concatenation, no grouping of cards into a block
#   writes append                     so ORDER IS PART OF THE CONTRACT. Hence a first-in-first-out
#                                     queue and ONE stable message-group id: order survives only
#                                     within a single group, and a standard queue would reorder
#                                     without saying so
#   a write failure was tolerated     fail-on-error false keeps exactly that, logging the publish
#                                     failure and continuing rather than aborting the caller
#   publish only                      nothing in this module consumes from this queue
#   the queue pre-existed first use    so it must be provisioned before the application starts rather
#                                     than created lazily on first publish
#
# The .fifo suffix on the queue name is not decoration: the queue service rejects a first-in-first-out
# queue whose name omits it, which is a start-up failure rather than a style preference.
#
# THE QUEUE KEEPS ITS LEGACY RESOURCE NAME. The name is JOBS.fifo: the transient-data queue name the
# estate used, plus the single suffix the queue service requires of a first-in-first-out queue, and no
# other transformation. Namespacing it was considered and rejected, because the resource name is itself
# part of the frozen inventory and no exception authorises editing it, and because a well-formed name
# that names nothing is exactly the input a create-on-absence default would resolve by provisioning a
# queue nothing consumes - a submission would report complete and the cards would sit unread. The
# collision concern that namespacing answered is a deployment concern, and the environment override
# above already answers it without changing what the module ships. See docs/decision-log.md DL-092.
#
# The frozen operator message emitted when a submission fails is unaffected either way: it names the
# transient-data queue verbatim as JOBS, without a suffix, and is asserted character for character. It
# is frozen text rather than a reference to the resource, so nothing composes one from the other and
# the suffix cannot reach it.
# ===================================================================================================
carddemo:
  aws:
    s3:
      bucket: ${CARDDEMO_S3_BUCKET:carddemo-batch-staging}
    sqs:
      # NO DEFAULT. A deployment names its own queue, and a fallback here would be a placeholder
      # that started cleanly and published nowhere. The canonical name is JOBS.fifo, recorded in
      # application.yml and in the comment above; production must still be told it explicitly.
      #
      # The publisher does refuse a name that omits the first-in-first-out suffix - but it refuses it
      # when the publisher is constructed, and an unset variable would have reached it as the literal
      # text ${CARDDEMO_SQS_QUEUE}, which carries no suffix and would therefore be reported as a
      # malformed queue name rather than as a variable a deployer forgot to set. The guard described
      # at the head of this file reports the absence for what it is, and earlier. See
      # docs/decision-log.md DL-105.
      job-submission-queue: ${CARDDEMO_SQS_QUEUE}
      message-group-id: ${CARDDEMO_SQS_MESSAGE_GROUP_ID:carddemo-job-submission}
      # The 80-character card width and the tolerate-a-publish-failure behaviour are NOT declared as
      # properties. Both are fixed by the legacy queue definition rather than chosen by a deployment,
      # and nothing in the module reads them: the publisher holds the width as a constant it checks
      # each card against, and it catches and reports a publish failure instead of rethrowing.
      # Declaring them here would read as adjustable while changing nothing.
    sns:
      job-notification-topic: ${CARDDEMO_SNS_TOPIC:carddemo-job-notifications}
  security:
    # -------------------------------------------------------------------------------------------
    # SIGNING MATERIAL. A bare environment reference with NO fallback, and the guard described at the
    # head of this file is what turns that into an aborted start rather than a stated hope. This key
    # is the clearest illustration of why the guard was needed: the settings record that binds it
    # already carries a not-blank constraint, and with the variable unset the value binds as the
    # literal text ${CARDDEMO_JWT_SECRET}, which is sixteen characters and therefore not blank. The
    # constraint passes, the context refreshes, and tokens are signed with the text of a placeholder
    # anybody who read this repository could reproduce. The token replaces the state the legacy
    # pseudo-conversation carried in its communication area across turns, so forging one forges a
    # whole navigation identity. See docs/decision-log.md DL-105.
    #
    # THE ISSUER AND THE LIFETIME ARE NOT SECRETS, so they carry values. The issuer is a token
    # claim naming this module and is deliberately not the metric service label; neither should be
    # edited to match the other. The lifetime is shorter here than the local profile's, because a
    # long-lived local token is a convenience and a long-lived production token is exposure.
    #
    # DOCUMENTED PARITY EXCEPTION - the one place where the no-hardcoded-credentials requirement
    # outranks byte-for-byte faithfulness, recorded as such in docs/decision-log.md. The legacy
    # sign-on record held an eight-character cleartext password field and the sign-on program
    # compared the entered value against it directly. Reproducing that comparison would satisfy
    # parity and violate the credential requirement, so this module's credential column is sized
    # for a BCrypt hash instead and no component may store or compare a cleartext credential. No
    # value from the legacy record is restated anywhere in this module.
    #
    # ROLE GATING DERIVES FROM THE LEGACY USER-TYPE FIELD, unchanged in meaning. An identity of the
    # administrative type reaches the administrative surface and is the only kind permitted the
    # user-management endpoints; every other identity reaches the main surface. That is exactly how
    # the CICS transaction table gated the administrative transactions, so the authorisation
    # decision is carried across rather than redesigned.
    jwt:
      issuer: carddemo-java
      secret: ${CARDDEMO_JWT_SECRET}
      expiration: ${CARDDEMO_JWT_EXPIRATION:PT30M}
    # -------------------------------------------------------------------------------------------
    # FIELD-ENCRYPTION KEY. A bare environment reference with NO fallback, guarded on the same terms
    # as the signing material and for a stronger reason: a missing key must abort start-up rather
    # than let regulated customer identifiers be sealed under something accidental, because a value
    # sealed under the wrong key is not recoverable by fixing the configuration afterwards. The
    # consuming service does decode this value and check its length, so a malformed key was already
    # caught - but only when that service was constructed, and an EMPTY variable would have reached
    # it as an empty string rather than as an absence. The guard stops both cases earlier, and names
    # the variable rather than the malformed value. See docs/decision-log.md DL-105.
    #
    # The customer record carries two regulated identity values in clear text on the mainframe - a
    # nine-digit national identifier and a twenty-character government-issued identifier - and
    # neither is stored in that form here. Both are sealed into an authenticated, versioned
    # envelope before they reach a column, and the entity refuses any value that is not already
    # sealed, so cleartext cannot reach the database through application code.
    #
    # DOCUMENTED PARITY EXCEPTION, in the same class as the hashing substitution above: encrypting
    # at rest is a divergence from the legacy design rather than a rendering of it. It changes no
    # record image, no field offset and no output byte, and it is written up in docs/decision-log.md
    # together with the gap that is deliberately NOT closed here - the legacy design applies no
    # field-level protection to the card account number or its verification value, no requirement
    # introduces one, and inventing one would be unrequested feature work.
    field-encryption:
      key: ${CARDDEMO_FIELD_ENCRYPTION_KEY}
    # -------------------------------------------------------------------------------------------
    # TRANSPORT IS REQUIRED. Inherited as required from application.yml and restated here so the
    # production posture is stated independently of what the shared baseline happens to say. Only
    # the local and test overlays relax it, and each states its own relaxation, so the concession is
    # visible in the profile that takes it rather than inherited silently. Production never
    # re-requires this after a relaxation - it simply never relaxes it. See docs/decision-log.md
    # DL-098.
    #
    # Recorded alongside it, so that stronger behaviour is not mistaken for a regression: every
    # legacy application file was defined with uncommitted read integrity, no recovery and no
    # journaling, with safety resting solely on a locking update model plus a before-and-after image
    # comparison performed by the programs themselves. The read-committed isolation and the
    # entity-version checks used here are a STRICT IMPROVEMENT on that baseline, and the reasoning
    # is in docs/decision-log.md.
    require-https: true
