#
# PRODUCTION profile.
#
# HARD RULE (AAP §0.8.1): "No hardcoded credentials - secrets via environment variables or vault
# references", applied literally, INCLUDING the absence of defaults. Every placeholder below is
# written as ${VAR} with NO `:default` fallback, so a missing secret aborts startup instead of
# silently binding a placeholder.
#
# Required environment variables (startup fails if any is absent):
#   CARDDEMO_DB_URL                  e.g. jdbc:postgresql://db.internal:5432/carddemo
#   CARDDEMO_DB_USERNAME
#   CARDDEMO_DB_PASSWORD
#   CARDDEMO_JWT_SECRET              >= 32 bytes of entropy for HMAC signing
#   CARDDEMO_AWS_ACCESS_KEY_ID       omit BOTH aws credential lines to use an IAM role instead
#   CARDDEMO_AWS_SECRET_ACCESS_KEY
#   AWS_REGION
#   CARDDEMO_S3_BUCKET
#   CARDDEMO_SQS_QUEUE
#   CARDDEMO_SNS_TOPIC
#   OTEL_EXPORTER_OTLP_TRACES_ENDPOINT
#
# Seed migrations are deliberately absent from the Flyway location list: production migrates
# schema (V1) and indexes (V2) only and never inherits sample data or seeded credentials.

spring:
  datasource:
    url: ${CARDDEMO_DB_URL}
    username: ${CARDDEMO_DB_USERNAME}
    password: ${CARDDEMO_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${CARDDEMO_DB_POOL_MAX:10}
      minimum-idle: ${CARDDEMO_DB_POOL_MIN_IDLE:2}

  jpa:
    show-sql: false
    hibernate:
      ddl-auto: validate

  flyway:
    locations: classpath:db/migration
    validate-on-migrate: true
    clean-disabled: true

  batch:
    jdbc:
      # Batch metadata tables are provisioned by a controlled migration, never by the app.
      initialize-schema: never

  cloud:
    aws:
      region:
        static: ${AWS_REGION}
      credentials:
        # Remove these two lines to use the default AWS credentials provider chain
        # (EC2/ECS/EKS instance role, web identity token, or SSO) instead of static keys.
        access-key: ${CARDDEMO_AWS_ACCESS_KEY_ID}
        secret-key: ${CARDDEMO_AWS_SECRET_ACCESS_KEY}
      s3:
        path-style-access-enabled: false

server:
  # Transport security is terminated at the load balancer / ingress in the reference deployment;
  # the application trusts and honours the forwarded protocol headers and requires HTTPS.
  forward-headers-strategy: framework
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never
  # In-process TLS (uncomment and supply an SSL bundle when terminating TLS in the JVM):
  # ssl:
  #   enabled: true
  #   bundle: carddemo

management:
  endpoints:
    web:
      exposure:
        # Minimal surface in production; no env/configprops/beans exposure.
        include: health,info,prometheus
  endpoint:
    health:
      show-details: never
      show-components: never
  tracing:
    sampling:
      probability: ${TRACING_SAMPLE_RATE:0.1}
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT}

logging:
  level:
    root: WARN
    com.carddemo: INFO
    org.springframework: WARN
    org.hibernate: WARN

carddemo:
  aws:
    s3:
      bucket: ${CARDDEMO_S3_BUCKET}
    sqs:
      job-submission-queue: ${CARDDEMO_SQS_QUEUE}
    sns:
      job-notification-topic: ${CARDDEMO_SNS_TOPIC}
  security:
    jwt:
      # No fallback. A missing value must fail startup.
      secret: ${CARDDEMO_JWT_SECRET}
      expiration: ${CARDDEMO_JWT_EXPIRATION:PT30M}
    require-https: true
