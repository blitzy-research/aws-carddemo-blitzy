# LOCAL profile overlay - binds the application.yml baseline to carddemo-java/docker-compose.yml.
#
#   docker compose up -d                           # postgres + localstack + jaeger
#   docker compose --profile observability up -d    # adds prometheus + grafana
#   ./mvnw spring-boot:run -Dspring-boot.run.profiles=local
#
# The compose stack runs NO application container: the application is launched on the host against
# published container ports, so every default below is the value that actually takes effect. Each is
# still written as ${VARIABLE:default} so the CLONE_INDEX port-offset scheme in docker-compose.yml,
# or a container-network deployment supplying service DNS, can redirect one endpoint without editing
# this file. The module image sets SPRING_PROFILES_ACTIVE=local, so an image run picks this up too.
#
# This overlay overrides endpoints, credentials and verbosity only. It introduces no key prefix that
# application.yml does not already own, and it never narrows a surface a sibling file resolves
# literally.
#
# The bucket, queue, message-group id and topic bound here must be byte-identical in application.yml,
# application-test.yml, docker-compose.yml, localstack/init/01-create-aws-resources.sh and the
# running emulator. A disagreement yields a stack that starts cleanly and fails on first publish with
# no start-up error naming the cause.
#
# -------------------------------------------------------------------------------------------------
# PROPERTY CONTRACT - the key paths this module's own configuration types bind against
#
#   These paths are the published contract between this file, application.yml, the test overlay,
#   the production overlay and the Java code that reads them. They are listed here because a
#   configuration-properties type cannot state its own expectations to a reader of this file.
#
#     carddemo.aws.region                       region every client resolves its endpoints in, and
#                                               the region the four resources are provisioned in.
#                                               Declared ONCE in application.yml and inherited here;
#                                               the spring.cloud.aws region setting below derives
#                                               from it rather than restating the value
#     carddemo.aws.endpoint-override            address that aims every client at the emulator instead
#                                               of the real service. OPTIONAL, and the only key here
#                                               that is: production declares none, and an absent
#                                               override is what makes a client resolve its region's
#                                               own endpoint
#     carddemo.aws.s3.batch-staging-bucket      object-store bucket used for batch file staging
#     carddemo.aws.sqs.job-queue                FIFO queue name; the .fifo suffix is REQUIRED
#     carddemo.aws.sqs.message-group-id         one stable group id, which is what preserves
#                                               append order across a multi-message submission
#     carddemo.aws.sns.job-notification-topic   topic for job-completion / operational fan-out
#     carddemo.security.jwt.issuer              token issuer claim
#     carddemo.security.jwt.secret              signing material - see the security block below
#     carddemo.security.jwt.expiration          token lifetime, as an ISO-8601 duration
#     carddemo.security.field-encryption.key    the AES-GCM key for the encrypted personal-data
#                                               columns, as Base64 that decodes to exactly 32 bytes.
#                                               There is no salt property and no key derivation: the
#                                               decoded bytes ARE the key, and each sealed value
#                                               carries its own random 12-byte initialisation vector
#                                               inside the envelope, so two seals of one value differ
#     carddemo.security.require-https           transport expectation for this profile
#     carddemo.security.anonymous-metrics-scrape  whether the Compose collector may scrape without
#                                               a credential - opened here, closed in the baseline
#
#   THESE SIX PATHS UNDER carddemo.aws ARE THE MIGRATION PLAN'S OWN CONTRACT, and AwsProperties binds
#   exactly them. An earlier revision of this overlay published a different set here - s3.bucket,
#   sqs.job-submission-queue, six s3.prefix.* keys, and no region or endpoint key - and the binder was
#   written to match, so every binding test passed against a contract the plan does not state. The plan
#   is the authority for these paths; this list follows it.
#
#   The region and the endpoint override ARE in the carddemo namespace, and the AWS integration's own
#   properties under spring.cloud.aws further down derive from them: the region reads
#   ${carddemo.aws.region}, and the four endpoint settings state the same expression this file binds to
#   carddemo.aws.endpoint-override. One fact per profile, stated once, so the two namespaces cannot
#   disagree about which service a client addresses. The CREDENTIALS remain outside the carddemo
#   namespace entirely: the software development kit resolves them through its own provider chain, and
#   no credential is bound, read or logged by any carddemo configuration type.
#
# -------------------------------------------------------------------------------------------------
# RESOURCE NAMES - one set, agreed across six places
#
#   The bucket, queue, group id and topic below must be byte-identical in every one of:
#     src/main/resources/application.yml            (baseline defaults)
#     src/main/resources/application-local.yml       (this file)
#     src/test/resources/application-test.yml        (Testcontainers overlay)
#     docker-compose.yml                             (passes them into the emulator container)
#     localstack/init/01-create-aws-resources.sh     (creates them)
#     the running emulator itself
#   The bucket, queue and topic are provisioned resources and therefore appear in all six. The
#   group id is not a resource at all - it is an attribute carried on each published message - so
#   it is bound in the three profile files that configure the publisher and is deliberately absent
#   from the compose file, from the bootstrap script and from the emulator, where it would be
#   configuration that provisions nothing.
#   A disagreement yields a stack that starts cleanly and then fails on the first publish, with no
#   start-up error pointing at the cause. All four names are read back out of the running stack and
#   confirmed to match the values bound here.
#
#   THE NAMES ARE CROSS-FILE CONTRACTS, NOT LOCAL CHOICES. Each of the five values below occurs
#   byte-identically in this file, in docker-compose.yml and in the emulator bootstrap script, so
#   changing one here changes nothing until all three change together:
#     carddemo-batch-staging       object-store bucket
#     carddemo-jobs.fifo           first-in-first-out submission queue; the suffix is demanded by the
#                                  queue service, and the name itself is mandated by the plan
#     carddemo-job-submission      message group id
#     carddemo-job-notifications   notification topic
#     us-east-1                    region
#
#   Two of them additionally carry a hard technical constraint. The queue name must end in .fifo,
#   because a FIFO queue is rejected outright without that suffix - that is a start-up failure, not
#   a style preference. The group id must be one stable value, because append order is preserved
#   only within a single message group, and append order is the part of the legacy queue contract
#   that acceptance drains a real queue to verify.
#
#   NAMING RATIONALE - recorded rather than left implicit. All four resource names are MANDATED by the
#   migration plan and required byte-identically; none of them is this file's choice to make. Each is
#   also expressed in the naming form its own service requires, which is why only the queue carries a
#   suffix. The queue stands in for the CICS transient-data queue named JOBS, and the emulator
#   bootstrap this module ships provisions it under the mandated name.
#
#   THE SET IS UNIFORM, AND AN EARLIER REVISION BROKE THAT DELIBERATELY. The queue was renamed to
#   carddemo-jobs.fifo on the argument that the legacy transient-data queue name is itself part of the frozen
#   inventory, that no exception authorises editing it, and that the module should therefore agree with
#   whatever the environment provisions. The argument is worth stating because it is plausible, and it
#   fails at each step. What the plan freezes for this resource is the target name it prescribes; the
#   legacy name is carried instead by the operator-visible failure message, which is the contract
#   actually compared byte for byte, so reproducing the external interface means reproducing what its
#   consumers observe rather than what its infrastructure is called; and deferring to the provisioned
#   resource inverts the dependency, because the bootstrap script in this module is what creates the
#   queue. The name is restored to carddemo-jobs.fifo. See docs/decision-log.md DL-092 for the full
#   record, DL-045 for how the four names divide between legacy-derived and module-namespaced, and
#   DL-047 for why this overlay widens the shared baseline's fail-closed defaults one concession at a
#   time rather than in bulk.
#
#   WHAT SURVIVES FROM THAT ARGUMENT IS ITS WARNING, and it is kept: a well-formed name that names
#   nothing is exactly the input a create-on-absence default resolves by provisioning a queue nothing
#   consumes, so a submission would report complete while the cards sat unread. That is why the value
#   appears once per place and why a disagreement is made loud rather than silent. A collision with an
#   unrelated queue in a shared account remains a deployment concern, answered by the environment
#   override rather than by renaming what the module ships.
#
#   A namespaced name would also disagree with the resource the environment actually provisions,
#   which is precisely the valid-but-wrong-name failure that the queue-not-found strategy inherited
#   from application.yml makes loud instead of silent. Carrying the legacy name and setting that
#   strategy are two halves of one guarantee.
#
#   The operator-visible message text is unchanged by any of this. It names the transient-data queue
#   verbatim as JOBS with no suffix, is asserted character for character, and is frozen text rather
#   than a reference to the resource - nothing composes one from the other. The 80-byte record width,
#   the append ordering and the ignore-on-error semantics remain preserved exactly and asserted
#   independently of what the queue is called. See docs/decision-log.md DL-092.
#
# WHAT IS DELIBERATELY ABSENT - each absence is a decision, not an oversight
#   * No pool sizing, no pool time-out. See the datasource block.
#   * No heap figure, no worker-thread count, no latency, volume or availability figure anywhere,
#     in a property or in a comment. No numeric service level is documented in the legacy estate,
#     so performance here is MEASURED through the meters wired below and never asserted.
#   * No application-level cache. The legacy system had none, and adding one would move the very
#     latency and consistency behaviour the baseline is meant to record.
#   * No framework-managed initialisation script and no bootstrap SQL file. The versioned
#     migrations are the only path by which a table or a row is created.
#   * No paid-tier emulator setting and no activation token. The Community edition covers the
#     object store, the queue and the topic, which is the whole AWS surface this module uses.
# =================================================================================================

spring:

  # -----------------------------------------------------------------------------------------------
  # PostgreSQL 16, published by the compose stack on the host.
  #
  # CREDENTIALS: throwaway development values addressing a container on the developer's own machine,
  # matching what the compose stack provisions. They are acceptable HERE and nowhere else - the
  # production overlay resolves url, user and password from the environment with NO fallback, so a
  # missing secret aborts start-up rather than binding something harmless-looking.
  #
  # The pool stays at its shipped defaults: no legacy baseline exists to tune against.
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:carddemo}
    username: ${POSTGRES_USER:carddemo}
    password: ${POSTGRES_PASSWORD:carddemo}
    driver-class-name: org.postgresql.Driver

  # -----------------------------------------------------------------------------------------------
  # Statement echo, for this profile alone - the generated SQL is what makes a fixed-width mapping or
  # a truncating decimal store visible while parity evidence is gathered. ddl-auto is restated as
  # `validate` at the point of use to make it unambiguous that even the local profile authors no
  # schema.
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        highlight_sql: true

  # -----------------------------------------------------------------------------------------------
  # Schema evolution - versioned, forward-only, and the ONLY path by which an application table or a
  # seeded row is created. What makes this a LOCAL profile is two settings, and the first is the one
  # that matters: it ADDS THE SEED LOCATION, which production is refused, and it then lifts the shared
  # version ceiling so the scripts that location resolves are actually applied.
  #
  #   classpath:db/migration/schema                                            EVERY profile
  #     V1__create_schema.sql          the eleven application tables
  #     V2__create_indexes.sql         keys and alternate-index equivalents
  #
  #   classpath:db/migration/seed                                              local and test ONLY
  #     V3__seed_reference_data.sql    the nine measured ASCII reference datasets, 626 rows across
  #                                    nine tables
  #     V4__seed_user_security.sql     the ten sign-on identities, five administrative and five
  #                                    standard, each credential stored only as a hash
  #
  # THE SEED LOCATION IS ADDED HERE AND ONLY HERE (and identically in application-test.yml). This is the
  # mechanism AAP 0.3.1 and 0.4.2 require: FlywayConfig resolves V3 and V4 from profile-scoped locations
  # so a production deployment migrates schema and indexes without inheriting sample data or seeded
  # credentials. FlywayConfig refuses the seed location outright while the production profile is active,
  # so it is not merely unlisted there - it is unlistable.
  #
  # THE CEILING IS LIFTED AS WELL, because the two controls are stacked rather than alternative. The
  # shared baseline in application.yml pins spring.flyway.target to "2", which would stop a migration at
  # the schema even with the seed location resolved; this overlay raises it to latest, so a local
  # migration ends at V4. The production overlay resolves the schema location alone AND re-asserts
  # target: 2. See docs/decision-log.md DL-127, which supersedes DL-102 and DL-119.
  #
  # THE SHARED PARENT classpath:db/migration IS NEVER DECLARED, by this document or any other, and holds
  # no script. A location is scanned recursively, so naming the parent beside a child would resolve every
  # script twice and the migration tool would reject the repeated version. A seeded sign-on credential is
  # stored only as a hash regardless, so that even a mistake here leaks nothing.
  #
  # TWO THINGS COM.CARDDEMO.CONFIG.FLYWAYCONFIG DOES TO THIS BLOCK, neither of which this document
  # could do for itself:
  #
  #   1. It refuses `prod` activated alongside this profile, in either order, before any bean is
  #      instantiated. Overlapping property sources resolve by activation order, so `prod,local`
  #      would let this overlay overwrite the production overlay's data source location, signing
  #      material, field-encryption key, service endpoints and transport rule - and re-add the seed
  #      location to a deployment reading the production document. A profile document is selected BY
  #      the active-profile list and cannot see it, so the refusal has to live in code.
  #   2. It holds the seeded regulated identifiers to two invariants, through a callback registered
  #      for this profile and `test` alone. V3__seed_reference_data.sql inserts customer.govt_issued_id
  #      as an ENC1 envelope in every row - never as cleartext - and seeds customer.cust_ssn as NULL in
  #      all fifty, so on a delivered database there is nothing to convert. The callback nonetheless
  #      SEALS any unsealed value it finds, which guards a future edit to the seed, and it OPENS every
  #      stored value under the key this process actually holds, which guards the case the seal check
  #      cannot see: an envelope sealed under some OTHER key still looks exactly like an envelope, so
  #      recognising its shape proves nothing about whether this process can read it. A value that will
  #      not open fails start-up. Both halves are idempotent - an already-sealed value is left alone and
  #      opening a value changes nothing - so a re-run writes nothing. The pass runs on the after-migrate
  #      event, which Flyway raises AFTER the migration's own transaction has committed, in a
  #      transaction of the callback's own; the callback's class documentation states that boundary
  #      rather than claiming an atomicity the event does not offer.
  #
  # WHAT STOPS A DATABASE THIS OVERLAY SEEDED FROM ENDANGERING A LATER PRODUCTION RUN. Seeding writes
  # V3 and V4 rows into this database's migration history and fifty synthetic customer rows and ten
  # known sign-on identities into its tables. Neither the location list nor the ceiling above can undo
  # that, because both describe what THIS process applies, and neither is consulted about what some
  # earlier process already applied. So re-pointing a production connection string at this database,
  # or restoring a dump of it into a production instance, is a real path and it is not closed by
  # anything in this document. It is closed by com.carddemo.config.ProductionSeedRejectionCallback,
  # registered for `prod` alone, which refuses production start-up outright - before the first script
  # runs and before any application bean is instantiated - when the migration history records a seed
  # version, when user_security holds any of the ten seeded identities, or when five reference tables
  # match the seeded row counts simultaneously. Nothing else sees this state, and that was measured
  # rather than assumed: validate-on-migrate does NOT reject such a database, because version 11 of
  # the migration tool ignores future migrations by default, so applied versions 3 and 4 that the
  # production schema location cannot resolve are not a validation failure. It refuses rather than
  # cleaning: a production database holding these rows is an incident to be corrected, never data for
  # a start-up path to delete. ProductionSeedRejectionCallbackIT asserts all of it.
  #
  # clean-disabled is relaxed here and only here, so a developer iterating on a migration can drop
  # and re-apply. The baseline and the production overlay both forbid it.
  #
  # ONE-TIME NOTE: a local database created against an earlier revision of this module may carry
  # migration history that no longer matches the delivered scripts - a checksum for a script that has
  # since moved between locations, or a version that no longer exists. Flyway reports that as a
  # validation failure rather than silently reconciling it, which is the correct behaviour. Re-create
  # the database once (`docker compose down -v` for the Compose stack, or `./mvnw flyway:clean` with
  # the relaxed clean-disabled above). Test databases are per-run and are never affected.
  flyway:
    enabled: true
    # See docs/decision-log.md DL-127.
    #
    # BOTH DELIVERED LOCATIONS. The shared baseline declares the schema location alone, which is the
    # production posture; adding the seed location here is THE SETTING THAT MAKES THE SEEDS RESOLVABLE
    # AT ALL, and production is refused it outright by FlywayConfig. Both are restated in full rather
    # than inherited so this document reads completely on its own.
    #
    # The shared parent classpath:db/migration is never declared. A location is scanned recursively, so
    # naming the parent beside a child would resolve every script twice and Flyway would reject the
    # repeated version before executing anything.
    locations: classpath:db/migration/schema,classpath:db/migration/seed
    # AND THE CEILING IS LIFTED TO MATCH. The shared baseline pins target at "2", which would stop a
    # migration at the schema even with the seed location resolved, so both halves are required here.
    target: latest
    baseline-on-migrate: false
    validate-on-migrate: true
    clean-disabled: false

  # -----------------------------------------------------------------------------------------------
  # Batch orchestration. Jobs stay launch-on-demand: an implicit start-up run would write rows before
  # a fixture comparison could read them.
  #
  # initialize-schema is inherited as `always` from the baseline and is NOT overridden here. The six
  # framework metadata tables and three sequences are created by Spring Batch itself under this
  # profile exactly as they are under production, from the same bundled PostgreSQL script, so a job
  # launched locally runs against the same tables production will have. Setting a different value here
  # is what an earlier revision did in the opposite direction, and it produced the one failure mode
  # this arrangement exists to prevent: a job repository that exists in one environment and not in
  # another. The value is deliberately not restated in this document - inheriting it is what keeps the
  # two environments identical, and there is no local-only relaxation to be tempted by.

  # -----------------------------------------------------------------------------------------------
  # AWS integration, aimed at the LocalStack Community container.
  #
  # CREDENTIALS: the emulator accepts any non-empty pair and verifies nothing, so the values below are
  # deliberate placeholders and are NOT keys. Never substitute a real access key here.
  #
  # The endpoint override is applied globally AND restated per client, so no client can fall through
  # to a real AWS endpoint if the global setting is dropped. Path-style addressing is required because
  # the emulator does not serve virtual-hosted bucket subdomains; production turns it off.
  #
  # The same address is bound to carddemo.aws.endpoint-override further down, which is the key
  # AwsProperties binds and the form a consumer of that type reads; the region here is DERIVED from
  # carddemo.aws.region rather than restated, so the region is stated once in this stack of documents.
  cloud:
    aws:
      region:
        static: ${carddemo.aws.region}
      credentials:
        access-key: ${AWS_ACCESS_KEY_ID:localstack-placeholder-not-a-real-key}
        secret-key: ${AWS_SECRET_ACCESS_KEY:localstack-placeholder-not-a-real-secret}
      endpoint: http://${LOCALSTACK_HOST:localhost}:${LOCALSTACK_PORT:4566}
      s3:
        endpoint: http://${LOCALSTACK_HOST:localhost}:${LOCALSTACK_PORT:4566}
        path-style-access-enabled: true
      sqs:
        endpoint: http://${LOCALSTACK_HOST:localhost}:${LOCALSTACK_PORT:4566}
      sns:
        endpoint: http://${LOCALSTACK_HOST:localhost}:${LOCALSTACK_PORT:4566}

# Observability, bound to the compose stack. Two paths are resolved literally by sibling files and
# may not be narrowed here: /actuator/health is the HEALTHCHECK target of carddemo-java/Dockerfile,
# and /actuator/prometheus is the scrape target of config/prometheus/prometheus.yml and the surface
# every panel of config/grafana/dashboards/carddemo-overview.json reads.
#
# CROSS-FILE CONTRACTS - two paths here are resolved literally by sibling files and neither the
# paths nor their reachability may be narrowed by this overlay:
#
#   /actuator/health      the HEALTHCHECK target of carddemo-java/Dockerfile and the readiness gate
#                         anything waiting on this application depends upon. If it stops answering,
#                         the container never reports healthy.
#   /actuator/prometheus  the scrape target of config/prometheus/prometheus.yml, whose one application
#                         job reaches the application at app:8080 over the compose project network -
#                         the one target that configuration declares, and the service this module's
#                         compose stack publishes - and the surface every panel of
#                         config/grafana/dashboards/carddemo-overview.json reads. It is also where the
#                         performance baseline is measured. An application started on the host rather
#                         than beside the stack is therefore not collected by that job: read the
#                         endpoint directly, or run the application as part of the stack. Adding a host
#                         target to the same job is what an earlier revision did, and it doubled every
#                         series whenever both answered.
#
# EVERYTHING IN THIS BLOCK WIDENS A CLOSED BASELINE. application.yml publishes four endpoints -
# health, info, metrics and prometheus, each one resolved by a sibling file or by the performance
# baseline - and answers the health probe with an aggregate status alone, because that is the posture a
# profile should inherit when nobody chose one. This overlay opens the diagnostics that only make sense on
# a developer's own machine - resolved configuration, the bean graph, the request mappings, the
# applied migrations, and full health component detail - and it opens them HERE so that the
# concession is visible in the profile that takes it. Production does not narrow this list; it simply
# does not widen it. The individual-meter endpoint is NOT among the concessions: it is inherited from
# the shared baseline, because the performance baseline has to be readable in every profile.
#
# Traces are sampled in full so that a migrated flow can be followed end to end in the trace UI
# while acceptance evidence is gathered. Full fidelity is a local diagnostic choice, not a target.
# =================================================================================================
management:
  endpoints:
    web:
      base-path: /actuator
      exposure:
        # WIDENING THIS LIST WIDENS WHAT A CREDENTIAL REACHES, NEVER WHAT ANONYMITY REACHES.
        # com.carddemo.config.SecurityConfig permits exactly two paths beneath this base path - the
        # health probe and the Prometheus scrape endpoint - and authenticates everything else under it
        # with a rule placed after those two permits and before the catch-all. Every endpoint added
        # on this line beyond those two therefore requires a bearer token, including the ones that
        # describe the running system most completely: env and configprops publish the resolved
        # configuration, beans the wiring, flyway the schema history, mappings the route table and
        # loggers a writable log level. None of them is anonymous, and none becomes anonymous by
        # being listed here, because no rule anywhere permits this base path as a whole.
        include: health,info,metrics,prometheus,env,configprops,beans,flyway,mappings,loggers
  endpoint:
    health:
      # Reopened from the baseline's `never`. A failed migration or an unreachable container then
      # surfaces in the probe body itself, which is the fastest way to diagnose a compose stack
      # that will not come up. The payload names every health contributor and the database product
      # and version, which is why it is opened only here.
      show-details: always
      show-components: always
  tracing:
    enabled: true
    sampling:
      probability: 1.0
  otlp:
    tracing:
      # Two levels of override, narrowest first. OTEL_EXPORTER_OTLP_TRACES_ENDPOINT replaces the whole
      # address; failing that only the published OTLP/HTTP port is substituted, so the CLONE_INDEX
      # port-offset scheme in docker-compose.yml can move the sink between side-by-side stacks.
      endpoint: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:http://localhost:${JAEGER_OTLP_HTTP_PORT:4318}/v1/traces}

# The interface description, reopened from the baseline's disabled state. This is the profile it
# exists for: the document is how a developer reads the contract without reading the code. Its path
# comes from application.yml, so only the switch appears here and the path cannot drift between
# profiles.
#
# WHAT IS ACTUALLY SERVED HERE: identity metadata, the reusable component shapes and the
# bearer security scheme - and no endpoint inventory, because no request-mapped controller exists
# to contribute one. Fetching this address on a running local stack returns a document with an
# empty paths object, and that is the expected answer rather than a symptom of a broken overlay.
# The inventory is later bound and grows as the controllers derived from the 17 legacy screens
# arrive; this switch needs no change when they do. See docs/decision-log.md DL-101.
#
# Reopening it is safe HERE and nowhere else, and that is a judgement about what the document will
# carry rather than about how little it carries now. Once it describes the request and response
# shape of every endpoint, it is exactly what a developer wants and exactly what an unauthenticated
# caller should not be handed. On a developer's machine that is the whole point; on anything
# reachable by someone else it is a map handed to them. The production overlay does not turn it
# off - it inherits it off, and it inherits it off already, before there is anything to disclose.
#
# THIS SWITCH ALSO DECIDES WHETHER THE DOCUMENT MAY BE FETCHED WITHOUT A CREDENTIAL.
# com.carddemo.config.SecurityConfig binds this same key and adds the anonymous rule for the document
# address ONLY when the key is set, and it binds the address rather than restating it. So the profile
# that publishes the document is the profile that permits reading it, in one decision rather than two
# that could disagree: a profile leaving it unpublished has no anonymous rule for it, and a request
# for it there is refused rather than served. Nothing else in this overlay is reopened to anonymity.
#
# There is no interactive viewer to reopen, here or anywhere. The browser asset bundle is excluded
# from the starter in pom.xml, so no profile can render one. This overlay therefore inherits the
# disabled viewer switch rather than restating it - deliberately the opposite of the pattern used
# for every genuine concession above, because a switch restated in a profile reads as a choice that
# profile could reverse, and this one cannot be reversed by configuration at all. Fetch the document
# directly instead, for example `curl -s localhost:8080/v3/api-docs`. See docs/decision-log.md
# DL-088.
springdoc:
  api-docs:
    enabled: true

# Levels only; appender selection and the structured encoder live in logback-spring.xml. Raising the
# application package to DEBUG is the point of a local overlay: the migrated services log their
# decision points, and the migration tool logs each script it applies, so a start-up that stops short
# of the highest delivered version says so plainly. The framework packages stay at INFO so that
# signal is not buried.
#
# What DEBUG does not disclose: the services reached by this level log outcomes, status codes, format
# identifiers and their own message numbers, never the value a caller submitted. That is a property of
# the log statements rather than of this level, so raising the level here cannot turn a diagnostic
# into a disclosure - see docs/decision-log.md DL-100.
logging:
  level:
    com.carddemo: DEBUG
    org.flywaydb: INFO
    org.springframework.batch: INFO
    org.springframework.jdbc.core: INFO

# Application namespace - logical resource names, bound to what the compose stack provisions.
#
# THE QUEUE IS AN EXTERNAL INTERFACE CONTRACT. The legacy estate wrote to a CICS transient-data queue
# from exactly one site, and that write was its entire online-to-batch bridge. Its declared behaviour
# is reproduced rather than approximated:
#
#   fixed-width 80-character records  one card per message. The width is a constant in the publisher,
#                          which asserts every card's encoded byte count against it and rejects any
#                          other width; it is deliberately not a key here.
#   one message per card   no batching, no concatenation.
#   writes append          so ORDER IS PART OF THE CONTRACT. Hence a FIFO queue and a single stable
#                          message-group id: a standard queue would silently reorder.
#   a write failure was tolerated  and the publisher's structure keeps that: the write is caught and
#                          reported through the return value, never rethrown. Also deliberately not a
#                          key - see application.yml for why declaring these two as configuration was
#                          withdrawn, and docs/decision-log.md DL-094.
#   publish only           nothing in this module consumes from this queue.
#   the queue pre-existed first use  which is why the emulator bootstrap runs to completion before the
#                          application starts rather than creating it lazily.
#
# THE OBJECT STORE replaces the sequential output datasets and the generation-data-group bases that
# retained their history; retention becomes object versioning on the staging bucket rather than a
# generation limit. The key each staged object is written under is composed by the job that writes it,
# not configured, so one output family cannot overwrite another by configuration going stale.
#
# THE ENDPOINT OVERRIDE IS DECLARED HERE, in the profile that takes the concession, and it is the one
# key under this prefix that production leaves unset. It carries the same expression the four
# spring.cloud.aws endpoint settings above carry, and both are built from the same two variables, so a
# differently-published emulator is addressed by setting LOCALSTACK_HOST and LOCALSTACK_PORT and by
# editing nothing. An absent override does NOT fail closed - a client without one resolves the region's
# real public endpoint - which is why it is stated in every profile that must not reach a real account.
# The region is inherited from application.yml and deliberately not restated.
carddemo:
  aws:
    endpoint-override: http://${LOCALSTACK_HOST:localhost}:${LOCALSTACK_PORT:4566}
    s3:
      batch-staging-bucket: ${CARDDEMO_S3_BUCKET:carddemo-batch-staging}
    sqs:
      job-queue: ${CARDDEMO_SQS_QUEUE:carddemo-jobs.fifo}
      message-group-id: ${CARDDEMO_SQS_MESSAGE_GROUP_ID:carddemo-job-submission}
    sns:
      job-notification-topic: ${CARDDEMO_SNS_TOPIC:carddemo-job-notifications}
  security:
    # SIGNING MATERIAL: a development-only secret for a process talking to containers on one machine.
    # It must not be reused anywhere; it exists so `spring-boot:run` works without a prepared
    # environment. Production declares the same key as an environment reference with NO fallback, so
    # a missing secret aborts start-up. The issuer is restated rather than inherited so a locally
    # minted token is identifiable, and it is deliberately not the metric service label.
    #
    # BOUND AND USED, not declared and ignored. com.carddemo.config.JwtProperties binds and validates
    # these three keys and com.carddemo.config.JwtTokenProvider signs and verifies with them, so a
    # token minted locally is verified by the same material that minted it. The chain that consumes
    # them states every permitted route explicitly - see docs/decision-log.md DL-096. The value below is long
    # enough for the signature algorithm that class fixes; a shorter one stops start-up with a message
    # naming this key rather than failing later inside the signing library.
    #
    # The framework's own generated-user login is gone rather than dormant: SecurityConfig declares an
    # authentication manager, which withdraws the auto-configured in-memory user and the password that
    # would otherwise be written to this profile's log at start-up. Presenting a token is the only way
    # to authenticate here, exactly as in production.
    jwt:
      issuer: carddemo-java
      secret: ${CARDDEMO_JWT_SECRET:local-development-only-signing-secret-do-not-reuse-0123456789}
      expiration: ${CARDDEMO_JWT_EXPIRATION:PT8H}
    # THE ONE NON-PRODUCTION FIXTURE KEY. Base64 of exactly 32 bytes, as AES-256 requires; anything
    # else is refused at start-up by the service that binds it, naming this property.
    #
    # WHY THIS LITERAL IS SHARED RATHER THAN PER-PROFILE. The same value appears, byte for byte, in
    # this profile, in the packaged application-test.yml, and in the suite's own
    # src/test/resources/application-test.yml. That agreement is load-bearing, not tidiness.
    # V3__seed_reference_data.sql seeds fifty customer.govt_issued_id values as ENC1 envelopes; an
    # envelope opens under exactly one key; and V3 is applied by every non-production profile. Two
    # divergent development keys - which these files carried before - made the same seeded row
    # readable under one non-production profile and unreadable under the other, with the failure
    # surfacing only at the moment something actually decrypted it.
    #
    # It is worth nothing anywhere else. It seals fixture identifiers in a database that is rebuilt
    # from migrations, it is self-describing so it cannot be mistaken for a deployed key, and it must
    # not be reused. Production binds this same property as an environment reference with NO fallback,
    # so a missing key aborts start-up there, and production never applies V3 at all - spring.flyway
    # .target caps it at version 2 - so no production row is ever sealed under this literal.
    #
    # STATED AS A BARE LITERAL, DELIBERATELY, AND NOT AS ${CARDDEMO_FIELD_ENCRYPTION_KEY:<default>}.
    # This profile is FIXTURE-BEARING: V3 inserts fifty govt_issued_id envelopes that are fixed
    # literals in a committed script, and an envelope opens under exactly one key. An environment
    # override would therefore not rotate anything - it cannot re-key a literal - it would simply
    # leave fifty rows of regulated data unreadable, and the marker check that decides whether a
    # column holds an envelope cannot see that, because an envelope sealed under a foreign key still
    # looks like an envelope. The failure used to surface only at the moment something happened to
    # decrypt a row. Removing the override removes the ordinary way into that state; the key invariant
    # enforced by com.carddemo.config.SeededIdentifierSealingCallback refuses it however else it
    # arises, by OPENING every stored value at the end of each migration rather than recognising its
    # shape, and failing start-up on the first one that will not open. Production is the only profile
    # that resolves this property from the environment, and it has no fallback there for the opposite
    # reason: it owns real data and must never run under a default key.
    #
    # A developer who genuinely wants a different key rebuilds the database under it - the seeds then
    # apply, the envelopes are the ones this process produced, and everything opens. Editing this
    # literal alone leaves the committed envelopes behind and is refused at start-up.
    # See docs/decision-log.md DL-103.
    field-encryption:
      key: Y2FyZGRlbW8tbm9ucHJvZC1maXh0dXJlLWtleSEhISE=
    # RELAXES A REQUIRED BASELINE, and says so here rather than letting the concession be inherited.
    # application.yml requires transport security, because a bearer token lifted from plaintext can
    # be replayed until it expires and a field sealed at rest travels in the clear once an endpoint
    # has decrypted it for a response. Neither risk exists for a process addressing containers over
    # the loopback interface on one machine, which is the only situation this profile describes.
    # Production does not re-require HTTPS - it inherits the requirement.
    #
    # The relaxation is now load-bearing rather than decorative. SecurityConfig binds this key, and
    # when it is set it redirects every insecure request instead of serving it. Left at the baseline's
    # value, a plain `curl localhost:8080/...` against this profile would be answered with a redirect
    # to a port nothing is listening on. Clearing it here is what keeps local development over the
    # loopback interface workable, and it is scoped to this profile alone.
    # See docs/decision-log.md DL-098.
    require-https: false
    # OPENS A CLOSED BASELINE, and says so here rather than letting the concession be inherited.
    # application.yml closes anonymous metrics scraping, because the exposition carries per-endpoint
    # latency distributions, per-batch-step record counts, pool saturation and JVM internals - enough
    # for an unauthenticated network client to profile the workload. That risk does not exist for the
    # Compose collector at config/prometheus/prometheus.yml, which runs on this same machine, presents
    # no credential and addresses Compose service names.
    #
    # WITHOUT THIS THE PERFORMANCE GATE HAS NO DATA. Left at the baseline's value, the shipped
    # collector's scrape of /actuator/prometheus would be answered 401 by the rule that authenticates
    # everything under the management base path, every dashboard panel would resolve to nothing, and
    # the gate write-up would be empty. Opening it here is what makes local collection work, and it is
    # scoped to this profile alone. Production does not open it.
    anonymous-metrics-scrape: true
