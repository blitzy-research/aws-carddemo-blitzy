# LOCAL profile overlay - binds the application.yml baseline to carddemo-java/docker-compose.yml.
#
#   docker compose up -d                           # postgres + localstack + jaeger
#   docker compose --profile observability up -d    # adds prometheus + grafana
#   ./mvnw spring-boot:run -Dspring-boot.run.profiles=local
#
# The compose stack runs NO application container: the application is launched on the host against
# published container ports, so every default below is the value that actually takes effect. Each is
# still written as ${VARIABLE:default} so the CLONE_INDEX port-offset scheme in docker-compose.yml,
# or a container-network deployment supplying service DNS, can redirect one endpoint without editing
# this file. The module image sets SPRING_PROFILES_ACTIVE=local, so an image run picks this up too.
#
# This overlay overrides endpoints, credentials and verbosity only. It introduces no key prefix that
# application.yml does not already own, and it never narrows a surface a sibling file resolves
# literally.
#
# The bucket, queue, message-group id and topic bound here must be byte-identical in application.yml,
# application-test.yml, docker-compose.yml, localstack/init/01-create-aws-resources.sh and the
# running emulator. A disagreement yields a stack that starts cleanly and fails on first publish with
# no start-up error naming the cause.
#
# -------------------------------------------------------------------------------------------------
# PROPERTY CONTRACT - the key paths this module's own configuration types bind against
#
#   These paths are the published contract between this file, application.yml, the test overlay,
#   the production overlay and the Java code that reads them. They are listed here because a
#   configuration-properties type cannot state its own expectations to a reader of this file.
#
#     carddemo.aws.s3.bucket                    object-store bucket used for batch file staging
#     carddemo.aws.s3.prefix.*                  one key prefix per output family - declared ONCE in
#                                               application.yml and inherited unchanged; this
#                                               overlay must not restate it, because a partial
#                                               re-declaration would drop the families it omits
#     carddemo.aws.sqs.job-submission-queue     FIFO queue name; the .fifo suffix is REQUIRED
#     carddemo.aws.sqs.message-group-id         one stable group id, which is what preserves
#                                               append order across a multi-message submission
#     carddemo.aws.sqs.record-length            fixed width of a single submitted card image
#     carddemo.aws.sqs.fail-on-error            false => a publish failure is logged, not raised
#     carddemo.aws.sns.job-notification-topic   topic for job-completion / operational fan-out
#     carddemo.security.jwt.issuer              token issuer claim
#     carddemo.security.jwt.secret              signing material - see the security block below
#     carddemo.security.jwt.expiration          token lifetime, as an ISO-8601 duration
#     carddemo.security.field-encryption.key    the AES-GCM key for the encrypted personal-data
#                                               columns, as Base64 that decodes to exactly 32 bytes.
#                                               There is no salt property and no key derivation: the
#                                               decoded bytes ARE the key, and each sealed value
#                                               carries its own random 12-byte initialisation vector
#                                               inside the envelope, so two seals of one value differ
#     carddemo.security.require-https           transport expectation for this profile
#
#   Region and endpoints are NOT in the carddemo namespace. They belong to the AWS integration's
#   own properties, and are set under spring.cloud.aws further down, so that the object-store,
#   queue and notification clients are all configured through one mechanism rather than two.
#
# -------------------------------------------------------------------------------------------------
# RESOURCE NAMES - one set, agreed across six places
#
#   The bucket, queue, group id and topic below must be byte-identical in every one of:
#     src/main/resources/application.yml            (baseline defaults)
#     src/main/resources/application-local.yml       (this file)
#     src/test/resources/application-test.yml        (Testcontainers overlay)
#     docker-compose.yml                             (passes them into the emulator container)
#     localstack/init/01-create-aws-resources.sh     (creates them)
#     the running emulator itself
#   The bucket, queue and topic are provisioned resources and therefore appear in all six. The
#   group id is not a resource at all - it is an attribute carried on each published message - so
#   it is bound in the three profile files that configure the publisher and is deliberately absent
#   from the compose file, from the bootstrap script and from the emulator, where it would be
#   configuration that provisions nothing.
#   A disagreement yields a stack that starts cleanly and then fails on the first publish, with no
#   start-up error pointing at the cause. All four names are read back out of the running stack and
#   confirmed to match the values bound here.
#
#   THE NAMES ARE MANDATED, NOT CHOSEN. The five canonical values are fixed by the migration plan
#   and this file is their authoritative source:
#     carddemo-batch-staging       object-store bucket
#     carddemo-jobs.fifo           first-in-first-out submission queue
#     carddemo-job-submission      message group id
#     carddemo-job-notifications   notification topic
#     us-east-1                    region
#
#   Two of them additionally carry a hard technical constraint. The queue name must end in .fifo,
#   because a FIFO queue is rejected outright without that suffix - that is a start-up failure, not
#   a style preference. The group id must be one stable value, because append order is preserved
#   only within a single message group, and append order is the part of the legacy queue contract
#   that acceptance drains a real queue to verify.
#
#   NAMING RATIONALE - recorded rather than left implicit. Every target resource is namespaced to
#   this module and every name is expressed in the naming form its own service requires. The queue
#   stands in for a CICS transient-data queue whose legacy resource name is JOBS. That name is NOT
#   discarded: it is carried where it is actually contractual - in the frozen operator message text
#   emitted when a submission fails, which names the transient-data queue verbatim and is asserted
#   character for character - and as provenance in this comment, in the queue-contract block further
#   down and in the traceability matrix. An infrastructure name and an operator-visible message are
#   two different contracts, and only the second one is byte-compared, so the first follows the
#   mandated naming and the second follows the legacy text. Reusing the four-character legacy name
#   as the cloud resource name would place an unqualified, unnamespaced queue in an account that may
#   host unrelated workloads, and it would leave the bucket and topic namespaced while the queue and
#   group id were not - an inconsistency in a set whose whole value is that it is one set. Naming is
#   a target-platform concern and carries no business behaviour, so nothing about parity is at stake:
#   the 80-byte record width, the append ordering and the ignore-on-error semantics - the parts of
#   the legacy contract that are observable - are preserved exactly and are asserted independently of
#   what the queue is called. The reasoning is recorded in docs/decision-log.md.
#
# WHAT IS DELIBERATELY ABSENT - each absence is a decision, not an oversight
#   * No pool sizing, no pool time-out. See the datasource block.
#   * No heap figure, no worker-thread count, no latency, volume or availability figure anywhere,
#     in a property or in a comment. No numeric service level is documented in the legacy estate,
#     so performance here is MEASURED through the meters wired below and never asserted.
#   * No application-level cache. The legacy system had none, and adding one would move the very
#     latency and consistency behaviour the baseline is meant to record.
#   * No framework-managed initialisation script and no bootstrap SQL file. The versioned
#     migrations are the only path by which a table or a row is created.
#   * No paid-tier emulator setting and no activation token. The Community edition covers the
#     object store, the queue and the topic, which is the whole AWS surface this module uses.
# =================================================================================================

spring:

  # -----------------------------------------------------------------------------------------------
  # PostgreSQL 16, published by the compose stack on the host.
  #
  # CREDENTIALS: throwaway development values addressing a container on the developer's own machine,
  # matching what the compose stack provisions. They are acceptable HERE and nowhere else - the
  # production overlay resolves url, user and password from the environment with NO fallback, so a
  # missing secret aborts start-up rather than binding something harmless-looking.
  #
  # The pool stays at its shipped defaults: no legacy baseline exists to tune against.
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:carddemo}
    username: ${POSTGRES_USER:carddemo}
    password: ${POSTGRES_PASSWORD:carddemo}
    driver-class-name: org.postgresql.Driver

  # -----------------------------------------------------------------------------------------------
  # Statement echo, for this profile alone - the generated SQL is what makes a fixed-width mapping or
  # a truncating decimal store visible while parity evidence is gathered. ddl-auto is restated as
  # `validate` at the point of use to make it unambiguous that even the local profile authors no
  # schema.
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        highlight_sql: true

  # -----------------------------------------------------------------------------------------------
  # Schema evolution - versioned, forward-only, and the ONLY path by which a table or a row is
  # created. Two locations are listed, and the second is what makes this a LOCAL profile:
  #
  #   classpath:db/migration   V1__create_schema.sql   the eleven application tables
  #                            V2__create_indexes.sql  keys and alternate-index equivalents
  #                                                    -> every profile, production included
  #   classpath:db/seed        sample rows and sign-on identities -> local and test ONLY
  #
  # The production overlay lists classpath:db/migration alone, so production migrates schema and
  # indexes without inheriting sample rows or seeded identities. Keeping the seeds in a separate
  # location rather than behind a flag makes that guarantee structural instead of conditional. Any
  # seed script added under db/seed must therefore stay out of db/migration, and must store a
  # sign-on credential only as a hash.
  #
  # clean-disabled is relaxed here and only here, so a developer iterating on a migration can drop
  # and re-apply. The baseline and the production overlay both forbid it.
  flyway:
    enabled: true
    locations: classpath:db/migration,classpath:db/seed
    baseline-on-migrate: false
    validate-on-migrate: true
    clean-disabled: false

  # -----------------------------------------------------------------------------------------------
  # Batch orchestration. Jobs stay launch-on-demand: an implicit start-up run would write rows before
  # a fixture comparison could read them. Only the metadata tables are provisioned here; the
  # production overlay narrows this so production DDL arrives only through a reviewed migration.
  batch:
    jdbc:
      initialize-schema: always

  # -----------------------------------------------------------------------------------------------
  # AWS integration, aimed at the LocalStack Community container.
  #
  # CREDENTIALS: the emulator accepts any non-empty pair and verifies nothing, so the values below are
  # deliberate placeholders and are NOT keys. Never substitute a real access key here.
  #
  # The endpoint override is applied globally AND restated per client, so no client can fall through
  # to a real AWS endpoint if the global setting is dropped. Path-style addressing is required because
  # the emulator does not serve virtual-hosted bucket subdomains; production turns it off.
  cloud:
    aws:
      region:
        static: ${AWS_REGION:us-east-1}
      credentials:
        access-key: ${AWS_ACCESS_KEY_ID:localstack-placeholder-not-a-real-key}
        secret-key: ${AWS_SECRET_ACCESS_KEY:localstack-placeholder-not-a-real-secret}
      endpoint: http://${LOCALSTACK_HOST:localhost}:${LOCALSTACK_PORT:4566}
      s3:
        endpoint: http://${LOCALSTACK_HOST:localhost}:${LOCALSTACK_PORT:4566}
        path-style-access-enabled: true
      sqs:
        endpoint: http://${LOCALSTACK_HOST:localhost}:${LOCALSTACK_PORT:4566}
      sns:
        endpoint: http://${LOCALSTACK_HOST:localhost}:${LOCALSTACK_PORT:4566}

# Observability, bound to the compose stack. Two paths are resolved literally by sibling files and
# may not be narrowed here: /actuator/health is the HEALTHCHECK target of carddemo-java/Dockerfile,
# and /actuator/prometheus is the scrape target of config/prometheus/prometheus.yml and the surface
# every panel of config/grafana/dashboards/carddemo-overview.json reads.
#
# CROSS-FILE CONTRACTS - two paths here are resolved literally by sibling files and neither the
# paths nor their reachability may be narrowed by this overlay:
#
#   /actuator/health      the HEALTHCHECK target of carddemo-java/Dockerfile and the readiness gate
#                         anything waiting on this application depends upon. If it stops answering,
#                         the container never reports healthy.
#   /actuator/prometheus  the scrape target of config/prometheus/prometheus.yml, whose scrape job
#                         reaches the host-run application through host.docker.internal, and the
#                         surface every panel of config/grafana/dashboards/carddemo-overview.json
#                         reads. It is also where the performance baseline is measured.
#
# EVERYTHING IN THIS BLOCK WIDENS A CLOSED BASELINE. application.yml publishes three endpoints and
# answers the health probe with an aggregate status alone, because that is the posture a profile
# should inherit when nobody chose one. This overlay opens the diagnostics that only make sense on
# a developer's own machine - resolved configuration, the bean graph, the request mappings, the
# applied migrations, the individual meters, and full health component detail - and it opens them
# HERE so that the concession is visible in the profile that takes it. Production does not narrow
# this list; it simply does not widen it.
#
# Traces are sampled in full so that a migrated flow can be followed end to end in the trace UI
# while acceptance evidence is gathered. Full fidelity is a local diagnostic choice, not a target.
# =================================================================================================
management:
  endpoints:
    web:
      base-path: /actuator
      exposure:
        include: health,info,metrics,prometheus,env,configprops,beans,flyway,mappings,loggers
  endpoint:
    health:
      # Reopened from the baseline's `never`. A failed migration or an unreachable container then
      # surfaces in the probe body itself, which is the fastest way to diagnose a compose stack
      # that will not come up. The payload names every health contributor and the database product
      # and version, which is why it is opened only here.
      show-details: always
      show-components: always
  tracing:
    enabled: true
    sampling:
      probability: 1.0
  otlp:
    tracing:
      # Two levels of override, narrowest first. OTEL_EXPORTER_OTLP_TRACES_ENDPOINT replaces the whole
      # address; failing that only the published OTLP/HTTP port is substituted, so the CLONE_INDEX
      # port-offset scheme in docker-compose.yml can move the sink between side-by-side stacks.
      endpoint: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:http://localhost:${JAEGER_OTLP_HTTP_PORT:4318}/v1/traces}

# The interface description and its viewer, reopened from the baseline's disabled state. This is the
# profile they exist for: the document is how a developer discovers the endpoints derived from the
# 17 legacy screens without reading the controllers, and the viewer is how a request is tried
# against a running compose stack. Both paths come from application.yml, so only the two switches
# appear here and neither path can drift between profiles.
#
# Reopening these is safe HERE and nowhere else. The document is a complete description of the
# request and response shape of every endpoint, and the viewer additionally serves its own static
# assets and issues requests from the browser. On a developer's machine that is the whole point; on
# anything reachable by someone else it is a map handed to them. The production overlay does not
# turn these off - it inherits them off.
springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

# Levels only; appender selection and the structured encoder live in logback-spring.xml. Raising the
# application package to DEBUG is the point of a local overlay: the migrated services log their
# decision points, and the migration tool logs each script it applies, so a start-up that fails to
# reach V4 says so plainly. The framework packages stay at INFO so that signal is not buried.
logging:
  level:
    com.carddemo: DEBUG
    org.flywaydb: INFO
    org.springframework.batch: INFO
    org.springframework.jdbc.core: INFO

# Application namespace - logical resource names, bound to what the compose stack provisions.
#
# THE QUEUE IS AN EXTERNAL INTERFACE CONTRACT. The legacy estate wrote to a CICS transient-data queue
# from exactly one site, and that write was its entire online-to-batch bridge. The queue attributes
# are behavioural and are reproduced rather than approximated:
#
#   RECORDSIZE(80)         one 80-character fixed-width card per message; record-length carries that
#                          width so the publisher asserts it instead of assuming it.
#   RECORDFORMAT(FIXED)    one message per card - no batching, no concatenation.
#   DISPOSITION(MOD)       appended, so ORDER IS PART OF THE CONTRACT. Hence a FIFO queue and a single
#                          stable message-group id: a standard queue would silently reorder.
#   ERROROPTION(IGNORE)    a write failure was tolerated; fail-on-error: false keeps that, logging the
#                          publish failure and continuing.
#   TYPEFILE(OUTPUT)       publish only - nothing in this module consumes from this queue.
#   OPENTIME(INITIAL)      the queue pre-existed first use, which is why the emulator bootstrap runs
#                          to completion before the application starts rather than creating it lazily.
#
# THE OBJECT STORE replaces the sequential output datasets and the generation-data-group bases that
# retained their history; retention becomes object versioning on the staging bucket rather than a
# generation limit. The per-family key prefixes are declared once in application.yml and inherited
# here unchanged, so one output family cannot overwrite another.
carddemo:
  aws:
    s3:
      bucket: ${CARDDEMO_S3_BUCKET:carddemo-batch-staging}
    sqs:
      job-submission-queue: ${CARDDEMO_SQS_QUEUE:carddemo-jobs.fifo}
      message-group-id: ${CARDDEMO_SQS_MESSAGE_GROUP_ID:carddemo-job-submission}
      record-length: 80
      fail-on-error: false
    sns:
      job-notification-topic: ${CARDDEMO_SNS_TOPIC:carddemo-job-notifications}
  security:
    # SIGNING MATERIAL: a development-only secret for a process talking to containers on one machine.
    # It must not be reused anywhere; it exists so `spring-boot:run` works without a prepared
    # environment. Production declares the same key as an environment reference with NO fallback, so
    # a missing secret aborts start-up. The issuer is restated rather than inherited so a locally
    # minted token is identifiable, and it is deliberately not the metric service label.
    jwt:
      issuer: carddemo-java
      secret: ${CARDDEMO_JWT_SECRET:local-development-only-signing-secret-do-not-reuse-0123456789}
      expiration: ${CARDDEMO_JWT_EXPIRATION:PT8H}
    # FIELD-ENCRYPTION KEY. Base64 of exactly 32 bytes, as AES-256 requires. The value below is a
    # development-only key for a process addressing containers on one machine: it seals sample
    # identifiers in an ephemeral database and is worth nothing anywhere else. It must not be reused,
    # and it exists here only so that `spring-boot:run` works without a prepared environment.
    # Production declares this same key as an environment reference with NO fallback, so a missing key
    # aborts start-up. Rotating it makes previously sealed values unreadable - expected, since the
    # local database is recreated from migrations anyway.
    field-encryption:
      key: ${CARDDEMO_FIELD_ENCRYPTION_KEY:Y2FyZGRlbW8tbG9jYWwtZGV2ZWxvcG1lbnQta2V5ISE=}
    # RELAXES A REQUIRED BASELINE, and says so here rather than letting the concession be inherited.
    # application.yml requires transport security, because a bearer token lifted from plaintext can
    # be replayed until it expires and a field sealed at rest travels in the clear once an endpoint
    # has decrypted it for a response. Neither risk exists for a process addressing containers over
    # the loopback interface on one machine, which is the only situation this profile describes.
    # Production does not re-require HTTPS - it inherits the requirement.
    require-https: false
