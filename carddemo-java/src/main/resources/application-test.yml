# TEST profile overlay - binds the application.yml baseline to container-provided endpoints.
#
#   ./mvnw -B -ntp clean verify                      # unit tier, then the container-backed tiers
#   SPRING_PROFILES_ACTIVE=test java -jar target/carddemo-java-1.0.0.jar
#
# Provenance of every legacy fact cited below: checkout 7756d895ffeb65f7ea72aaa609e356d9899afcec,
# upstream release stamp CardDemo_v1.0-15-g27d6c6f-68 dated 2022-07-19.
#
# -------------------------------------------------------------------------------------------------
# THIS FILE HAS A TWIN, AND THAT IS DELIBERATE - READ THIS BEFORE "CLEANING IT UP"
#
#   src/main/resources/application-test.yml   <- THIS FILE. Shipped inside the artifact.
#   src/test/resources/application-test.yml   <- the twin. Present only while the suite runs.
#
#   Both are required, and both are named as deliverables. They are not a duplication mistake.
#
#   WHICH ONE WINS: the test classpath places src/test/resources AHEAD of src/main/resources, so
#   during test execution the twin is the file Spring reads and THIS file is shadowed. Outside test
#   execution the twin does not exist at all - it is never packaged - so THIS file is the only
#   definition of the profile, and it is what makes `test` bootable from the built artifact.
#
#   THE RELATIONSHIP: this file is the shared, complete definition; the twin SPECIALISES it for a
#   suite run. The twin therefore restates a few settings this file leaves inherited, and narrows a
#   couple of others that only matter while several hundred tests share one console. Every such
#   difference is called out at the property it affects, below. What must never differ is the part
#   that is contractual: the resource names, the record width, the ordering guarantee, the schema
#   locations and the key paths themselves. Change one of those here and change it there too.
#
# -------------------------------------------------------------------------------------------------
# EVERY ENDPOINT BELOW IS A PLACEHOLDER, AND EVERY ONE IS REPLACED AT RUNTIME
#
#   A container is assigned an ephemeral host port when it starts, so no address written into a file
#   can be correct for a suite run. Each address here is written as ${VARIABLE:default} and exists
#   for two reasons only: so that context creation has something to bind before the real value is
#   supplied, and so that a packaged `test`-profile run has a working address.
#
#   The real values come from the two shared support base classes, which are the single place the
#   container lifecycle lives:
#
#     src/test/java/com/carddemo/support/AbstractPostgresIT.java     the database server
#     src/test/java/com/carddemo/support/AbstractLocalStackIT.java   the AWS emulator
#
#   They publish their assigned addresses into the context - by dynamic property registration or by
#   a service-connection factory - and a test obtains a container by EXTENDING one of them. NO TEST
#   DECLARES ITS OWN CONTAINER. That is what keeps the tiers composable, and it is also the reason
#   the defaults below are safe to be inert: nothing depends on them being reachable.
#
#   COROLLARY, and the one real hazard in this file: a container-backed test that forgets to extend
#   a support base class does not fail loudly - it falls through to the default address below. If a
#   suite run ever appears to see a developer's own data, that is the cause, and the fix is to
#   extend the base class rather than to change these defaults.
#
# -------------------------------------------------------------------------------------------------
# PROPERTY CONTRACT - the key paths bound here, and why the set is exactly this set
#
#   This overlay carries the SAME leaf property paths as application-local.yml - the same forty-five
#   - and differs only in the values. That is a requirement, not tidiness: a job parameter, a
#   resource name and a schema location must read identically whichever of the two profiles is
#   active, so that a job exercised against containers is the same job that runs against the
#   development stack. The paths are also written in the same order as that file, so the two diff
#   cleanly against each other.
#
#     spring.datasource.*                       server address and credentials
#     spring.jpa.*                              provider behaviour; authors no schema
#     spring.flyway.*                           the ONLY path by which a table or a row is created
#     spring.batch.jdbc.initialize-schema       job-metadata tables for this datasource
#     spring.cloud.aws.*                        region, credentials and endpoint redirection
#     management.*                              probe, meter and trace surface
#     springdoc.*                               interface description
#     logging.level.*                           verbosity only; appenders live in logback-spring.xml
#     carddemo.aws.s3.bucket                    object-store bucket for batch file staging
#     carddemo.aws.sqs.job-submission-queue     FIFO queue name; the .fifo suffix is REQUIRED
#     carddemo.aws.sqs.message-group-id         one stable group id - this is what preserves order
#     carddemo.aws.sns.job-notification-topic   topic for job-completion fan-out
#     carddemo.security.jwt.*                   issuer, signing material, lifetime
#     carddemo.security.field-encryption.key    AES-GCM key as Base64 decoding to exactly 32 bytes
#     carddemo.security.require-https           transport expectation for this profile
#
#   Two things are deliberately NOT restated here, and restating either would be a defect:
#
#     carddemo.aws.s3.prefix.*     the six per-output-family key prefixes are declared ONCE, in
#                                  application.yml, and inherited unchanged. A partial
#                                  re-declaration would silently drop the families it omitted and
#                                  let one output family overwrite another.
#     spring.batch.job.enabled     the baseline already sets it to false and this overlay leaves it
#                                  alone, exactly as application-local.yml does. See the batch
#                                  block for why the value matters and how it is guaranteed.
#
# -------------------------------------------------------------------------------------------------
# WHAT IS DELIBERATELY ABSENT - each absence is a decision, and each has a consequence
#
#   * No in-memory or embedded stand-in for the database. A real PostgreSQL 16 server is a
#     CORRECTNESS requirement here, not a convenience: acceptance compares produced bytes, those
#     bytes come out of exact-scale NUMERIC(p,2) arithmetic, and the legacy estate specifies no
#     rounding anywhere - so every store truncates toward zero and the migrated code truncates to
#     match. A substitute engine would change decimal and collation behaviour invisibly and the
#     comparison would still pass locally while being wrong.
#   * No pool sizing and no pool time limit. The shipped defaults are kept because no numeric
#     baseline exists in the legacy estate to size against.
#   * No heap figure, no worker-thread count, and no latency, volume or availability figure
#     anywhere - not as a property and not in a comment. Nothing of that kind is documented in the
#     legacy estate, so performance here is MEASURED through the meters this profile keeps open and
#     is never asserted against a number.
#   * No application-level cache of any kind. The legacy system had none, and adding one would move
#     the very latency and consistency behaviour the baseline is meant to record.
#   * No framework-managed initialisation script and no bootstrap SQL file. The versioned migrations
#     are the only path by which a table or a row comes into being.
#   * No paid-tier emulator setting and no activation token. The Community edition covers the object
#     store, the queue and the topic, which is the whole AWS surface this module uses.
# =================================================================================================

spring:

  # -----------------------------------------------------------------------------------------------
  # PostgreSQL 16 - a real server, supplied by AbstractPostgresIT during a suite run.
  #
  # The three values below are OVERRIDDEN AT RUNTIME with the address the started container reports.
  # They are written in the same ${VARIABLE:default} shape as application-local.yml and against the
  # same variable names, so one environment export steers the development stack and this profile
  # identically rather than through two competing schemes.
  #
  # CREDENTIALS: throwaway development values addressing a container on the developer's own machine,
  # matching both what the compose stack provisions and what the support base class configures on the
  # container it starts. They are acceptable HERE and nowhere else - the production overlay resolves
  # url, user and password from the environment with NO fallback, so a missing secret aborts start-up
  # instead of binding something that merely looks harmless.
  #
  # The driver CLASS is pinned so that a sliced test cannot fall back to embedded-database detection
  # and quietly obtain a different engine. The driver VERSION is owned by pom.xml, which pins it
  # above the framework's managed version for security reasons; it is deliberately not restated here,
  # where it could drift out of agreement with the build.
  #
  # The pool stays at its shipped defaults: no legacy baseline exists to size it against.
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:carddemo}
    username: ${POSTGRES_USER:carddemo}
    password: ${POSTGRES_PASSWORD:carddemo}
    driver-class-name: org.postgresql.Driver

  # -----------------------------------------------------------------------------------------------
  # Provider behaviour. All three settings suppress output rather than add it: a suite run captures
  # its console, and echoed statements would bury the assertion that failed. The development overlay
  # turns the same three on for the opposite reason.
  #
  # highlight_sql is switched off explicitly, not left to chance - it emits terminal colour escapes,
  # which corrupt a captured log and make a byte comparison of that log unreadable.
  #
  # Hibernate authors NO schema in any profile: the setting below is `validate`, which asserts that
  # the mapped entities agree with what the migrations built and fails start-up if they do not. If
  # the provider were allowed to author tables instead, the eleven-table shape and every NUMERIC
  # precision would come from its inference rather than from V1__create_schema.sql, and the byte
  # comparison would fail on rounding while every unit test still passed.
  jpa:
    show-sql: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false
        highlight_sql: false

  # -----------------------------------------------------------------------------------------------
  # SCHEMA EVOLUTION - THE LOAD-BEARING SETTING IN THIS FILE IS THE SECOND LOCATION.
  #
  # Two locations are listed, and the second is what makes this a TEST profile:
  #
  #   classpath:db/migration   V1__create_schema.sql          the eleven application tables
  #                            V2__create_indexes.sql         keys and alternate-index equivalents
  #                                                           -> every profile, production included
  #   classpath:db/seed        V3__seed_reference_data.sql     sample rows
  #                            V4__seed_user_security.sql      sign-on identities, hashed
  #                                                           -> the development and test profiles
  #                                                              ONLY
  #
  # The production overlay lists classpath:db/migration alone, so production migrates schema and
  # indexes without inheriting sample rows or seeded identities. Keeping the seeds in a separate
  # LOCATION rather than behind a flag makes that guarantee structural instead of conditional. Any
  # seed script added must therefore stay under db/seed, out of db/migration, and must store a
  # sign-on credential only as a hash.
  #
  # DROPPING THE SECOND LOCATION DOES NOT PRODUCE AN ERROR - IT PRODUCES EMPTY RESULT SETS. Without
  # the seeds the container-backed tiers have nothing to assert against: acceptance reads the seeded
  # cardinalities directly, and the byte comparison compares output produced FROM the seeded state.
  # Both would then fail on an empty query rather than on a message naming the cause. That is the one
  # change to this file that breaks the most while looking like a simplification.
  #
  # WHAT THE SEEDS BRING, at the counts measured from the sample datasets rather than estimated:
  #
  #   50 accounts . 50 cards . 50 cross-references . 50 customers . 300 daily transactions .
  #   51 disclosure-group rows . 50 category balances . 18 transaction categories .
  #   7 transaction types . 10 sign-on identities
  #
  # TWO COMPOSITION FACTS THAT TESTS DEPEND ON, recorded so nobody has to work them out again:
  #
  #   THE 300 DAILY TRANSACTIONS are 250 point-of-sale purchases and 50 operator-originated returns,
  #   so BOTH SIGNED DIRECTIONS exercise the balance computation from seed data alone. They also all
  #   carry THE SAME origination date and time, and their processing timestamp is blank because
  #   nothing has posted them yet. CONSEQUENCE: DATE-WINDOW FILTERING CANNOT BE EXERCISED BY THIS
  #   INPUT. A reporting test that filters on a date range must build its own fixture; asserting a
  #   window against this input proves nothing, because every record falls inside or outside it
  #   together.
  #
  #   THE 51 DISCLOSURE-GROUP ROWS are three consecutive groups of seventeen, keyed A000000000,
  #   DEFAULT and ZEROAPR - the latter two space-padded to the ten-character key width. One group
  #   carries a zero rate. CONSEQUENCE: both the fallback to the default group and the skip taken
  #   when a rate is zero are provably reachable from the seed, so branch coverage on the interest
  #   path needs no synthetic fixture.
  #
  #   THE 10 SIGN-ON IDENTITIES are five administrator records and five standard-user records, which
  #   is what makes both sides of the role split testable. They are stored as BCRYPT HASHES. The
  #   legacy sign-on compared a stored eight-character password directly against what was typed;
  #   reproducing that comparison would have satisfied parity and violated the credential constraint,
  #   so hashing is a DELIBERATE, DOCUMENTED PARITY EXCEPTION - the one place where faithful
  #   reproduction is knowingly declined - and it is recorded as such in docs/decision-log.md.
  #
  # validate-on-migrate stays on so a locally edited script cannot diverge from what was applied.
  # clean-disabled is relaxed here and in the development profile only, so a test that needs a
  # pristine schema can drop and re-apply; the baseline and the production overlay both forbid it.
  flyway:
    enabled: true
    locations: classpath:db/migration,classpath:db/seed
    baseline-on-migrate: false
    validate-on-migrate: true
    clean-disabled: false

  # -----------------------------------------------------------------------------------------------
  # BATCH ORCHESTRATION.
  #
  # JOBS STAY LAUNCH-ON-DEMAND. spring.batch.job.enabled is false in application.yml and this
  # overlay does not touch it, exactly as application-local.yml does not; the twin restates it
  # explicitly, so the value is false whichever of the two files is in force. It matters more here
  # than anywhere else: a job that ran implicitly at context start would write rows before a fixture
  # comparison could read them, and would corrupt the seeded state that other tests assert against.
  # Jobs are launched deliberately - from the batch test utilities or through the job-launch endpoint
  # - and never as a side effect of starting a context.
  #
  # The job-metadata tables come from the framework's own bundled script, which is what
  # initialize-schema requests. They are NOT part of V1__create_schema.sql and must not be added to
  # it: they belong to the framework, they change with its version, and a migration owning them would
  # pin them.
  #
  # THEREFORE, AND THIS IS NOT A SCHEMA DEFECT: the "eleven tables" assertion is about APPLICATION
  # tables only - account, card, customer, card_cross_reference, transaction, daily_transaction,
  # transaction_category_balance, disclosure_group, transaction_type, transaction_category and
  # user_security. The BATCH_-prefixed metadata tables are ADDITIONAL AND EXPECTED, and a listing of
  # this database shows both sets. A count that includes them is counting the wrong thing.
  batch:
    jdbc:
      initialize-schema: always

  # -----------------------------------------------------------------------------------------------
  # AWS INTEGRATION, aimed at the LocalStack Community emulator that AbstractLocalStackIT starts.
  #
  # CREDENTIALS: the emulator accepts any non-empty pair and verifies nothing, so the two values
  # below are deliberate placeholders and are NOT keys. Never substitute a real access key here.
  #
  # THE ENDPOINT OVERRIDE IS SET GLOBALLY AND RESTATED FOR ALL THREE CLIENTS. That redundancy is the
  # point: it means no client can fall through to a real AWS endpoint if the global setting is ever
  # dropped or if one client's auto-configuration stops consulting it. A test must not be able to
  # reach a real account by accident, and the failure mode being guarded against is silent success
  # against the wrong target rather than an error.
  #
  # Path-style addressing is required because the emulator does not serve virtual-hosted bucket
  # subdomains; production turns it off.
  #
  # The emulator serves the object store, the queue and the topic and nothing else, which is the
  # entire AWS surface this module uses. The twin sets no endpoint at all, because during a suite run
  # the support base class supplies the container's assigned address and overrides whatever is bound
  # here; these values are what a packaged `test`-profile run resolves.
  cloud:
    aws:
      region:
        static: ${AWS_REGION:us-east-1}
      credentials:
        access-key: ${AWS_ACCESS_KEY_ID:localstack-placeholder-not-a-real-key}
        secret-key: ${AWS_SECRET_ACCESS_KEY:localstack-placeholder-not-a-real-secret}
      endpoint: http://${LOCALSTACK_HOST:localhost}:${LOCALSTACK_PORT:4566}
      s3:
        endpoint: http://${LOCALSTACK_HOST:localhost}:${LOCALSTACK_PORT:4566}
        path-style-access-enabled: true
      sqs:
        endpoint: http://${LOCALSTACK_HOST:localhost}:${LOCALSTACK_PORT:4566}
      sns:
        endpoint: http://${LOCALSTACK_HOST:localhost}:${LOCALSTACK_PORT:4566}

# OBSERVABILITY. This block WIDENS NOTHING AND NARROWS NOTHING: all four surface settings are
# restated at exactly the values application.yml already closes them to. The restatement is
# deliberate rather than redundant. It pins the surface at the shipped posture so that a test
# asserting what the artifact exposes asserts the real thing, and it makes any future widening a
# conscious edit here rather than something a test profile inherits by accident. The development
# overlay is the file that opens the extra diagnostics, and it opens them there so the concession is
# visible in the profile that takes it.
#
# CROSS-FILE CONTRACTS - two paths are resolved literally by sibling files and NEITHER the paths nor
# their reachability may be narrowed by this overlay:
#
#   /actuator/health      the health-check target of carddemo-java/Dockerfile. If it stops answering,
#                         the container never reports healthy and anything waiting on it never
#                         starts.
#   /actuator/prometheus  the scrape target of config/prometheus/prometheus.yml and the surface every
#                         panel of config/grafana/dashboards/carddemo-overview.json reads. It is also
#                         where the performance baseline is measured: the per-endpoint and per-step
#                         timers are read from here, and acceptance reads step timings from these
#                         meters, so closing this path would remove the only evidence that the
#                         baseline was established at all.
#
# ------------------------------------------------------------------------------------------------
# TRACE EXPORT IS NEUTRALISED ON PURPOSE. DO NOT "FIX" THIS BY POINTING IT AT A COLLECTOR.
#
#   Instrumentation stays ON - tracing.enabled is true, so the tracer, the observation registry and
#   context propagation are all wired and a test that asserts on an observation still works.
#
#   EXPORT is what is switched off, and the sampling probability is what switches it off: at 0.0 no
#   span is ever sampled, unsampled spans are not queued for export, and the exporter is therefore
#   never invoked. No collector is contacted, so no connection is attempted and no connection-refused
#   noise appears on every context start. There is no collector during a suite run - it is not part
#   of the test fixture, only of the development stack - so an exporter that did try to reach one
#   would fail on every single context refresh and bury real output.
#
#   The endpoint below is consequently NEVER CALLED. It is retained, at the same variable and the
#   same shape as the baseline, so that the key path stays identical across profiles and so that a
#   deliberate diagnostic session can raise the sampling probability and immediately have somewhere
#   to send spans. The twin goes one step further and disables tracing outright, which shaves the
#   wiring cost off several hundred context refreshes; both files agree on the part that matters,
#   which is that nothing is exported.
# =================================================================================================
management:
  endpoints:
    web:
      base-path: /actuator
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: never
      show-components: never
  tracing:
    enabled: true
    sampling:
      probability: 0.0
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:http://localhost:4318/v1/traces}

# The interface description and its viewer stay exactly as the baseline closes them. Restated at the
# baseline value for the same reason as the management surface above: a test that asserts the shipped
# posture must assert the real one, and the description is a complete map of the request and response
# shape of every endpoint. The development overlay is where they are reopened, because that is the
# profile they exist for. A test that needs the document generates it rather than serving it.
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

# Levels only; appender selection and the encoder live in logback-spring.xml, which already keys on
# this profile and selects readable console output for it. Nothing about appenders is restated here.
#
# The two framework packages are lowered because their per-statement and per-step chatter, multiplied
# by the number of contexts a suite refreshes, is what makes a captured log unusable. The application
# package stays at INFO so that a failure is diagnosable without re-running anything, and the
# migration tool stays at INFO so that a start-up which fails to reach the seeds says so plainly -
# that single line is the difference between diagnosing a missing seed location in seconds and
# chasing an empty result set. The root level is left at the baseline, so a packaged `test`-profile
# run stays readable; the twin lowers root for the suite, which is the one place the volume warrants
# it.
logging:
  level:
    com.carddemo: INFO
    org.flywaydb: INFO
    org.springframework.batch: WARN
    org.springframework.jdbc.core: WARN

# Application namespace - the logical resource names, which are the same names the legacy job control
# addressed and which must read identically in every profile so that a job parameter is
# profile-independent.
#
# THESE FOUR NAMES ARE MANDATED, NOT CHOSEN, and must be byte-identical in all six places that speak
# them: application.yml, application-local.yml, this file, the twin, docker-compose.yml,
# localstack/init/01-create-aws-resources.sh and the running emulator. A disagreement yields a stack
# that starts cleanly and then fails on the first publish, with no start-up error naming the cause.
#
#   carddemo-batch-staging       object-store bucket
#   JOBS.fifo                    first-in-first-out submission queue
#   carddemo-job-submission      message group id
#   carddemo-job-notifications   notification topic
#   us-east-1                    region, bound in the spring.cloud.aws block above
#
# THE QUEUE IS AN EXTERNAL INTERFACE CONTRACT, AND ACCEPTANCE DRAINS A REAL QUEUE TO VERIFY IT. The
# legacy estate wrote to a CICS transient-data queue from exactly ONE site in more than nineteen
# thousand lines, and that single write was its entire online-to-batch bridge. The queue's declared
# attributes are behavioural, so they are reproduced rather than approximated:
#
#   RECORDSIZE(80)         one 80-character fixed-width card per message; record-length carries that
#                          width so the publisher asserts it instead of assuming it.
#   RECORDFORMAT(FIXED)    one message per card - no batching and no concatenation.
#   BLOCKFORMAT(UNBLOCKED) the same, stated from the other direction: cards are not grouped.
#   DISPOSITION(MOD)       appended, so ORDER IS PART OF THE CONTRACT. Hence a FIFO queue and ONE
#                          stable message-group id: order is preserved only within a single group,
#                          and a standard queue would silently reorder.
#   ERROROPTION(IGNORE)    a write failure was tolerated; fail-on-error false keeps that, logging the
#                          publish failure and continuing rather than aborting the caller.
#   TYPEFILE(OUTPUT)       publish only - nothing in this module consumes from this queue.
#   OPENTIME(INITIAL)      the queue pre-existed first use, which is why the emulator's resources are
#                          created before the first publish rather than lazily.
#
# TWO NAMES CARRY A HARD TECHNICAL CONSTRAINT. The queue name MUST end in .fifo, because a FIFO queue
# is rejected outright without that suffix - a start-up failure, not a style preference. The group id
# MUST be one stable value, for the ordering reason above.
#
# The object store replaces the sequential output datasets and the generation bases that retained
# their history; retention becomes object versioning on the staging bucket. The six per-family key
# prefixes are declared once in application.yml and inherited here unchanged, so one output family
# cannot overwrite another.
carddemo:
  aws:
    s3:
      bucket: ${CARDDEMO_S3_BUCKET:carddemo-batch-staging}
    sqs:
      job-submission-queue: ${CARDDEMO_SQS_QUEUE:JOBS.fifo}
      message-group-id: ${CARDDEMO_SQS_MESSAGE_GROUP_ID:carddemo-job-submission}
      # The 80-character card width and the tolerate-a-publish-failure behaviour are NOT declared as
      # properties. Both are fixed by the legacy queue definition rather than chosen by a deployment,
      # and nothing in the module reads them: the publisher holds the width as a constant it checks
      # each card against, and it catches and reports a publish failure instead of rethrowing.
      # Declaring them here would read as adjustable while changing nothing.
    sns:
      job-notification-topic: ${CARDDEMO_SNS_TOPIC:carddemo-job-notifications}
  security:
    # SIGNING MATERIAL: a test-only placeholder, and self-describing so that it cannot be mistaken
    # for anything else. It signs tokens for a process addressing containers it started itself, it is
    # never deployed, and it is worth nothing outside this suite. It must not be reused. The default
    # matches the twin's literal, so the effective value is the same whichever file is in force.
    # Production declares this same key as an environment reference with NO fallback, so a missing
    # secret aborts start-up there rather than binding a placeholder.
    #
    # The lifetime is short because a test never needs a long-lived token, and a short lifetime keeps
    # any expiry-handling path exercisable within a single run. The issuer is restated rather than
    # inherited so that a token minted under this profile is identifiable as such.
    jwt:
      issuer: carddemo-java
      secret: ${CARDDEMO_JWT_SECRET:test-only-signing-secret-not-used-outside-tests-0123456789}
      expiration: ${CARDDEMO_JWT_EXPIRATION:PT15M}
    # FIELD-ENCRYPTION KEY. Base64 of exactly 32 bytes, as AES-256 requires; anything else is
    # rejected at start-up by the service that binds it, naming this property. FIXED rather than
    # random so that a sealed fixture is reproducible from one run to the next - a random key would
    # make a sealed value differ between runs and any comparison against it meaningless. Test-only,
    # never deployed, worth nothing outside this suite, and identical to the twin's literal.
    # Production declares this same key as an environment reference with NO fallback.
    field-encryption:
      key: ${CARDDEMO_FIELD_ENCRYPTION_KEY:Y2FyZGRlbW8tdGVzdC1vbmx5LWZpeGVkLWtleSEhISE=}
    # RELAXES A REQUIRED BASELINE, stated here so the concession is visible in the profile taking it.
    # application.yml requires transport security, because a bearer token lifted from plaintext can
    # be replayed until it expires and a field sealed at rest travels in the clear once an endpoint
    # has decrypted it for a response. Neither risk exists for a container reached over the loopback
    # interface by the process that started it and destroyed with the suite. Nothing else is relaxed.
    # Production does not re-require this - it inherits the requirement.
    require-https: false
