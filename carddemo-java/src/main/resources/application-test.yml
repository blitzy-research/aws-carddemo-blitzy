# TEST profile overlay - binds the application.yml baseline to container-provided endpoints.
#
#   ./mvnw -B -ntp clean verify                      # unit tier, then the container-backed tiers
#   SPRING_PROFILES_ACTIVE=test java -jar target/carddemo-java-1.0.0.jar
#
# Provenance of every legacy fact cited below: checkout 7756d895ffeb65f7ea72aaa609e356d9899afcec,
# upstream release stamp CardDemo_v1.0-15-g27d6c6f-68 dated 2022-07-19.
#
# -------------------------------------------------------------------------------------------------
# THIS FILE HAS A TWIN, AND THAT IS DELIBERATE - READ THIS BEFORE "CLEANING IT UP"
#
#   src/main/resources/application-test.yml   <- THIS FILE. Shipped inside the artifact.
#   src/test/resources/application-test.yml   <- the twin. Present only while the suite runs.
#
#   Both are required, and both are named as deliverables. They are not a duplication mistake.
#
#   WHICH ONE WINS: the test classpath places src/test/resources AHEAD of src/main/resources, so
#   during test execution the twin is the file Spring reads and THIS file is shadowed. Outside test
#   execution the twin does not exist at all - it is never packaged - so THIS file is the only
#   definition of the profile, and it is what makes `test` bootable from the built artifact.
#
#   THE RELATIONSHIP: this file is the shared, complete definition; the twin SPECIALISES it for a
#   suite run. The twin therefore restates a few settings this file leaves inherited, and narrows a
#   couple of others that only matter while several hundred tests share one console. Every such
#   difference is called out at the property it affects, below. What must never differ is the part
#   that is contractual: the resource names, the record width, the ordering guarantee, the schema
#   locations and the key paths themselves. Change one of those here and change it there too.
#
# -------------------------------------------------------------------------------------------------
# WHERE A CONTAINER ADDRESS COMES FROM, AND WHY THE DATABASE ADDRESS IS ABSENT FROM THIS FILE
#
#   A container is assigned an ephemeral host port when it starts, so no address written into a file
#   can be correct for a suite run. Two shared support base classes own the container lifecycle, and
#   they are the single place it lives:
#
#     src/test/java/com/carddemo/support/AbstractPostgresIT.java     the database server
#     src/test/java/com/carddemo/support/AbstractLocalStackIT.java   the AWS emulator
#
#   A test obtains a container by EXTENDING one of them. Each base class declares a
#   @DynamicPropertySource method that registers the started container's real address into the
#   environment of any test that boots a Spring context, at a precedence above every property file,
#   so such a test is handed the container it was given rather than anything written here. A test
#   that works directly against the container - over raw JDBC, or a client it builds itself - takes
#   the same values through the accessors instead. NO TEST DECLARES ITS OWN CONTAINER; that is what
#   keeps the tiers composable. @ServiceConnection is deliberately not used, because
#   spring-boot-testcontainers is not a dependency of this module.
#
#   That precedence is asserted rather than assumed. ContextInheritsContainerAddressesIT boots a real
#   context under this profile and checks that the address it resolves is the running container's -
#   and, for the AWS endpoint, that it is the container's ephemeral address rather than the fixed
#   value declared below. See docs/decision-log.md DL-104.
#
#   THE DATABASE ADDRESS IS THEREFORE NOT DECLARED IN THIS FILE AT ALL. It cannot be: an ephemeral
#   port is unknowable ahead of the run, and any value written here that is REACHABLE is worse than
#   no value, because it lets a test that forgot to extend the support base class connect somewhere
#   real instead of failing. An earlier revision defaulted the address and credentials to the
#   development compose stack for the sake of always having something to bind; the effect was that
#   such a test silently used the DEVELOPER'S OWN database. With the keys absent, data-source
#   resolution instead fails during context refresh and names the missing property.
#
#   AN AWS ENDPOINT IS DIFFERENT AND IS DECLARED BELOW. The emulator answers on a FIXED container
#   port, 4566, so an endpoint written here is meaningful; and unlike an absent database, an absent
#   AWS endpoint does not fail closed - it falls back to the region's REAL public endpoint. The
#   endpoints below are therefore stated explicitly, redirecting every client at the emulator, so
#   that no client can address a real account. That redirection is the setting; it is not a
#   placeholder.
#
# -------------------------------------------------------------------------------------------------
# PROPERTY CONTRACT - the key paths bound here, and why the set is exactly this set
#
#   This overlay carries the same leaf property paths as application-local.yml, in the same order, so
#   that the two diff cleanly against each other and differ only in their values. That agreement is a
#   requirement, not tidiness: a job parameter, a resource name and a schema location must read
#   identically whichever of the two profiles is active, so that a job exercised against containers
#   is the same job that runs against the development stack.
#
#   THE AGREEMENT IS ON THE KEY SET, AND IT IS ASSERTED RATHER THAN COUNTED. An earlier revision
#   claimed a leaf total here; a number in a comment cannot survive an edit to either file, and that
#   one had already stopped being true of both. ConfigurationProfileBaselineTest compares the two key
#   sets mechanically and permits exactly the documented divergences below, so this paragraph can
#   no longer drift out of agreement with the files it describes.
#
#     DIVERGENCE 1  application-local.yml declares spring.datasource.url, .username and .password;
#                   this overlay declares none of them. Local addresses one fixed compose stack, so
#                   an address written there is correct; a container's port is ephemeral, so an
#                   address written here could only be wrong or dangerous. See the section above.
#     DIVERGENCE 2  this overlay declares springdoc.swagger-ui.enabled and local leaves it inherited.
#                   A suite run closes the interactive surface explicitly rather than by inheritance,
#                   because a browsable UI serves no test and its absence should be provable here.
#     DIVERGENCE 3  this overlay declares management.otlp.tracing.export.enabled and local does not.
#                   Local exports to the collector the compose stack runs, so it wants the shipped
#                   default of enabled; a suite run has no collector, so export is switched off HERE
#                   at the one key that actually switches it off. See the trace-export section below
#                   for why the sampling probability the two files both declare cannot do that job.
#     DIVERGENCE 4  application-local.yml declares server.address and this overlay does not. Local is
#                   the only profile a PERSON starts by hand - `spring-boot:run` or `java -jar` - on a
#                   machine other hosts may be able to route to, while carrying a committed signing
#                   secret, a committed operator credential, cleartext transport and ten seeded
#                   sign-on identities; binding the embedded server's default of EVERY interface
#                   published all of that. It therefore defaults to 127.0.0.1 there, and
#                   docker-compose.yml overrides it to 0.0.0.0 inside the container, where the
#                   published mapping is itself loopback-bound. A suite run creates its server
#                   programmatically on an ephemeral port for the life of one test class, and the copy
#                   of this overlay under src/test/resources takes precedence during that run, so a
#                   value written here would govern nothing the suite does. Registered as a divergence
#                   rather than mirrored, because a setting nothing reads is worse than an asymmetry
#                   that is explained.
#
#     spring.datasource.driver-class-name       engine pinned; address registered by the base class
#     spring.jpa.*                              provider behaviour; authors no schema
#     spring.flyway.*                           the ONLY path by which a table or a row is created
#     spring.batch.jdbc.initialize-schema       job-metadata tables for this datasource
#     spring.cloud.aws.*                        region, credentials and endpoint redirection
#     management.*                              probe, meter and trace surface
#     springdoc.*                               interface description
#     logging.level.*                           verbosity only; appenders live in logback-spring.xml
#     carddemo.aws.endpoint-override            address that aims every client at the emulator; the
#                                               ONE optional key under this prefix, and the one
#                                               production leaves unset
#     carddemo.aws.s3.batch-staging-bucket      object-store bucket for batch file staging
#     carddemo.aws.sqs.job-queue                FIFO queue name; the .fifo suffix is REQUIRED
#     carddemo.aws.sqs.message-group-id         one stable group id - this is what preserves order
#     carddemo.aws.sns.job-notification-topic   topic for job-completion fan-out
#     carddemo.security.jwt.*                   issuer, signing material, lifetime
#     carddemo.security.field-encryption.key    AES-GCM key as Base64 decoding to exactly 32 bytes
#     carddemo.security.require-https           transport expectation for this profile
#     carddemo.security.anonymous-metrics-scrape  whether the exposition may be read without a
#                                               credential - opened here, closed in the baseline
#
#   Two things are deliberately NOT restated here, and restating either would be a defect:
#
#     carddemo.aws.region          declared ONCE, in application.yml, and inherited unchanged. The
#                                  spring.cloud.aws region setting below derives from it rather than
#                                  restating the value, so the region is stated once per profile and
#                                  the two namespaces cannot name different regions.
#                                  The six s3.prefix.* keys an earlier revision declared under this
#                                  prefix are gone rather than inherited: BatchStagingArea is the one
#                                  adapter for every staged input and output, and each job composes the
#                                  key for its own dataset generation.
#     spring.batch.job.enabled     the baseline already sets it to false and this overlay leaves it
#                                  alone, exactly as application-local.yml does. See the batch
#                                  block for why the value matters and how it is guaranteed.
#
# -------------------------------------------------------------------------------------------------
# WHAT IS DELIBERATELY ABSENT - each absence is a decision, and each has a consequence
#
#   * No in-memory or embedded stand-in for the database. A real PostgreSQL 16 server is a
#     CORRECTNESS requirement here, not a convenience: acceptance compares produced bytes, those
#     bytes come out of exact-scale NUMERIC(p,2) arithmetic, and the legacy estate specifies no
#     rounding anywhere - so every store truncates toward zero and the migrated code truncates to
#     match. A substitute engine would change decimal and collation behaviour invisibly and the
#     comparison would still pass locally while being wrong.
#   * No pool sizing and no pool time limit. The shipped defaults are kept because no numeric
#     baseline exists in the legacy estate to size against.
#   * No heap figure, no worker-thread count, and no latency, volume or availability figure
#     anywhere - not as a property and not in a comment. Nothing of that kind is documented in the
#     legacy estate, so performance here is MEASURED through the meters this profile keeps open and
#     is never asserted against a number.
#   * No application-level cache of any kind. The legacy system had none, and adding one would move
#     the very latency and consistency behaviour the baseline is meant to record.
#   * No framework-managed initialisation script and no bootstrap SQL file. The versioned migrations
#     are the only path by which a table or a row comes into being.
#   * No paid-tier emulator setting and no activation token. The Community edition covers the object
#     store, the queue and the topic, which is the whole AWS surface this module uses.
# =================================================================================================

spring:

  # -----------------------------------------------------------------------------------------------
  # PostgreSQL 16 - a real server, supplied by AbstractPostgresIT during a suite run.
  #
  # NO ADDRESS, NO USER AND NO PASSWORD ARE DECLARED HERE, AND THAT ABSENCE IS THE SETTING.
  #
  # A container is assigned an ephemeral host port when it starts, so no address written into a file
  # can be correct for a suite run. The address, the role and the password are registered into the
  # context at run time by src/test/java/com/carddemo/support/AbstractPostgresIT.java, from the
  # container it started, and a test obtains a database by EXTENDING that class.
  #
  # An earlier revision declared jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/
  # ${POSTGRES_DB:carddemo} with ${POSTGRES_USER:carddemo} and ${POSTGRES_PASSWORD:carddemo} so that
  # context creation always had something to bind. Those defaults are exactly the address and
  # credentials the development compose stack provisions, so a container-backed test that forgot to
  # extend the support base class did not fail - it silently connected to the DEVELOPER'S OWN
  # database and asserted against, or wrote into, real local data. A default that is reachable is not
  # inert. The profile therefore FAILS CLOSED instead: with no url declared and no embedded database
  # on the runtime class path, data-source resolution throws during context refresh and names the
  # missing property, so the fix - extend the support base class - is stated by the failure.
  #
  # The driver CLASS is still pinned, and it is the only thing pinned here, so that a sliced test
  # cannot fall back to embedded-database detection and quietly obtain a different engine. The driver
  # VERSION is owned by pom.xml, which pins it above the framework's managed version for security
  # reasons; it is deliberately not restated here, where it could drift out of agreement with the
  # build.
  #
  # The pool stays at its shipped defaults: no legacy baseline exists to size it against.
  datasource:
    driver-class-name: org.postgresql.Driver

  # -----------------------------------------------------------------------------------------------
  # Provider behaviour. All three settings suppress output rather than add it: a suite run captures
  # its console, and echoed statements would bury the assertion that failed. The development overlay
  # turns the same three on for the opposite reason.
  #
  # highlight_sql is switched off explicitly, not left to chance - it emits terminal colour escapes,
  # which corrupt a captured log and make a byte comparison of that log unreadable.
  #
  # Hibernate authors NO schema in any profile: the setting below is `validate`, which asserts that
  # the mapped entities agree with what the migrations built and fails start-up if they do not. If
  # the provider were allowed to author tables instead, the eleven-table shape and every NUMERIC
  # precision would come from its inference rather than from V1__create_schema.sql, and the byte
  # comparison would fail on rounding while every unit test still passed.
  jpa:
    show-sql: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false
        highlight_sql: false

  # -----------------------------------------------------------------------------------------------
  # SCHEMA EVOLUTION - THE LOAD-BEARING SETTING IN THIS FILE IS THE LIFTED VERSION CEILING. WITHOUT IT,
  # THIS PROFILE MIGRATES AN UNSEEDED DATABASE.
  #
  # One flat location, resolved identically by every profile:
  #
  #   classpath:db/migration                                              EVERY profile
  #     V1__create_schema.sql          the eleven application tables
  #     V2__create_indexes.sql         keys and alternate-index equivalents
  #     V3__seed_reference_data.sql    sample rows                        local and test ONLY
  #     V4__seed_user_security.sql     sign-on identities, hashed         local and test ONLY
  #
  # All four scripts sit directly in that directory; there is no schema/ or seed/ child directory and
  # none may be created, so the location list cannot carry any part of the separation. The production
  # overlay pins spring.flyway.target to "2", so V3 and V4 sit above its ceiling and are never executed
  # there - it migrates schema and indexes without inheriting sample rows or seeded identities. See
  # docs/decision-log.md DL-127, which supersedes DL-102 and DL-119. This profile raises the ceiling,
  # and that is the one setting that applies the seeds. Any seed script added must be numbered above 2
  # and must store a sign-on credential only as a hash.
  #
  # LOSING THAT SETTING DOES NOT PRODUCE AN ERROR - IT PRODUCES EMPTY RESULT SETS. Without the
  # seeds the container-backed tiers have nothing to assert against: acceptance reads the seeded
  # cardinalities directly, and the byte comparison compares output produced FROM the seeded state.
  # Both would then fail on an empty query rather than on a message naming the cause. Copying
  # production's `locations` or `target` into this file, to "align the profiles", is the one change
  # here that breaks the most while looking like tidying up.
  #
  # WHAT THE SEEDS BRING, at the counts measured from the sample datasets rather than estimated:
  #
  #   50 accounts . 50 cards . 50 cross-references . 50 customers . 300 daily transactions .
  #   51 disclosure-group rows . 50 category balances . 18 transaction categories .
  #   7 transaction types . 10 sign-on identities
  #
  # TWO COMPOSITION FACTS THAT TESTS DEPEND ON, recorded so nobody has to work them out again:
  #
  #   THE 300 DAILY TRANSACTIONS are 250 point-of-sale purchases and 50 operator-originated returns,
  #   so BOTH SIGNED DIRECTIONS exercise the balance computation from seed data alone. They also all
  #   carry THE SAME origination date and time, and their processing timestamp is blank because
  #   nothing has posted them yet. CONSEQUENCE: DATE-WINDOW FILTERING CANNOT BE EXERCISED BY THIS
  #   INPUT. A reporting test that filters on a date range must build its own fixture; asserting a
  #   window against this input proves nothing, because every record falls inside or outside it
  #   together.
  #
  #   THE 51 DISCLOSURE-GROUP ROWS are three consecutive groups of seventeen, keyed A000000000,
  #   DEFAULT and ZEROAPR - the latter two space-padded to the ten-character key width. One group
  #   carries a zero rate; the other two carry 15.00 on the (01, 0001) type and category every seeded
  #   balance uses. CONSEQUENCE: the fallback to the default group is provably reachable from the seed
  #   and needs no fixture, because no seeded account carries any of the three keys - all fifty hold
  #   ten spaces - so every account misses and re-probes as DEFAULT. THE SKIP TAKEN WHEN A RATE IS
  #   ZERO IS NOT REACHABLE FROM THE SEED: that re-probe finds 15.00, so the run always computes.
  #   Covering the skip, and covering the direct group hit, each needs an account constructed with a
  #   seeded group key plus a category balance on the matching type and category.
  #
  #   THE 10 SIGN-ON IDENTITIES are five administrator records and five standard-user records, which
  #   is what makes both sides of the role split testable. They are stored as BCRYPT HASHES. The
  #   legacy sign-on compared a stored eight-character password directly against what was typed;
  #   reproducing that comparison would have satisfied parity and violated the credential constraint,
  #   so hashing is a DELIBERATE, DOCUMENTED PARITY EXCEPTION - the one place where faithful
  #   reproduction is knowingly declined - and it is recorded as such in docs/decision-log.md.
  #
  # TWO THINGS COM.CARDDEMO.CONFIG.FLYWAYCONFIG DOES TO THIS BLOCK, neither of which this document
  # could do for itself:
  #
  #   1. It refuses `prod` activated alongside this profile, in either order, before any bean is
  #      instantiated. Overlapping property sources resolve by activation order, so `prod,test` would
  #      let this overlay overwrite the production overlay's data source location, signing material,
  #      field-encryption key, service endpoints and transport rule - and re-add the seed location to
  #      a deployment reading the production document. A profile document is selected BY the
  #      active-profile list and cannot see it, so the refusal has to live in code.
  #   2. It holds the seeded regulated identifiers to two invariants, through a callback registered for
  #      this profile and `local` alone. V3__seed_reference_data.sql inserts customer.govt_issued_id as
  #      an ENC1 envelope in every row - never as cleartext - and seeds customer.cust_ssn as NULL in all
  #      fifty, so on a delivered database there is nothing to convert. The callback still SEALS any
  #      unsealed value it finds, guarding a future edit to the seed, and it OPENS every stored value
  #      under the key this process holds, guarding what the seal check cannot see: an envelope sealed
  #      under some OTHER key looks exactly like an envelope, so recognising its shape proves nothing
  #      about readability. A value that will not open fails the run at migration time instead of at
  #      whichever assertion first decrypted a seeded row. It runs on the after-migrate event, which
  #      Flyway raises AFTER the migration's own transaction has committed, in a transaction of the
  #      callback's own. CONSEQUENCE FOR A TEST: a seeded customer row read through this profile carries
  #      an ENC1 envelope in that column and NOT the fixture's twenty digits, which is the same value
  #      the entity's own accessors would have demanded. A test that wants the cleartext reveals it
  #      through the encryption service.
  #
  # WHAT STOPS A DATABASE THIS OVERLAY SEEDED FROM ENDANGERING A LATER PRODUCTION RUN. Seeding writes
  # V3 and V4 rows into this database's migration history, and fifty synthetic customer rows and ten
  # known sign-on identities into its tables. Neither the added seed location nor the lifted ceiling
  # can undo that, because both describe what THIS process applies and neither is consulted about what
  # some earlier process already applied. A container-backed test database is per-run and is discarded,
  # so the path that matters is the OTHER one: a long-lived database once opened under this profile, or
  # a dump of one, later read by a production deployment. That is closed by
  # com.carddemo.config.ProductionSeedRejectionCallback, registered for `prod` alone, which refuses
  # production start-up outright - before the first script runs and before any application bean is
  # instantiated - when the migration history records a seed version, when user_security holds any of
  # the ten seeded identities, or when five reference tables match the seeded row counts
  # simultaneously. Nothing else sees this state, and that was measured rather than assumed:
  # validate-on-migrate does NOT reject such a database, because version 11 of the migration tool
  # ignores future migrations by default, so applied versions 3 and 4 that the production schema
  # location cannot resolve are not a validation failure. It refuses rather than cleaning, because a
  # production database holding these rows is an incident to be corrected and never data for a
  # start-up path to delete. ProductionSeedRejectionCallbackIT asserts all of it.
  #
  # validate-on-migrate stays on so a locally edited script cannot diverge from what was applied.
  # clean-disabled is relaxed here and in the development profile only, so a test that needs a
  # pristine schema can drop and re-apply; the baseline and the production overlay both forbid it.
  # `target: latest` lifts the version ceiling the shared baseline pins at "2", so a migration under
  # this overlay applies V1 and V2 and then the two seeds. The baseline and the production overlay
  # both pin `target: 2`, and com.carddemo.config.FlywayConfig re-applies that ceiling unconditionally
  # whenever the production profile is active, so seeded reference rows and seeded sign-on identities
  # cannot reach a production migration however this file is edited.
  flyway:
    enabled: true
    # See docs/decision-log.md DL-298.
    #
    # BOTH DELIVERED LOCATIONS, restated in full rather than inherited so this document reads on its
    # own. THE SECOND ENTRY IS THE ONLY SETTING THAT MAKES THE SEEDS EXECUTABLE: the shared baseline
    # declares the schema location alone, which is the production posture, and adding the seed location
    # here is what applies V3 and V4 so the fixtures have rows to assert against.
    #
    # NEVER REPLACE THESE TWO WITH THEIR PARENT classpath:db/migration - it is scanned recursively, so
    # it resolves the same scripts under different recorded names, and FlywayConfig refuses it.
    locations:
      - classpath:db/migration/schema
      - classpath:db/migration/seed
    # Restated for completeness rather than as a control; no profile carries a numeric ceiling now.
    target: latest
    baseline-on-migrate: false
    validate-on-migrate: true
    clean-disabled: false

  # -----------------------------------------------------------------------------------------------
  # BATCH ORCHESTRATION.
  #
  # JOBS STAY LAUNCH-ON-DEMAND. spring.batch.job.enabled is false in application.yml and this
  # overlay does not touch it, exactly as application-local.yml does not; the twin restates it
  # explicitly, so the value is false whichever of the two files is in force. It matters more here
  # than anywhere else: a job that ran implicitly at context start would write rows before a fixture
  # comparison could read them, and would corrupt the seeded state that other tests assert against.
  # Jobs are launched deliberately - from the batch test utilities or through the job-launch endpoint
  # - and never as a side effect of starting a context.
  #
  # The job-metadata tables come from Spring Batch's own bundled PostgreSQL script:
  # initialize-schema is `always` here as it is under every other profile, inherited from the shared
  # baseline and deliberately not restated. They are NOT part of V1__create_schema.sql and must not be
  # added to it - they belong to the framework and they change with its version, so the framework
  # provisions them, which is what AAP 0.3.1 assigns and what keeps the delivered migration inventory
  # at exactly V1, V2, V3, V4. The framework's initialiser skips execution when the tables already
  # exist, so a re-used database is unaffected.
  #
  # A suite run is therefore the environment that PROVES the arrangement works: every container-backed
  # test that launches a job runs against framework-created metadata tables in exactly the way a
  # deployment will, so a value that differed between environments could not hide here.
  #
  # THEREFORE, AND THIS IS NOT A SCHEMA DEFECT: the "eleven tables" assertion is about APPLICATION
  # tables only - account, card, customer, card_cross_reference, transaction, daily_transaction,
  # transaction_category_balance, disclosure_group, transaction_type, transaction_category and
  # user_security. The BATCH_-prefixed metadata tables are ADDITIONAL AND EXPECTED, and a listing of
  # this database shows both sets. A count that includes them is counting the wrong thing.

  # -----------------------------------------------------------------------------------------------
  # AWS INTEGRATION, aimed at the LocalStack Community emulator that AbstractLocalStackIT starts.
  #
  # CREDENTIALS: the emulator accepts any non-empty pair and verifies nothing, so the two values
  # below are deliberate placeholders and are NOT keys. Never substitute a real access key here.
  #
  # THE ENDPOINT OVERRIDE IS SET GLOBALLY AND RESTATED FOR ALL THREE CLIENTS. That redundancy is the
  # point: it means no client can fall through to a real AWS endpoint if the global setting is ever
  # dropped or if one client's auto-configuration stops consulting it. A test must not be able to
  # reach a real account by accident, and the failure mode being guarded against is silent success
  # against the wrong target rather than an error.
  #
  # Path-style addressing is required because the emulator does not serve virtual-hosted bucket
  # subdomains; production turns it off.
  #
  # The emulator serves the object store, the queue and the topic and nothing else, which is the
  # entire AWS surface this module uses.
  #
  # THE TWIN DECLARES THE SAME FOUR ENDPOINTS, at the same shape, and that agreement is deliberate.
  # An earlier revision left them out of the twin on the reasoning that a support base class would
  # supply the container's address during a suite run - true only for a test that extends one, and
  # only for a client that base class built itself. A test that extended neither, or a client the
  # framework created, had no endpoint at all and would therefore have addressed a real account. Both
  # copies now carry the floor; AbstractLocalStackIT raises it to the running container's ephemeral
  # address for anything that boots a context. These values are what a packaged `test`-profile run
  # resolves. See docs/decision-log.md DL-104.
  cloud:
    aws:
      region:
        static: ${carddemo.aws.region}
      credentials:
        # ONLY LOCALSTACK_* MAY OVERRIDE THESE. An earlier revision read the standard AWS_ACCESS_KEY_ID
        # and AWS_SECRET_ACCESS_KEY names here, which inverted the very protection the note above
        # describes: declaring a static pair does keep the SDK's default credential chain out of the
        # picture, but reading that chain's own variable names to populate it hands the ambient value
        # straight back in. A developer machine or a build agent holding a real key would then send that
        # key - as an Authorization signature - to whatever the endpoint below resolves to. The emulator
        # verifies nothing, so the leak would never surface as a failure. The dedicated names cannot be
        # set by accident, which is the whole point of them, and application-local.yml already uses them.
        access-key: ${LOCALSTACK_ACCESS_KEY_ID:localstack-placeholder-not-a-real-key}
        secret-key: ${LOCALSTACK_SECRET_ACCESS_KEY:localstack-placeholder-not-a-real-secret}
      endpoint: http://${LOCALSTACK_HOST:localhost}:${LOCALSTACK_PORT:4566}
      s3:
        endpoint: http://${LOCALSTACK_HOST:localhost}:${LOCALSTACK_PORT:4566}
        path-style-access-enabled: true
      sqs:
        endpoint: http://${LOCALSTACK_HOST:localhost}:${LOCALSTACK_PORT:4566}
        observation-enabled: true
      sns:
        endpoint: http://${LOCALSTACK_HOST:localhost}:${LOCALSTACK_PORT:4566}

# OBSERVABILITY. This block WIDENS NOTHING AND NARROWS NOTHING: all four surface settings are
# restated at exactly the values application.yml already closes them to. The restatement is
# deliberate rather than redundant. It pins the surface at the shipped posture so that a test
# asserting what the artifact exposes asserts the real thing, and it makes any future widening a
# conscious edit here rather than something a test profile inherits by accident. The development
# overlay is the file that opens the extra diagnostics, and it opens them there so the concession is
# visible in the profile that takes it.
#
# CROSS-FILE CONTRACTS - two paths are resolved literally by sibling files and NEITHER the paths nor
# their reachability may be narrowed by this overlay:
#
#   /actuator/health      the endpoint whose GROUPS the two callers actually address, and publishing it
#                         is what makes them reachable. carddemo-java/Dockerfile's HEALTHCHECK asks for
#                         /actuator/health/liveness - the group, not the aggregate, because liveness
#                         consults nothing outside the process - and a Compose dependent or a CI gate
#                         waits on /actuator/health/readiness. Narrowing the endpoint away takes both
#                         groups with it, at which point the container never reports healthy and
#                         anything waiting on it never starts.
#   /actuator/prometheus  the scrape target of config/prometheus/prometheus.yml and the surface every
#                         panel of config/grafana/dashboards/carddemo-overview.json reads. It is also
#                         where the performance baseline is measured: the per-endpoint and per-step
#                         timers are read from here, and acceptance reads step timings from these
#                         meters, so closing this path would remove the only evidence that the
#                         baseline was established at all.
#
# ------------------------------------------------------------------------------------------------
# TRACE EXPORT IS NEUTRALISED ON PURPOSE. DO NOT "FIX" THIS BY POINTING IT AT A COLLECTOR.
#
#   Instrumentation stays ON - tracing.enabled is true, so the tracer, the observation registry and
#   context propagation are all wired and a test that asserts on an observation still works.
#
#   EXPORT IS SWITCHED OFF AT THE ONE PROPERTY THAT ACTUALLY SWITCHES IT OFF:
#   management.otlp.tracing.export.enabled. Boot resolves that key first when it decides whether to
#   create the OTLP exporter at all; only if the key is absent does it fall back to
#   management.tracing.enabled. Set to false, the exporter bean is never created, so there is no
#   component that could open a connection, whatever the sampler later decides.
#
#   A SAMPLING PROBABILITY OF 0.0 DOES NOT DISABLE EXPORT, AND AN EARLIER REVISION OF THIS COMMENT
#   CLAIMED IT DID. The effective sampler is PARENT-BASED over the ratio sampler - the probability
#   configures only the ROOT decision. A request arriving with a W3C traceparent whose sampled flag
#   is set is therefore sampled irrespective of the ratio, its spans reach the span processor, and
#   the exporter is invoked. Probability alone leaves export reachable through any caller that
#   propagates a sampled context, which is precisely what a contract test for an inbound endpoint
#   does. The probability below is retained because it still suppresses ROOT spans and so keeps the
#   recording cost off several hundred context refreshes - but it is an optimisation, not the
#   control, and it must not be mistaken for one again.
#
#   WHY EXPORT MUST BE OFF AT ALL: there is no collector during a suite run. A collector belongs to
#   the development stack, not to the test fixture, so an exporter that did try to reach one would
#   fail on every context refresh and bury real output in connection-refused noise.
#
#   The endpoint below is consequently NEVER CALLED. It is retained, at the same variable and the
#   same shape as the baseline, so that the key path stays identical across profiles and so that a
#   deliberate diagnostic session can flip the export switch and raise the probability and
#   immediately have somewhere to send spans. The twin sets the SAME export switch and additionally
#   disables tracing outright, which shaves the wiring cost as well; both files agree on the part
#   that matters, which is that nothing is exported, and both now say so at the property that
#   decides it rather than at one that only influences it. See docs/decision-log.md DL-104.
# =================================================================================================
management:
  endpoints:
    web:
      base-path: /actuator
      exposure:
        # IDENTICAL to the shared baseline, for the same reason the endpoint path above is restated:
        # the published set stays the same across profiles so a test that resolves a management path
        # resolves the one production would. `metrics` is included because the baseline includes it.
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: never
      show-components: never
  tracing:
    enabled: true
    sampling:
      # An optimisation, NOT the export control. See the paragraph above: this configures the root
      # decision of a parent-based sampler, so it cannot stop a propagated sampled context.
      probability: 0.0
  otlp:
    tracing:
      export:
        # THE export control. Boot consults this key before management.tracing.enabled, so declaring
        # it here keeps export off even if a test re-enables tracing globally.
        enabled: false
      endpoint: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:http://localhost:4318/v1/traces}

# The interface description and its viewer stay exactly as the baseline closes them. Restated at the
# baseline value for the same reason as the management surface above: a test that asserts the shipped
# posture must assert the real one, and the description is a complete map of the request and response
# shape of every endpoint. The development overlay is where they are reopened, because that is the
# profile they exist for. A test that needs the document generates it rather than serving it.
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

# Levels only; appender selection and the encoder live in logback-spring.xml, which already keys on
# this profile and selects readable console output for it. Nothing about appenders is restated here.
#
# The two framework packages are lowered because their per-statement and per-step chatter, multiplied
# by the number of contexts a suite refreshes, is what makes a captured log unusable. The application
# package stays at INFO so that a failure is diagnosable without re-running anything, and the
# migration tool stays at INFO so that a start-up which fails to reach the seeds says so plainly -
# that single line is the difference between diagnosing a missing seed location in seconds and
# chasing an empty result set. The root level is left at the baseline, so a packaged `test`-profile
# run stays readable; the twin lowers root for the suite, which is the one place the volume warrants
# it.
logging:
  level:
    com.carddemo: INFO
    org.flywaydb: INFO
    org.springframework.batch: WARN
    org.springframework.jdbc.core: WARN

# Application namespace - the logical resource names, which are the same names the legacy job control
# addressed and which must read identically in every profile so that a job parameter is
# profile-independent.
#
# THESE FOUR NAMES ARE FIXED, NOT LOCAL CHOICES, and must be byte-identical in all six places that
# speak them: application.yml, application-local.yml, this file, the twin, docker-compose.yml,
# localstack/init/01-create-aws-resources.sh and the running emulator. A disagreement yields a stack
# that starts cleanly and then fails on the first publish, with no start-up error naming the cause.
# The QUEUE name is prescribed by the migration plan, which names this resource JOBS; the other three
# are module-namespaced because the plan names no value for them.
#
#   carddemo-batch-staging       object-store bucket
#   JOBS.fifo                    first-in-first-out submission queue
#   carddemo-job-submission      message group id
#   carddemo-job-notifications   notification topic
#   us-east-1                    region, bound at carddemo.aws.region in application.yml and derived
#                                from there by the spring.cloud.aws block above
#
# THE QUEUE IS AN EXTERNAL INTERFACE CONTRACT, AND ACCEPTANCE DRAINS A REAL QUEUE TO VERIFY IT. The
# legacy estate wrote to a CICS transient-data queue from exactly ONE site in more than nineteen
# thousand lines, and that single write was its entire online-to-batch bridge. The queue's declared
# attributes are behavioural, so they are reproduced rather than approximated:
#
#   RECORDSIZE(80)         one 80-character fixed-width card per message; record-length carries that
#                          width so the publisher asserts it instead of assuming it.
#   RECORDFORMAT(FIXED)    one message per card - no batching and no concatenation.
#   BLOCKFORMAT(UNBLOCKED) the same, stated from the other direction: cards are not grouped.
#   DISPOSITION(MOD)       appended, so ORDER IS PART OF THE CONTRACT. Hence a FIFO queue and ONE
#                          stable message-group id: order is preserved only within a single group,
#                          and a standard queue would silently reorder.
#   ERROROPTION(IGNORE)    a write failure was tolerated; fail-on-error false keeps that, logging the
#                          publish failure and continuing rather than aborting the caller.
#   TYPEFILE(OUTPUT)       publish only - nothing in this module consumes from this queue.
#   OPENTIME(INITIAL)      the queue pre-existed first use, which is why the emulator's resources are
#                          created before the first publish rather than lazily.
#
# TWO NAMES CARRY A HARD TECHNICAL CONSTRAINT. The queue name MUST end in .fifo, because a FIFO queue
# is rejected outright without that suffix - a start-up failure, not a style preference. The group id
# MUST be one stable value, for the ordering reason above.
#
# The object store replaces the sequential datasets and the generation bases that retained their
# history; retention becomes object versioning on the staging bucket. BatchStagingArea is the single
# S3 boundary: readers prefer an existing staged object, and every dataset-producing job publishes its
# completed local writer buffer through the same adapter. The key is composed by the job rather than
# configured, so no output family depends on a prefix key staying in step with a writer.
#
# THE ENDPOINT OVERRIDE IS DECLARED HERE for the same reason the four spring.cloud.aws endpoint
# settings above are: an absent AWS endpoint does not fail closed, it resolves the region's real public
# endpoint. Both carry the same expression, built from the same two variables, so a differently
# published emulator is addressed without editing either. A context-booting subclass of
# AbstractLocalStackIT raises all of them to the ephemeral address of the emulator it started, at a
# precedence above every property file. See docs/decision-log.md DL-104.
carddemo:
  aws:
    endpoint-override: http://${LOCALSTACK_HOST:localhost}:${LOCALSTACK_PORT:4566}
    s3:
      batch-staging-bucket: ${CARDDEMO_S3_BUCKET:carddemo-batch-staging}
    sqs:
      job-queue: ${CARDDEMO_SQS_QUEUE:JOBS.fifo}
      message-group-id: ${CARDDEMO_SQS_MESSAGE_GROUP_ID:carddemo-job-submission}
      # The 80-character card width and the tolerate-a-publish-failure behaviour are NOT declared as
      # properties. Both are fixed by the legacy queue definition rather than chosen by a deployment,
      # and nothing in the module reads them: the publisher holds the width as a constant it checks
      # each card against, and it catches and reports a publish failure instead of rethrowing.
      # Declaring them here would read as adjustable while changing nothing.
    sns:
      job-notification-topic: ${CARDDEMO_SNS_TOPIC:carddemo-job-notifications}
  security:
    # SIGNING MATERIAL: a test-only placeholder, and self-describing so that it cannot be mistaken
    # for anything else. It signs tokens for a process addressing containers it started itself, it is
    # never deployed, and it is worth nothing outside this suite. It must not be reused. The default
    # matches the twin's literal, so the effective value is the same whichever file is in force.
    # Production declares the SAME PROPERTY under its OWN variable, CARDDEMO_JWT_SECRET, as a bare
    # environment reference with NO fallback, so a missing secret aborts start-up there rather than
    # binding a placeholder.
    #
    # THE VARIABLE READ HERE IS TEST-SCOPED, AND DELIBERATELY NOT PRODUCTION'S. This overlay used to
    # read ${CARDDEMO_JWT_SECRET} itself, which meant any machine already exporting a deployment
    # signing secret injected it into the suite silently - the placeholder resolved, the tail was
    # ignored, and the tests signed with a production credential while reporting nothing. Placeholder
    # resolution is by exact key, so a test-scoped name removes the path rather than narrowing it.
    #
    # The lifetime is short because a test never needs a long-lived token, and a short lifetime keeps
    # any expiry-handling path exercisable within a single run. The issuer is restated rather than
    # inherited so that a token minted under this profile is identifiable as such.
    jwt:
      issuer: carddemo-java
      secret: ${CARDDEMO_TEST_JWT_SECRET:test-only-signing-secret-not-used-outside-tests-0123456789}
      expiration: ${CARDDEMO_JWT_EXPIRATION:PT15M}
    # THE ONE NON-PRODUCTION FIXTURE KEY. Base64 of exactly 32 bytes, as AES-256 requires; anything
    # else is rejected at start-up by the service that binds it, naming this property. FIXED rather
    # than random so that a sealed fixture is reproducible from one run to the next - a random key
    # would make a sealed value differ between runs and any comparison against it meaningless.
    #
    # WHY THIS LITERAL IS SHARED RATHER THAN PER-PROFILE. The same value appears, byte for byte, here,
    # in application-local.yml, and in the suite's own src/test/resources/application-test.yml. That
    # agreement is load-bearing, not tidiness. V3__seed_reference_data.sql seeds fifty
    # customer.govt_issued_id values as ENC1 envelopes; an envelope opens under exactly one key; and
    # V3 is applied by every non-production profile. Two divergent development keys - which these
    # files carried before - made the same seeded row readable under one non-production profile and
    # unreadable under the other, with the failure surfacing only when something decrypted it.
    #
    # Test-only, never deployed, worth nothing outside this suite. Production declares this same key
    # as an environment reference with NO fallback, and production never applies V3 at all -
    # spring.flyway.target caps it at version 2 - so no production row is sealed under this literal.
    #
    # STATED AS A BARE LITERAL, DELIBERATELY, AND NOT AS ${CARDDEMO_FIELD_ENCRYPTION_KEY:<default>},
    # which is also how the suite's own src/test/resources/application-test.yml has always stated it.
    # This profile is FIXTURE-BEARING: V3 inserts fifty govt_issued_id envelopes that are fixed
    # literals in a committed script, and an envelope opens under exactly one key. An environment
    # override could not rotate them - nothing can re-key a literal - it would only leave fifty rows
    # of regulated data unreadable, and the envelope-marker check cannot detect that, because an
    # envelope sealed under a foreign key still looks like an envelope. A suite run would then fail
    # somewhere far from the cause, at whichever assertion first decrypted a seeded row. Removing the
    # override removes the ordinary way into that state; com.carddemo.config
    # .SeededIdentifierSealingCallback refuses it however else it arises, by OPENING every stored value
    # at the end of each migration rather than checking its shape, and failing the run on the first
    # value that will not open. Production is the only profile resolving this from the environment, and
    # it carries no fallback there for the opposite reason: it owns real data.
    # See docs/decision-log.md DL-103.
    field-encryption:
      key: Y2FyZGRlbW8tbm9ucHJvZC1maXh0dXJlLWtleSEhISE=
    # RELAXES A REQUIRED BASELINE, stated here so the concession is visible in the profile taking it.
    # application.yml requires transport security, because a bearer token lifted from plaintext can
    # be replayed until it expires and a field sealed at rest travels in the clear once an endpoint
    # has decrypted it for a response. Neither risk exists for a container reached over the loopback
    # interface by the process that started it and destroyed with the suite. Nothing else is relaxed.
    # Production does not re-require this - it inherits the requirement.
    require-https: false
    # OPENS A CLOSED BASELINE, stated here so the concession is visible in the profile taking it.
    # application.yml closes anonymous metrics scraping. A collector reached over the loopback
    # interface by the process that started it, and destroyed with the suite, has no untrusted client
    # on it - and a test that measures the exposition needs to be able to read the exposition. Nothing
    # else is opened. Production does not open this.
    anonymous-metrics-scrape: true
    # -------------------------------------------------------------------------------------------
    # OPERATOR CREDENTIAL FOR THE MANAGEMENT SURFACE. config/SecurityConfig matches the whole
    # management base path with its own filter chain, permits exactly three anonymous paths - the
    # aggregate health endpoint and its two probe groups - and requires the ROLE_MONITORING authority
    # for everything else beneath it. That authority is held ONLY by a caller presenting this
    # credential; neither of the two authorities a sign-on grants can satisfy it, which is the point:
    # a collector is not a user of this application, and an ordinary signed-on cardholder must not be
    # able to read per-endpoint latency, per-batch-step record counts, pool saturation or JVM
    # internals.
    #
    # THIS VALUE IS A TEST LITERAL AND IS NOT A SECRET OF ANYTHING. A test that asserts the operator
    # gate has to be able to satisfy it, and a test that asserts an ordinary token CANNOT satisfy it
    # needs a configured credential to contrast against - an unconfigured surface refuses everyone and
    # would prove nothing about the authority rule.
    #
    # Overridable by CARDDEMO_TEST_MANAGEMENT_TOKEN so a build agent can supply its own inert value.
    # The setting is bound with an EMPTY default in the baseline, and empty is FAIL-CLOSED: no identity
    # can hold the authority, so the surface admits nobody beyond the three probe paths. Production
    # binds CARDDEMO_MANAGEMENT_TOKEN - a DIFFERENT variable - to a bare reference with no fallback and
    # is refused start-up without it.
    #
    # Test-scoped for the same reason as the signing secret above: read under production's name, an
    # operator credential already exported for a deployment would have bound here without a word.
    management:
      token: ${CARDDEMO_TEST_MANAGEMENT_TOKEN:test-only-management-token-not-used-outside-tests}
