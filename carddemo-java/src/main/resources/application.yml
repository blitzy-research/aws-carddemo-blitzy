# Shared configuration baseline for the CardDemo Java module. Every setting here is inherited by the
# three profile overlays, which differ from it only in endpoints and credentials:
#   application-local.yml -> the Docker Compose stack in carddemo-java/docker-compose.yml
#   application-test.yml  -> Testcontainers-provided endpoints
#   application-prod.yml  -> every secret resolved from the environment, with no fallback
# An overlay may override a key declared here; none introduces a competing key prefix.
#
# ROLE
#   Every setting below is inherited by all three profile overlays, which differ from it ONLY in
#   endpoints and credentials:
#     application-local.yml -> the Docker Compose stack in carddemo-java/docker-compose.yml
#     application-test.yml  -> Testcontainers-provided endpoints (src/test/resources)
#     application-prod.yml  -> every secret resolved from the environment, with NO fallback
#   An overlay may override a key declared here. No overlay introduces a competing key prefix.
#
# PROVENANCE
#   Legacy checkout SHA : 7756d895ffeb65f7ea72aaa609e356d9899afcec
#   Upstream stamp      : CardDemo_v1.0-15-g27d6c6f-68, dated 2022-07-19
#   No COBOL, JCL, screen-map, copybook or CICS resource-definition source text appears anywhere
#   in this module. The legacy estate is cited by member name, resource name, record width, field
#   count and code value only, and is never copied here.
#
# THIS BASELINE IS FAIL-CLOSED, and that is a property to be preserved rather than a description
# of how it happens to be set today. The rule for every setting here is: assume the profile that
# inherits it is production. A convenience is therefore never declared here and then narrowed by
# the production overlay - it is declared closed here and WIDENED by the profile that needs it,
# because a deployment can forget to select a profile but it cannot forget to inherit this file.
# Concretely, four settings are closed here and opened only in application-local.yml:
#     management.endpoints.web.exposure.include   three endpoints, each a cross-file contract
#     management.endpoint.health.show-details     never - aggregate status only
#     management.endpoint.health.show-components  never
#     springdoc.api-docs / springdoc.swagger-ui   both disabled
# and one is closed here and relaxed only in the local and test overlays:
#     carddemo.security.require-https             true
#
# A PROFILE-LESS START CANNOT REACH A RUNNING STATE, and it fails during start-up rather than
# serving anything. Three values that the application cannot operate without are declared in NO
# profile and defaulted NOWHERE - not to an empty value and not to a placeholder:
#     spring.datasource.url                        no data source can be determined
#     carddemo.security.jwt.secret                 no token can be signed or verified
#     carddemo.security.field-encryption.key       no regulated field can be sealed or read
# Each overlay binds all three; this file binds none. The first of them is resolved by the data
# source auto-configuration during context refresh, and with no url and no embedded database on
# the runtime class path that resolution throws, so the failure is deterministic and arrives
# before the first request is accepted. This is the intended behaviour and it is asserted by a
# test, so weakening it by adding a default here fails the build rather than passing review.
#
# WHAT IS DELIBERATELY ABSENT - every absence below is a recorded decision, not an oversight
#   * No active and no default profile. The platform supplies it: the module Dockerfile sets
#     SPRING_PROFILES_ACTIVE=local and Compose passes it through. Baking one in would let a
#     deployment that forgets the variable silently inherit an entire development environment - a
#     local datasource, a development signing value, a wider management surface - which is the
#     environment-scale equivalent of a defaulted credential. Failing fast is the correct
#     behaviour, and the paragraph above records exactly which three absent values produce it.
#   * No pool sizing and no time-out override on the datasource. The pool keeps its shipped
#     defaults because no legacy baseline exists to tune against.
#   * No JVM heap figure, no worker-thread count, no latency or volume figure of any kind.
#     Performance here is MEASURED, never asserted: no numeric service level is documented
#     anywhere in the legacy estate, so the observability wiring further down establishes the
#     first baseline for this implementation rather than testing against a threshold.
#   * No application-level caching layer. The legacy system had none, and introducing one would
#     move the very latency and consistency behaviour that baseline is meant to record.
#   * No credential and no credential default - not even a placeholder. See the security block at
#     the end of this file.
# =================================================================================================

spring:
  # The service label carried on every meter and exported trace. The Prometheus scrape job in
  # config/prometheus/prometheus.yml is separately named carddemo-java and it is that job label the
  # dashboard panels filter on, so the two names coexist by design.
  application:
    name: carddemo

  # Deterministic JSON for the REST contract. The request and response types derive from the 17
  # screen field maps, so the wire shape is part of the published interface contract and must not
  # drift with a framework default: absent fields are omitted rather than sent as null, dates are
  # ISO-8601 rather than epoch numbers, unknown request properties are tolerated so a client may
  # echo a field this endpoint does not consume, and decimals are rendered plainly because
  # scientific notation would corrupt a fixed-scale value carried from a zoned-decimal field.
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      fail-on-unknown-properties: false
    generator:
      write-bigdecimal-as-plain: true

  # PostgreSQL 16 stands in for the ten indexed base clusters plus the sequential daily
  # transaction input. The url, the user and the credential are profile scoped; only the driver is
  # fixed here, so that a persistence slicing test cannot fall back to embedded-database
  # detection. The pool is left entirely at its own defaults, as recorded above.
  datasource:
    driver-class-name: org.postgresql.Driver

  # The migrations own the schema; the provider only checks that the mapped entities still agree
  # with the migrated tables. `validate` is never `create`, `create-drop` or `update`: nothing here
  # may author or alter a table outside a versioned migration. No dialect is declared, because the
  # provider detects PostgreSQL 16 correctly and a hardcoded dialect is a drift risk.
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          # Every timestamp is read and written in UTC so a fixed-width timestamp field
          # round-trips identically regardless of the host the job runs on.
          time_zone: UTC

  # -----------------------------------------------------------------------------------------------
  # Schema evolution: versioned, forward-only, and the only path by which a table or a row is
  # created. There is no framework-managed initialisation script and no boot-time initialiser
  # property, so the migrations on the location list below are the whole story.
  #
  #   V1__create_schema.sql   the eleven application tables       db/migration - every profile
  #   V2__create_indexes.sql  keys and alternate-index equivalents db/migration - every profile
  #
  # The location list is deliberately db/migration alone. Reference-data and sign-on seeds must not
  # be reachable from this file: they belong under db/seed, which application-local.yml and
  # application-test.yml add for themselves and application-prod.yml never does. That is what keeps
  # sample rows and seeded sign-on identities out of a production migration.
  #
  # Version 11 of the migration tool resolves PostgreSQL support from a separate artefact declared
  # beside flyway-core in pom.xml; without it the build still succeeds and the application then
  # fails at run time, so the two must stay declared together.
  #
  # baseline-on-migrate stays off: nothing exists to baseline, and enabling it would let V1 be
  # skipped in silence against a database that already holds objects.
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    validate-on-migrate: true
    clean-disabled: true

  # -----------------------------------------------------------------------------------------------
  # Batch orchestration.
  #
  # Jobs run on demand only - through the job-launch REST surface, through the ordered message-queue
  # bridge that replaces the legacy online-to-batch hand-off, or from a test - and never at
  # start-up. An implicit start-up run would write rows before a fixture comparison could read them
  # and would make every measured step duration meaningless.
  #
  # Nine job configurations rather than dozens because, of the ~78 program-invocation steps across
  # the 29 legacy job members and 2 cataloged procedures, only nine invoke an application COBOL
  # program; the rest are dataset-utility invocations absorbed by the migrations, the Compose
  # service definitions and test fixtures.
  #
  # The batch metadata tables come from the batch framework's own bundled script, not from
  # V1__create_schema.sql, which is what keeps the application-table count at eleven. The prefix
  # below lets a reader tell the two families apart. The production overlay narrows this to `never`
  # so production DDL only arrives through a reviewed migration.
  batch:
    job:
      enabled: false
    jdbc:
      initialize-schema: always
      table-prefix: BATCH_

  # Region only. Endpoint overrides and credentials are profile scoped: local and test aim the
  # object-store, queue and notification clients at an emulator; production declares no override.
  cloud:
    aws:
      region:
        static: ${AWS_REGION:us-east-1}

  # In-flight work finishes before the process exits. The JVM runs as process 1 under an exec-form
  # entry point, so a termination signal reaches it directly and a batch chunk in progress commits.
  lifecycle:
    timeout-per-shutdown-phase: 30s

server:
  # 8080 is the port the image exposes, the port Compose publishes and the port the scrape target
  # addresses. APP_PORT lets independent clones run side by side; the fallback must stay 8080.
  port: ${APP_PORT:8080}
  shutdown: graceful
  # The error body is deliberately NOT shaped here. A failed request is rendered by this module's
  # own exception handler into its ErrorResponse contract, whose per-field MISSING and INVALID
  # states carry the two conditions the legacy screens signalled by changing a field's display
  # attribute. A framework-wide error format would flatten them into one.

# Observability. This block is a cross-file contract, not a convenience.
#
#   /actuator/health     - the HEALTHCHECK target of carddemo-java/Dockerfile and the gate any
#                          Compose service waiting on this application depends upon.
#   /actuator/prometheus - the scrape target in config/prometheus/prometheus.yml and the surface
#                          every panel of config/grafana/dashboards/carddemo-overview.json reads.
#
# Both paths are resolved literally by those sibling files, which is why the default /actuator base
# path is stated explicitly and must not move. Request authorization must leave the health probe and
# the scrape endpoint reachable, or the container image and the metrics pipeline break together.
#
# The percentile histograms below are instrumentation and not a threshold. No target percentile,
# latency or volume figure appears anywhere in this module, because the legacy estate documents
# none; the baseline is established from what these meters record.
management:
  endpoints:
    web:
      base-path: /actuator
      exposure:
        # THE MINIMUM SURFACE THAT STILL HONOURS THIS MODULE'S CROSS-FILE CONTRACTS, and nothing
        # beyond it. Exactly three endpoints are published, and each one is published because a
        # sibling file resolves its path literally:
        #   health     - the HEALTHCHECK of carddemo-java/Dockerfile and the readiness gate every
        #                Compose service waiting on this application depends upon
        #   prometheus - the scrape target of config/prometheus/prometheus.yml and the surface the
        #                provisioned dashboard panels read; also where the baseline is measured
        #   info       - build and Java-version confirmation, with property publication switched
        #                off below, so it can identify the artifact but never its configuration
        #
        # `metrics` is deliberately NOT here. It enumerates every registered meter name and lets
        # any single meter be queried, which describes the shape of the running system to anyone
        # who can reach it while adding nothing the scrape endpoint does not already provide to
        # the collector. The local overlay adds it back, together with the environment, bean,
        # mapping and logger endpoints, because diagnosing on a developer's own machine is what
        # those are for.
        #
        # This list is IDENTICAL to the production overlay's list, and that is the point: the
        # shared baseline is the production posture, and a profile widens it deliberately rather
        # than a profile having to remember to narrow it.
        include: health,info,prometheus
  endpoint:
    health:
      # Aggregate status only. The probe answers UP or DOWN and nothing else.
      #
      # Component detail is genuinely useful - it is how a failed migration or an unreachable
      # database surfaces in the probe body instead of only in the log - but the payload that
      # carries it also names every health contributor, the database product and version, and the
      # validation query, which together describe the internals of a system to an unauthenticated
      # caller. That is a diagnostic convenience, so it belongs to the profile where diagnosis
      # happens: the local overlay turns both of these back to `always`. Production and any
      # profile that forgets to override inherit the closed setting from here.
      show-details: never
      show-components: never
      # Liveness and readiness groups, for an orchestrated deployment. /actuator/health itself
      # remains the reachable aggregate, and that aggregate is what the image HEALTHCHECK reads.
      probes:
        enabled: true
  health:
    # Kept explicit: the datasource indicator is what makes a migration or connectivity failure
    # visible through the probe instead of only in the log.
    db:
      enabled: true
  info:
    # No application property is ever published through /actuator/info.
    env:
      enabled: false
    # Run-time confirmation that the deployed artifact is running on the Java 25 LTS target.
    java:
      enabled: true
  metrics:
    tags:
      # Named `application` deliberately: the scrape target contributes `service` and `tier`
      # labels, and a meter tag sharing one of those names would be renamed by the collector.
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        # Aggregable histograms for exactly the families the provisioned dashboard charts: one per
        # REST endpoint, and one per batch step and processed item.
        http.server.requests: true
        spring.batch.step: true
        spring.batch.item.process: true
  prometheus:
    metrics:
      export:
        enabled: true
  tracing:
    # Stated explicitly because the test profile switches tracing off.
    enabled: true
    sampling:
      # Full fidelity by default, so a migrated flow can be followed end to end while the
      # acceptance evidence is being gathered. The production overlay lowers this.
      probability: 1.0
  otlp:
    tracing:
      # Trace export over HTTP. The collector address is profile scoped; this fallback addresses
      # the trace sink published by the local Compose stack.
      endpoint: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:http://localhost:4318/v1/traces}

# The generated OpenAPI document IS the published, machine-readable description of the endpoints
# derived from the legacy screens. There is no separate hand-maintained contract document to keep
# in step with the code.
#
# BOTH SURFACES ARE OFF IN THE SHARED BASELINE, and each path is still declared so that a profile
# turning a surface on inherits the agreed path rather than inventing one.
#
# The document describes every endpoint, every request and response field, and every declared
# error of the migrated screen contract. That is precisely what a developer and a contract test
# need, and precisely what an unauthenticated caller should not be handed: served openly it is a
# ready-made map of the attack surface, and the viewer bundle additionally serves static assets
# and executes requests from the browser. Neither belongs to a posture that a deployment inherits
# by forgetting to choose one.
#
# The local overlay turns both back on. Nothing in the module reads these two flags to decide
# whether to BUILD the document: com.carddemo.config.OpenApiConfig contributes the description
# bean unconditionally, so the contract stays assertable by a test under any profile while the
# HTTP surface that would serve it stays closed unless a profile opens it.
springdoc:
  api-docs:
    enabled: false
    path: /v3/api-docs
  swagger-ui:
    enabled: false
    path: /swagger-ui.html
    # The static bundle that renders the document is pinned once in the build file and substituted
    # here during resource filtering, so the pin keeps one home. Left unset, the library reaches
    # for a bundle build of its own naming that the pinned artefact does not carry, and the viewer
    # then answers 404 even though the document itself is served. Verified by request.
    version: '@swagger-ui.version@'
    operations-sorter: alpha
    tags-sorter: alpha

# Appender selection, encoding and correlation fields live in logback-spring.xml; only levels are
# set here, so a profile can raise or lower verbosity without restating the appender layout.
logging:
  level:
    root: INFO
    com.carddemo: INFO
    org.springframework.batch: INFO
    org.flywaydb: INFO

# Application namespace: the logical resource names the legacy job streams carried as dataset
# references and the CICS definition carried as resource definitions. The overlays reuse these exact
# key paths, so a job parameter reads identically under every profile.
#
# Every value here is a resource name or a non-sensitive setting; endpoints and credentials are
# never declared at this level.
carddemo:
  aws:
    # Batch file staging, standing in for the sequential output datasets and generation-data-group
    # bases the legacy jobs wrote to. One prefix per output family, so no family overwrites another.
    s3:
      bucket: ${CARDDEMO_S3_BUCKET:carddemo-batch-staging}
      prefix:
        inbound: inbound/
        statements: statements/
        statements-html: statements-html/
        reports: reports/
        rejects: rejects/
        backups: backups/
    # The single online-to-batch bridge of the legacy system: the CICS transient-data queue named
    # JOBS, defined there as 80-byte fixed unblocked records, appended in order, with a write
    # failure ignored rather than raised. All three properties of that contract are preserved -
    # the fixed record width, an ordered message group so append order survives, and a publish
    # failure that is logged and tolerated instead of aborting the caller.
    #
    # The two names below are the module's canonical values and are fixed by the migration plan,
    # not chosen here. The queue is carddemo-jobs.fifo and the message group is
    # carddemo-job-submission; the same two strings appear byte-identically in every profile
    # overlay, in docker-compose.yml and in the emulator bootstrap script. Neither is a free
    # choice. The .fifo suffix is not decoration: the queue service rejects a first-in-first-out
    # queue whose name omits it, which is a start-up failure rather than a style preference. The
    # group id must be one stable value, because append order is preserved only within a single
    # message group, and append order is the part of the legacy queue contract that acceptance
    # drains a real queue to verify.
    #
    # The legacy resource name JOBS is not discarded by using these values. It is carried where it
    # is actually contractual - in the frozen operator message text emitted when a submission
    # fails, which names the transient-data queue verbatim and is asserted character for character
    # - and as provenance in this comment and in the traceability matrix, rather than as the
    # resource name itself. An infrastructure name and an operator-visible message are two
    # different contracts, and only the second is byte-compared. Namespacing the resource to this
    # module is what stops a target resource colliding with an unrelated queue in a shared account.
    #
    # Both are environment-overridable so that a deployment can relocate them without editing a
    # file. The group id is bound here rather than only in the overlays because the production
    # profile intentionally restates just the queue: without this binding production would inherit
    # a hard-coded group id that no environment could correct.
    sqs:
      job-submission-queue: ${CARDDEMO_SQS_QUEUE:carddemo-jobs.fifo}
      message-group-id: ${CARDDEMO_SQS_MESSAGE_GROUP_ID:carddemo-job-submission}
      record-length: 80
      fail-on-error: false
    # Job-completion fan-out, part of the message-queue integration named in the target stack. It
    # carries operational notifications only; no business record travels through it.
    sns:
      job-notification-topic: ${CARDDEMO_SNS_TOPIC:carddemo-job-notifications}
  security:
    # NO SIGNING VALUE IS DECLARED HERE, and none is defaulted - not even an empty one. The
    # overlays bind the signing material: a throwaway development value locally and in tests, and
    # a no-fallback environment reference in production, so a missing value aborts start-up.
    #
    # The issuer differs from spring.application.name on purpose: it is a token claim naming the
    # module and its artefact, not the metric service label, and neither should be edited to match
    # the other.
    #
    # DOCUMENTED PARITY EXCEPTION, stated here as a requirement on the credential-verification
    # layer. The legacy sign-on record held an eight-character cleartext password and the sign-on
    # program compared the entered value against it directly. This module's credential column is
    # sized for a hash instead, and no component may store or compare a cleartext credential. That
    # is the one place where the no-hardcoded-credentials requirement outranks byte-for-byte
    # faithfulness. No value from the legacy record is restated anywhere in this module.
    jwt:
      issuer: carddemo-java
      expiration: PT30M
    # FIELD ENCRYPTION AT REST. The customer record carries two regulated identity values in clear
    # text on the mainframe - a nine-digit national identifier and a twenty-character
    # government-issued identifier - and neither is stored in that form here. Both are sealed into an
    # authenticated, versioned envelope by com.carddemo.util.SensitiveFieldCodec (AES-256 in
    # Galois/Counter Mode) before they reach a column, and the customer entity refuses any value that
    # is not already sealed, so cleartext cannot reach the database through application code.
    #
    # NO KEY IS DECLARED HERE, and none is defaulted - not an empty value, not a placeholder. The key
    # is a secret, and the same rule the signing material follows applies to it: the overlays bind it,
    # with a throwaway value locally and in tests and a no-fallback environment reference in
    # production, so a missing key aborts start-up instead of quietly sealing data under something
    # accidental. A deployment that changes the key can no longer read what the previous key sealed;
    # that is a property of authenticated encryption, not a defect, and it is why the value belongs in
    # managed configuration rather than in this file.
    #
    # DOCUMENTED PARITY EXCEPTION, in the same class as the BCrypt substitution above. Encrypting at
    # rest is a divergence from the legacy design rather than a translation of it: it changes no record
    # image, no field offset and no output byte, and it is written up in docs/decision-log.md.
    #
    # TRANSPORT IS REQUIRED IN THE SHARED BASELINE. A bearer token and a sealed identity value are
    # both worthless over plaintext: the token can be lifted from the wire and replayed until it
    # expires, and the sealed value is only sealed at rest, so it travels in the clear once an
    # endpoint has decrypted it for a response. Requiring transport security is therefore not an
    # independent hardening step but the condition under which the two settings above mean
    # anything.
    #
    # It is relaxed ONLY by the two overlays that address containers on the same machine - local
    # and test - and each of them states the relaxation explicitly, so the concession is visible in
    # the profile that takes it rather than inherited silently by every profile.
    require-https: true
