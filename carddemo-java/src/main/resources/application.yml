# Shared configuration baseline for the CardDemo Java module, inherited by all three overlays:
#   application-local.yml -> the Docker Compose stack in carddemo-java/docker-compose.yml
#   application-test.yml  -> Testcontainers-provided endpoints
#   application-prod.yml  -> every secret resolved from the environment, with no fallback
# An overlay may override a key declared here; none introduces a competing key prefix. Overlays
# differ from this baseline in more than endpoints and credentials: the Flyway target, HTTPS
# enforcement, trace sampling, management exposure, contract publication and logging levels all
# differ by profile, and each is noted where it is declared below.
#
# THIS BASELINE IS FAIL-CLOSED, and that is a property to preserve rather than an observation. The
# rule for every setting here is: assume the profile that inherits it is production, so a
# convenience is declared closed here and WIDENED by the profile that needs it, never declared open
# and narrowed by production - a deployment can forget to select a profile but it cannot forget to
# inherit this file. Health detail, health components and contract publication are closed here and
# opened only in the local overlay; HTTPS is required here and relaxed only in local and test.
#
# A PROFILE-LESS START CANNOT REACH A RUNNING STATE. Three values the application cannot operate
# without are declared in no profile and defaulted nowhere - not to an empty value and not to a
# placeholder: spring.datasource.url, carddemo.security.jwt.secret and
# carddemo.security.field-encryption.key. Each overlay binds all three; this file binds none, and
# the data-source resolution throws during context refresh, so the failure is deterministic and
# arrives before the first request is accepted.
#
# THIS BASELINE IS FAIL-CLOSED, and that is a property to be preserved rather than a description of
# how one environment happens to have it set. The rule for every setting here is: assume the profile
# that inherits it is production. A convenience is therefore never declared here and then narrowed by
# the production overlay - it is declared closed here and WIDENED by the profile that needs it,
# because a deployment can forget to select a profile but it cannot forget to inherit this file.
# Concretely, four settings are closed here and opened only in application-local.yml:
#     management.endpoints.web.exposure.include   three endpoints, each a cross-file contract
#     management.endpoint.health.show-details     never - aggregate status only
#     management.endpoint.health.show-components  never
#     springdoc.api-docs                          disabled - the viewer is absent, see below
# and two are closed here and relaxed only in the local and test overlays:
#     carddemo.security.require-https             true
#     carddemo.security.anonymous-metrics-scrape  false - the scrape endpoint needs a credential
#
# A PROFILE-LESS START CANNOT REACH A RUNNING STATE, and it fails during start-up rather than
# serving anything. Three values that the application cannot operate without are declared in NO
# profile and defaulted NOWHERE - not to an empty value and not to a placeholder:
#     spring.datasource.url                        no data source can be determined
#     carddemo.security.jwt.secret                 no token can be signed or verified
#     carddemo.security.field-encryption.key       no regulated field can be sealed or read
# Each overlay binds all three; this file binds none. The first of them is resolved by the data
# source auto-configuration during context refresh, and with no url and no embedded database on
# the runtime class path that resolution throws, so the failure is deterministic and arrives
# before the first request is accepted. This is the intended behaviour and it is asserted by a
# test, so weakening it by adding a default here fails the build rather than passing review.
#
# WHAT IS DELIBERATELY ABSENT - every absence below is a recorded decision, not an oversight
#   * No active and no default profile. The platform supplies it: the module Dockerfile sets
#     SPRING_PROFILES_ACTIVE=local and Compose passes it through. Baking one in would let a
#     deployment that forgets the variable silently inherit an entire development environment - a
#     local datasource, a development signing value, a wider management surface - which is the
#     environment-scale equivalent of a defaulted credential. Failing fast is the correct
#     behaviour, and the paragraph above records exactly which three absent values produce it.
#   * No pool sizing and no time-out override on the datasource. The pool keeps its shipped
#     defaults because no legacy baseline exists to tune against.
#   * No JVM heap figure, no worker-thread count, no latency or volume figure of any kind.
#     Performance here is MEASURED, never asserted: no numeric service level is documented
#     anywhere in the legacy estate, so the observability wiring further down establishes the
#     first baseline for this implementation rather than testing against a threshold.
#   * No application-level caching layer. The legacy system had none, and introducing one would
#     move the very latency and consistency behaviour that baseline is meant to record.
#   * No credential and no credential default - not even a placeholder. See the security block at
#     the end of this file.
# =================================================================================================

spring:
  application:
    name: carddemo

  # Serialization settings chosen for exactness rather than convenience: an unknown property is
  # ignored so a client may echo a field this version does not read, but a float offered where an
  # integer is declared and a number offered where an enum is declared are both refused, because
  # either would silently reshape a fixed-width value. write-bigdecimal-as-plain keeps a monetary
  # value in plain decimal notation - scientific notation for the same number would not compare
  # byte for byte against legacy output.
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      fail-on-unknown-properties: false
      fail-on-numbers-for-enums: true
      accept-float-as-int: false
    generator:
      write-bigdecimal-as-plain: true

  datasource:
    driver-class-name: org.postgresql.Driver

  # open-in-view is off deliberately: no entity may be loaded lazily during rendering, which is what
  # keeps every fetch inside the transaction that owns it. ddl-auto is validate because Flyway owns
  # the schema, so a renamed column or a changed width fails start-up instead of reshaping the
  # database. The provider's JDBC time zone is pinned to UTC so a timestamp written by the batch tier
  # does not depend on the host zone.
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  # -----------------------------------------------------------------------------------------------
  # Schema evolution: versioned, forward-only, and the only path by which an application table or a
  # seeded row is created. There is no framework-managed initialisation script for the application
  # tables, so the migrations on the two locations below are the whole story for them.
  #
  #   classpath:db/migration/schema                                          EVERY profile
  #     V1__create_schema.sql        the eleven application tables
  #     V2__create_indexes.sql       keys and alternate-index equivalents
  #
  #   classpath:db/migration/seed                                            local and test ONLY
  #     V3__seed_reference_data.sql  the sample reference rows
  #     V4__seed_user_security.sql   the ten seeded sign-on identities
  #
  # TWO LOCATIONS, SPLIT BY PURPOSE, AND THE SEEDS ARE HELD BACK BY THE LOCATION LIST. This is the
  # mechanism AAP 0.3.1 and 0.4.2 require directly: "FlywayConfig resolves V3 and V4 from profile-scoped
  # locations so a production deployment migrates schema and indexes without inheriting sample data or
  # seeded credentials." Production resolves the schema location alone, so the two seeds are not
  # resolved there at all. The delivered inventory is exactly V1, V2, V3, V4 - there is no V1.1, because
  # the batch metadata tables are owned by Spring Batch.
  #
  # THE SHARED PARENT classpath:db/migration HOLDS NO SCRIPT AND IS DECLARED BY NO PROFILE. That is what
  # makes the location list a boundary rather than a label: a Flyway location is scanned RECURSIVELY, so
  # a script left in the parent, or a profile that named the parent, would reach across the split. Two
  # earlier revisions kept all four scripts flat in the parent for exactly that reason and relied on the
  # ceiling alone; the recursion argument is sound, and what it actually supports is moving the schema
  # scripts down as well, which is what has now been done. See docs/decision-log.md DL-127, which
  # supersedes DL-102 and DL-119.
  #
  # THE CEILING IS RETAINED BEHIND THE LOCATION LIST, not instead of it. target "2" applies 1 and 2 and
  # would decline 3 and 4 even if a seed location were resolved by mistake. This shared baseline carries
  # "2" rather than the convenience value, so a profile silent about migrations inherits the PRODUCTION
  # posture; only the local and test overlays lift it, and each lifts it explicitly for itself alongside
  # the seed location it also adds.
  #
  # THE CONSEQUENCE FOR A NEW SCRIPT, stated once here and repeated at each profile: a script that
  # production MUST run is numbered at or below 2 and belongs in db/migration/schema; a script
  # production must NEVER run is numbered above 2 and belongs in db/migration/seed. Both halves are part
  # of the decision, and the directory is the half that production cannot be talked out of.
  #
  # WHAT THIS MEANS TO THE MIGRATION TOOL, CHECKED RATHER THAN ASSUMED. Under target "2" the two seeds
  # are discovered and reported as above-target, and the migration still validates successfully, so a
  # pending above-target script is not an error a deployment has to suppress. The
  # configuration-baseline test asserts the resolved location list and the ceiling against the delivered
  # scripts, so the sentences above cannot go stale unnoticed.
  #
  # THE CEILING IS ENFORCED A SECOND TIME IN CODE, AND PRODUCTION ADDS A HISTORY-AND-DATA CHECK.
  # com.carddemo.config.FlywayConfig refuses to start a production profile whose resolved ceiling
  # reaches version 3 or beyond, re-applying the pin AFTER the configuration has been bound so an
  # inherited value, an operator override or a merged property source cannot lift it in silence; it also
  # refuses any resolved location outside classpath:db/migration/schema, which refuses the seed location
  # by name and refuses the shared parent too, because a location above the split reaches the seeds
  # recursively. com.carddemo.config.ProductionSeedRejectionCallback refuses a
  # production
  # start-up against a database whose migration history already records a seed version, whose
  # user_security table holds any of the ten reserved fixture identifiers, or whose tables match all
  # five of the reference seed's row counts at once - the case no configuration control can reach,
  # because that seeding happened before this process existed. Nor does the migration tool reach it:
  # validate-on-migrate does NOT reject such a database, because version 11 ignores future migrations
  # by default. Restoring the seeds to a production deployment therefore takes more than an overlay
  # edit: the refusals are unconditional, they are not expressed in any configuration file, and they
  # all fail in the same direction.
  #
  # Version 11 of the migration tool resolves PostgreSQL support from a separate artefact declared
  # beside flyway-core in pom.xml; without it the build still succeeds and the application then
  # fails at run time, so the two must stay declared together.
  #
  # baseline-on-migrate stays off: nothing exists to baseline, and enabling it would let V1 be
  # skipped in silence against a database that already holds objects.
  flyway:
    enabled: true
    # THE SCHEMA LOCATION ALONE. This is the production posture, and it is what a profile that stays
    # silent about migrations inherits. V1 and V2 live here; the two seed scripts live in a separate
    # location, classpath:db/migration/seed, which only the local and test overlays add.
    #
    # The shared parent classpath:db/migration is deliberately NOT declared. A Flyway location is
    # scanned recursively, so naming the parent would reach the seeds through the child directory and
    # the location list would stop being a boundary. See docs/decision-log.md DL-127.
    locations: classpath:db/migration/schema
    # Retained behind the location as belt and braces: V3 and V4 are numbered above this ceiling, so
    # even a seed location resolved by mistake would not be executed. FlywayConfig refuses to start a
    # production deployment whose bound ceiling reaches version 3 or beyond.
    target: "2"
    baseline-on-migrate: false
    validate-on-migrate: true
    clean-disabled: true

  # No job runs on start-up: a legacy batch job was submitted deliberately and never triggered by the
  # act of bringing an application up. The framework's own metadata tables are created if absent and
  # carry the default prefix, which is the prefix the integration tests assert on.
  batch:
    job:
      enabled: false
    jdbc:
      initialize-schema: always
      table-prefix: BATCH_

  # The region is bound from the environment with a development default; production binds it with no
  # fallback, because a defaulted region would place every resource in a region nobody chose.
  # queue-not-found-strategy is FAIL rather than CREATE on purpose: creating a missing queue would
  # turn a misconfigured destination into a submission that reports success while the cards sit in a
  # queue nothing consumes. Failing surfaces the misconfiguration at the first publish.
  cloud:
    aws:
      region:
        static: ${carddemo.aws.region}
      sqs:
        queue-not-found-strategy: FAIL

  # Graceful shutdown: in-flight work finishes within the phase timeout, matching a batch step that
  # must not be interrupted mid-record.
  lifecycle:
    timeout-per-shutdown-phase: 30s

server:
  port: ${APP_PORT:8080}
  shutdown: graceful

# THE MINIMUM SURFACE THAT STILL HONOURS THIS MODULE'S CROSS-FILE CONTRACTS. Exactly four endpoints
# are published, each because something else resolves it: health is the Dockerfile HEALTHCHECK and
# the readiness gate every Compose service waits on; prometheus is the scrape target of
# config/prometheus/prometheus.yml; metrics is the surface the performance baseline is read from;
# and info identifies the running build. Publishing an endpoint does not make it anonymously
# readable - SecurityConfig permits only the health probe and the Prometheus scrape without a
# credential and authenticates every other management path - so metrics is published and
# authenticated. Health detail and components are withheld: an aggregate status is all an
# unauthenticated probe may see, and a component list names the infrastructure behind it.
management:
  endpoints:
    web:
      base-path: /actuator
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: never
      show-components: never
      probes:
        enabled: true
  health:
    db:
      enabled: true
  info:
    env:
      enabled: false
    java:
      enabled: true
  # The application tag is the same label the log lines carry, so a metric and a log line can be
  # filtered by one value. Histograms are enabled for exactly the three timers the performance
  # baseline reads - request duration, batch step duration and per-item processing - because the
  # baseline reports percentiles rather than a single mean, and no numeric threshold is asserted
  # anywhere: the legacy estate documents none, so the gate establishes a baseline.
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
        spring.batch.step: true
        spring.batch.item.process: true
  prometheus:
    metrics:
      export:
        enabled: true
  # Sampling is complete here and in local, because a development trace that omits the one request
  # being diagnosed is worthless; production samples instead. The exporter endpoint defaults to the
  # collector the Compose stack provisions and is overridden per environment.
  tracing:
    enabled: true
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:http://localhost:4318/v1/traces}

# Contract publication is closed in this baseline and opened only in the local and test overlays.
# The published document is generated from the annotated controllers, so it is an artefact of the
# API rather than a hand-maintained file, and it is not exposed by default because an unauthenticated
# schema listing is an inventory of the surface an attacker would otherwise have to discover.
springdoc:
  api-docs:
    enabled: false
    path: /v3/api-docs
  swagger-ui:
    enabled: false

# Verbosity lives here, not in logback-spring.xml: that file owns appender selection, the encoders
# and the correlation fields, and the framework applies these levels after reading it. The batch and
# migration categories are pinned at INFO because local validation reads the log to confirm that
# every migration was applied and that each batch step reported its outcome.
logging:
  level:
    root: INFO
    com.carddemo: INFO
    org.springframework.batch: INFO
    org.flywaydb: INFO

# Module-owned settings. The four AWS resource names are a frozen inventory shared with
# docker-compose.yml, the LocalStack bootstrap script and every overlay, and they must agree
# byte-identically: a disagreement produces a stack that starts cleanly and publishes nowhere. The
# queue name must end in the FIFO suffix, which JobSubmissionService validates at construction, and
# production binds the queue with no fallback so a missing value fails start-up. The S3 prefixes
# separate the six staging areas the legacy job streams kept as separate datasets.
carddemo:
  aws:
    # THE SIX KEYS UNDER THIS PREFIX ARE THE MIGRATION PLAN'S OWN CONTRACT, and com.carddemo.config
    # AwsProperties binds exactly these and nothing else: region, endpoint-override,
    # s3.batch-staging-bucket, sqs.job-queue, sqs.message-group-id and sns.job-notification-topic.
    # An earlier revision of this file and of that class agreed with each other on a different set -
    # s3.bucket, sqs.job-submission-queue, six s3.prefix.* keys, and no region or endpoint key at
    # all - which is why the agreement between a document and its binder proves nothing about either:
    # one edit can move both. The plan states the key paths, this document follows it, and a test
    # asserts the withdrawn names are absent so a third round trip fails rather than passing review.
    #
    # The region, stated once per profile and derived from here by the AWS integration's own
    # spring.cloud.aws.region.static above rather than restated there. Every resource below is
    # provisioned in it, so a deployment that changed one and not the other would address an account
    # that holds none of them. Production supplies it with NO fallback and the start-up guard requires
    # it; the value defaulted here is the region the container composition and the emulator use.
    region: ${AWS_REGION:us-east-1}
    # An endpoint-override key is deliberately NOT declared here. It is optional, it exists only to aim
    # the clients at an emulator, and the local and test overlays are the profiles that declare it.
    # Production declares none, which is what makes each client resolve the region's own real endpoint,
    # and a shared baseline value would be inherited by production and have to be blanked to undo.
    #
    # Batch file staging, standing in for the sequential output datasets and generation-data-group
    # bases the legacy jobs wrote to. One bucket carries every staged object; the key an object is
    # written under is composed by the job that writes it, because a key names one object of one run
    # while this namespace carries only what a deployment may decide. Six s3.prefix.* keys were
    # declared here by an earlier revision and are withdrawn on the same principle as the two
    # withdrawn queue keys below: nothing bound them and no writer read one, so they read as
    # configuration while adjusting nothing. See docs/decision-log.md DL-094.
    s3:
      batch-staging-bucket: ${CARDDEMO_S3_BUCKET:carddemo-batch-staging}
    # The single online-to-batch bridge of the legacy system: the CICS transient-data queue named
    # JOBS, defined there as 80-byte fixed unblocked records, appended in order, with a write
    # failure ignored rather than raised. All three properties of that contract are preserved -
    # the fixed record width, an ordered message group so append order survives, and a publish
    # failure that is logged and tolerated instead of aborting the caller.
    #
    # The two names below are cross-file contracts rather than local choices: each appears
    # byte-identically in every place listed below, so changing one here changes nothing until all
    # of them change together. The queue is carddemo-jobs.fifo and the message group is
    # carddemo-job-submission, and both occur in every profile overlay, in docker-compose.yml and
    # in the emulator bootstrap script. The .fifo suffix is not decoration: the queue service
    # rejects a first-in-first-out queue whose name omits it, which is a start-up failure rather
    # than a style preference. The group id must be one stable value, because append order is
    # preserved only within a single message group, and append order is the part of the legacy queue
    # contract that acceptance drains a real queue to verify.
    #
    # THE FOUR RESOURCE NAMES ARE MANDATED, NOT CHOSEN. The migration plan states them and requires
    # them byte-identically: the bucket carddemo-batch-staging, the queue carddemo-jobs.fifo, the
    # message group carddemo-job-submission and the topic carddemo-job-notifications. Three of the
    # four were never in doubt; the queue was renamed to carddemo-jobs.fifo by an earlier revision and is
    # restored here.
    #
    # The argument that produced that rename is worth stating so it is not re-made. It held that the
    # legacy transient-data queue name is itself part of the frozen inventory, that no exception
    # authorises editing it, and that the module should therefore agree with the resource the
    # environment provisions. Each step fails. What the plan freezes for THIS resource is the target
    # name it prescribes, stated six times and backed by a validation check on the bootstrap script.
    # The legacy name is not lost: it is carried by the operator-visible message, which is the
    # contract that is actually compared byte for byte, and reproducing an external interface means
    # reproducing what the interface's consumers observe rather than what its infrastructure is
    # called. And agreeing with the provisioned resource by editing the module inverts the
    # dependency - the emulator bootstrap this module ships is what provisions the queue, so the
    # module decides the name and the environment follows.
    #
    # What survives from that argument is its warning, and it is retained: a well-formed name that
    # names nothing is exactly the input a create-on-absence default resolves by provisioning a queue
    # nothing consumes, so a submission would report complete while the cards sat unread. That is why
    # every one of the places listed above states one value, and why the fail-fast strategy described
    # above exists to make a disagreement loud rather than silent.
    #
    # The operator-visible message text is unaffected by any of this. It names the transient-data
    # queue verbatim as JOBS, without a suffix and without a namespace, and is asserted character for
    # character; it is frozen text rather than a resource reference, and nothing here composes one
    # from the other. See docs/decision-log.md DL-092.
    #
    # Both are environment-overridable so that a deployment can relocate them without editing a
    # file. The group id is bound here rather than only in the overlays because the production
    # profile intentionally restates just the queue: without this binding production would inherit
    # a hard-coded group id that no environment could correct.
    #
    # TWO FACTS ABOUT THIS QUEUE ARE DELIBERATELY NOT KEYS HERE: the 80-byte fixed record width and
    # the ignore-on-error failure tolerance. Both come from the legacy queue definition, and neither
    # is a deployment choice - a different width is a different record format, and a different
    # tolerance is a different failure contract, so neither describes this queue. Declaring them as
    # `record-length` and `fail-on-error` keys is rejected: they read as configuration while nothing in
    # the application binds either one; the values would be inert, and the file would advertise an
    # adjustability that does not exist. Binding them to a validator that permits only 80 and only
    # false would not fix that - it would relocate it, leaving a switch with one position and, for
    # the tolerance, a branch no deployment could ever reach.
    #
    # So they live where they are actually enforced, and are asserted there. The width is the
    # constant the publisher checks every card's encoded byte count against before it publishes, and
    # a card of any other width is rejected outright. The tolerance is the publisher's structure: the
    # write is caught and reported through its return value, never rethrown. The provenance of both -
    # the CICS attributes they derive from - is recorded against the queue-contract block in the
    # local overlay and in the traceability matrix, which is where a reader should look for the
    # legacy mapping. A test asserts that neither key has come back.
    # See docs/decision-log.md DL-094.
    sqs:
      job-queue: ${CARDDEMO_SQS_QUEUE:carddemo-jobs.fifo}
      message-group-id: ${CARDDEMO_SQS_MESSAGE_GROUP_ID:carddemo-job-submission}
    sns:
      job-notification-topic: ${CARDDEMO_SNS_TOPIC:carddemo-job-notifications}
  # The token issuer and lifetime are configuration rather than code; the signing secret is bound by
  # each overlay and defaulted nowhere. require-https is true in this baseline and relaxed only in
  # local and test, so a deployment that forgets to select a profile still refuses cleartext.
  security:
    jwt:
      issuer: carddemo-java
      expiration: PT30M
    require-https: true
    # -------------------------------------------------------------------------------------------
    # THE METRICS SCRAPE ENDPOINT IS CLOSED IN THE SHARED BASELINE, so a profile that says nothing
    # about it inherits the closed posture rather than an open one. This key is bound with NO
    # default, exactly like require-https above, which means a profile that omits it does not
    # quietly get either answer - the application refuses to start until the profile states one.
    #
    # WHAT THE EXPOSITION ACTUALLY CONTAINS, which is why this is not a formality. The endpoint
    # publishes per-endpoint request counts and latency distributions, per-batch-step record counts,
    # data-source pool saturation, and JVM heap, thread and garbage-collection internals. Together
    # those let an unauthenticated network client profile transaction volume, infer business
    # activity from batch counts, and time an attack against a deployment it holds no credential
    # for. That is a disclosure, not diagnostics: the health probe answers with a status word, and
    # this answers with the shape of the workload.
    #
    # ENFORCED, NOT DESCRIBED. SecurityConfig binds this key and adds the anonymous permit for the
    # scrape path only when it is set. When it is not, no permit is added and the path falls through
    # to the rule that authenticates everything under the management base path - so closing it takes
    # no second edit anywhere, and the endpoint STAYS PUBLISHED either way. A collector that presents
    # a bearer token still collects, which is why the performance gate is unaffected by this being
    # closed in production.
    #
    # It is opened ONLY by the two overlays whose collector runs on the same machine as the
    # application - local and test, the same two that relax transport - and each states the
    # concession in its own document rather than inheriting it.
    anonymous-metrics-scrape: false
