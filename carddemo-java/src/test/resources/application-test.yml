# TEST profile, SUITE OVERLAY - the copy on the test class path.
#
#   ./mvnw -B clean verify        # unit tier, then the container-backed tiers, all reading THIS copy
#
# THIS FILE SHARES ITS NAME WITH src/main/resources/application-test.yml AND SHADOWS IT DURING A
# SUITE RUN, because target/test-classes precedes target/classes and a `classpath:` config-data
# location answers with the FIRST match only. That is deliberate and both copies are named
# deliverables, so neither may be deleted or renamed. This copy is what a suite run resolves; the
# packaged copy is what a deployed `test`-profile run of the built artefact resolves.
# ConfigurationProfileBaselineTest asserts BOTH by physical location rather than by class-path name,
# so an assertion written for the packaged copy can no longer be answered by this one, and every
# value the two must agree on is compared between them.
#
# The shared baseline application.yml is NOT shadowed - it carries a different name - so everything
# this document does not restate is inherited from it. Two things are inherited on purpose and must
# NOT be restated here: the management surface, and the interface-description surface. The baseline
# publishes health, info, metrics and prometheus at the default /actuator base path, which is what
# makes /actuator/health and /actuator/prometheus reachable in a suite run; restating that list here
# would create a second place to widen it from, and ConfigurationProfileBaselineTest fails the build
# if this copy declares it at all. A suite that needs to observe the shipped posture must observe
# the shipped one.
#
# WHERE A CONTAINER ADDRESS COMES FROM
#
#   A container is assigned an ephemeral host port when it starts, so no address written into a file
#   can be correct for a suite run. Two shared support base classes own the container lifecycle and
#   are the single place an address lives:
#
#     src/test/java/com/carddemo/support/AbstractPostgresIT.java     the database server
#     src/test/java/com/carddemo/support/AbstractLocalStackIT.java   the AWS emulator
#
#   Each declares a @DynamicPropertySource method that registers the started container's real
#   address into the environment of any test that boots a Spring context, at a precedence above
#   every property file - so a context-booting subclass inherits the container it was given rather
#   than anything written here. A test that works directly against the container, over raw JDBC or a
#   directly-built SDK client, takes the same values through the accessors instead. NO TEST DECLARES
#   ITS OWN CONTAINER; that is what keeps the tiers composable. @ServiceConnection is deliberately
#   NOT used - spring-boot-testcontainers is not a dependency of this module - and an earlier
#   revision of this comment named it anyway. See docs/decision-log.md DL-104.
#
# Provenance of every legacy fact cited below: checkout 7756d895ffeb65f7ea72aaa609e356d9899afcec,
# upstream release stamp CardDemo_v1.0-15-g27d6c6f-68 dated 2022-07-19. No COBOL, job-stream,
# screen-map, copybook or CICS resource-definition source text appears in this file: the estate is
# cited by resource name, record width, migration name and property name only.

spring:
  datasource:
    # NEITHER THE url NOR THE username NOR THE credential KEY IS DECLARED HERE, AND THAT ABSENCE IS
    # THE SETTING - the packaged copy states the same three omissions in the same terms. An
    # ephemeral port is unknowable ahead of the run, and any value written here that is REACHABLE is
    # worse than no value: it would let a test that forgot to extend AbstractPostgresIT connect to
    # the DEVELOPER'S OWN database and silently pass. With the keys absent, data-source resolution
    # fails during context refresh and names the missing property. A context-booting subclass of
    # AbstractPostgresIT gets the container's address from that class's @DynamicPropertySource.
    #
    # The engine is real PostgreSQL 16 in every tier - postgres:16.14-bookworm, started by that base
    # class. No in-memory engine is used anywhere: the eleven application tables carry zoned-decimal
    # widths, composite keys and a versioned schema that only the real engine validates.
    #
    # The driver IS fixed, so a slicing test does not attempt embedded-database auto-detection and
    # quietly substitute an in-memory engine for the migrated schema. Pool sizing and time-outs are
    # deliberately absent: the pool keeps its shipped defaults, exactly as the baseline says, because
    # no legacy figure exists to tune against and a suite must not measure a tuning this module never
    # ships.
    driver-class-name: org.postgresql.Driver

  jpa:
    open-in-view: false
    hibernate:
      # validate, never create/create-drop/update. Flyway owns every table, index and constraint, so
      # a mapping that has drifted from the migrated schema must fail at start-up rather than be
      # silently reconciled by generated DDL.
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    # TWO SETTINGS ADMIT THE SEEDS: the second location, and the lifted ceiling. The delivered scripts
    # sit in two sibling directories whose shared parent holds no script at all -
    # classpath:db/migration/schema carries V1__create_schema.sql and V2__create_indexes.sql, and
    # classpath:db/migration/seed carries V3__seed_reference_data.sql and V4__seed_user_security.sql,
    # the reference-data and sign-on seeds the gate fixtures assert against. THE LOCATION LIST IS THE
    # SEPARATION: the shared baseline declares the schema location alone, which is the production
    # posture, and naming the seed location here is what makes V3 and V4 resolvable. Do not drop the
    # second entry - it leaves every fixture asserting against an empty result set. The baseline also
    # pins spring.flyway.target to "2", the highest version the schema location delivers, so the
    # `target: latest` below is the second half of admitting the seeds: without it the two seed
    # versions resolve and are reported above target rather than applied. Production resolves the
    # schema location only and holds the pin, and com.carddemo.config.FlywayConfig refuses anything
    # else there. See docs/decision-log.md DL-298 for the split and DL-334 for the ceiling.
    #
    # NEVER COLLAPSE THESE TWO INTO THEIR PARENT classpath:db/migration. A Flyway location is scanned
    # RECURSIVELY, so the parent resolves the same four scripts - but it records each one under a name
    # relative to itself, so the history would read schema/V1__create_schema.sql where the bring-up
    # check expects V1__create_schema.sql. FlywayConfig refuses the parent under every profile.
    #
    # Written as a YAML sequence rather than a scalar because there are now two entries; a scalar
    # cannot express both, and a comma-separated scalar would hide the second one from a reader.
    #
    # The ten sign-on identities V4 seeds are BCrypt digests and belong to the non-production
    # profiles alone; no cleartext credential appears in this file, in a comment or in a message.
    locations:
      - classpath:db/migration/schema
      - classpath:db/migration/seed
    target: latest
    # A suite may drop and rebuild the schema it owns; production may not, and the baseline keeps it
    # disabled there. baseline-on-migrate and validate-on-migrate are inherited from the baseline
    # unchanged: migrations are forward-only and are validated on every run.
    clean-disabled: false

  batch:
    job:
      # No job runs merely because a context was refreshed. Every job in the suite is launched
      # explicitly, by a test or through the launch surface, so a context-booting test never fires a
      # posting run as a side effect.
      enabled: false
    jdbc:
      # `always` under every profile, inherited from the shared baseline and restated here because
      # this document is the one a suite run actually reads. Spring Batch provisions its own metadata
      # tables and sequences from its bundled PostgreSQL script, under the BATCH_ prefix the baseline
      # sets.
      #
      # THOSE BATCH_ TABLES ARE EXPECTED AND ARE EXCLUDED FROM THE ELEVEN-TABLE ASSERTION: the count
      # of eleven is APPLICATION tables only - the eleven record layouts V1__create_schema.sql
      # creates - and framework metadata is neither counted nor owned by a migration. AAP 0.3.1
      # assigns the metadata to the framework and the eleven tables to V1, which is what keeps the
      # delivered migration inventory at exactly four scripts. The initialiser is idempotent, so a
      # re-used database is unaffected.
      initialize-schema: always

  # AN AWS ENDPOINT IS NOT LIKE A DATABASE ADDRESS AND MUST BE DECLARED. An absent datasource URL
  # fails closed; an absent AWS endpoint does NOT - the SDK falls back to the REGION'S REAL PUBLIC
  # ENDPOINT. So a framework-created S3, SQS or SNS client under this profile with no endpoint set
  # would address a real AWS account, and would do so silently on the credentials it happened to
  # find. An earlier revision of this file set no endpoint at all and relied on the base classes,
  # which only ever bound the clients they built themselves.
  #
  # The endpoints below therefore redirect every client at the emulator. The redirection IS the
  # setting, not a placeholder. It is the same shape the packaged copy uses, so the two agree: the
  # emulator answers on a FIXED container port, 4566, so an endpoint written here is meaningful, and
  # both variables allow a differently-published emulator to be addressed without editing the file.
  # A context-booting subclass of AbstractLocalStackIT overrides all of this with the ephemeral
  # address of the emulator that class started, at a precedence above every property file. Whichever
  # of the two applies, no client can reach a real account. See docs/decision-log.md DL-104.
  #
  # LocalStack COMMUNITY serves all three services this module uses - S3, SQS and SNS. No Pro-only
  # feature is configured and no authentication token is read.
  #
  # The credential pair below is a FLOOR and is not a credential of anything: the emulator accepts
  # any non-empty pair and verifies neither, and the placeholder text says so. Declaring it is what
  # keeps the SDK's default credential chain - which on a developer machine or a build agent can find
  # a REAL key - out of the picture entirely. AbstractLocalStackIT raises both to the emulator's own
  # throwaway pair for a context-booting test, and the environment variables let a CI runner supply
  # its own inert pair. Never substitute a real access key here.
  #
  # ONLY LOCALSTACK_* MAY OVERRIDE THEM, and that restriction is what makes the sentence above true.
  # An earlier revision read AWS_ACCESS_KEY_ID and AWS_SECRET_ACCESS_KEY - the default chain's own
  # variable names - so the paragraph claimed to shut that chain out while quietly reading the values it
  # would have found. The ambient key would then have been signed into requests aimed at the emulator,
  # which verifies nothing and would therefore never have failed to reveal it. The dedicated names
  # cannot be set by accident, and they are the names application-local.yml and docker-compose.yml
  # already use, so a CI runner supplies an inert pair through one vocabulary rather than two.
  #
  # Path-style addressing is required because the emulator does not serve virtual-hosted bucket
  # subdomains; production turns it off.
  cloud:
    aws:
      region:
        static: ${carddemo.aws.region}
      credentials:
        access-key: ${LOCALSTACK_ACCESS_KEY_ID:localstack-placeholder-not-a-real-key}
        secret-key: ${LOCALSTACK_SECRET_ACCESS_KEY:localstack-placeholder-not-a-real-secret}
      endpoint: http://${LOCALSTACK_HOST:localhost}:${LOCALSTACK_PORT:4566}
      s3:
        endpoint: http://${LOCALSTACK_HOST:localhost}:${LOCALSTACK_PORT:4566}
        path-style-access-enabled: true
      sqs:
        endpoint: http://${LOCALSTACK_HOST:localhost}:${LOCALSTACK_PORT:4566}
        observation-enabled: true
      sns:
        endpoint: http://${LOCALSTACK_HOST:localhost}:${LOCALSTACK_PORT:4566}

management:
  tracing:
    # INSTRUMENTATION STAYS ON, and only the export leaves. com.carddemo.config.ObservabilityConfig
    # records the contract this honours: the test profile neutralises export while leaving the
    # tracing instrumentation switched on, so the bridge still places the trace and span identifiers
    # in the diagnostic context and the correlation fields of a log line still resolve - which is
    # what logback-spring.xml publishes through its two-key allow list. Switching instrumentation
    # off outright, as an earlier revision of this copy did, empties those fields for every test in
    # the suite and leaves the packaged copy exercising a posture no suite run ever sees.
    enabled: true
    sampling:
      # An optimisation and nothing more: it suppresses ROOT spans, which keeps recording cost off
      # several hundred context refreshes. It is NOT the export control and cannot be - the effective
      # sampler is parent-based over the ratio sampler, so a request arriving with an already-sampled
      # traceparent is sampled whatever the ratio says. The identifiers of an unsampled span are
      # still valid and still reach the diagnostic context. Same value as the packaged copy.
      probability: 0.0
  otlp:
    tracing:
      export:
        # THE export control, and the reason nothing is exported. Boot resolves this key BEFORE
        # management.tracing.enabled when deciding whether to create the OTLP exporter, so no
        # exporter bean exists, nothing opens a transport, and a suite run that has no collector
        # produces no connection-refused noise. See docs/decision-log.md DL-104.
        enabled: false
      # Never called while the switch above is false. Retained so the key path is identical across
      # profiles and a deliberate diagnostic session has somewhere to send spans the moment it is
      # flipped.
      endpoint: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:http://localhost:4318/v1/traces}

logging:
  level:
    root: WARN
    com.carddemo: INFO
    org.springframework.batch: WARN
    org.testcontainers: WARN
    com.github.dockerjava: WARN
    org.flywaydb: INFO

carddemo:
  aws:
    # The region and the endpoint override are bound HERE, in the carddemo namespace, because those are
    # the two keys com.carddemo.config.AwsProperties binds and the spring.cloud.aws block above derives
    # its own region and endpoints from them. Stating each fact once per document is what stops the two
    # namespaces from naming different regions or different services. The override carries the same
    # expression as the endpoints above; AbstractLocalStackIT raises both to the ephemeral address of
    # the emulator it started, at a precedence above this file.
    region: us-east-1
    endpoint-override: http://${LOCALSTACK_HOST:localhost}:${LOCALSTACK_PORT:4566}
    s3:
      batch-staging-bucket: carddemo-batch-staging
    sqs:
      # The name the migration plan prescribes - it names this resource JOBS - suffixed because a
      # FIFO queue must be. The other three resources are module-namespaced because the plan names
      # no value for them. The operator-visible message text names the transient-data queue as plain
      # JOBS, and nothing composes one from the other. The 80-byte record width and the
      # ignore-on-error tolerance are deliberately not keys here - both are enforced in the
      # publisher instead. See docs/decision-log.md DL-092 and DL-094.
      job-queue: JOBS.fifo
      message-group-id: carddemo-job-submission
    sns:
      job-notification-topic: carddemo-job-notifications
  security:
    jwt:
      issuer: carddemo-java
      # A SUITE FIXTURE, resolved from the environment first so a runner can supply its own, with a
      # self-describing test-only tail so that a suite run needs nothing configured. It signs tokens
      # that exist for the length of one test and is worth nothing outside this suite.
      #
      # The tail must stay byte-identical to the packaged src/main/resources/application-test.yml:
      # ConfigurationProfileBaselineTest compares the two copies' resolved value, because a suite that
      # signed with one secret while the artefact verified with another would pass on a contract
      # nothing ships. The key is declared rather than omitted for the same reason - the binder
      # requires a non-blank secret, and this is the copy in force during a suite run.
      #
      # PRODUCTION IS THE OPPOSITE AND MUST STAY SO: application-prod.yml writes a bare
      # ${CARDDEMO_JWT_SECRET} with NO tail, so an absent variable fails start-up rather than binding
      # a value that shipped in the repository. A bare reference is production's alone; writing one
      # here would make a suite run depend on a variable nothing guards. See docs/decision-log.md
      # DL-105.
      #
      # THE VARIABLE NAME IS THE SUITE'S OWN, AND THAT IS THE POINT. This overlay used to read
      # ${CARDDEMO_JWT_SECRET} - production's variable - so any machine that already exported a
      # deployment signing secret injected it into the suite without a word. Nothing failed and
      # nothing reported it: the placeholder resolved, the tail was ignored, and the tests signed and
      # verified with a production credential. Placeholder resolution is by exact key, so a
      # test-scoped name is a complete fix rather than a mitigation - production's variable is not
      # read here at all, and JwtPropertiesTest asserts that this overlay names it nowhere.
      secret: ${CARDDEMO_TEST_JWT_SECRET:test-only-signing-secret-not-used-outside-tests-0123456789}
      expiration: PT15M
    field-encryption:
      # THE ONE NON-PRODUCTION FIXTURE KEY. Base64 of exactly 32 bytes, decoding to obviously
      # synthetic text. Fixed rather than random so that a sealed fixture is reproducible across
      # runs; test-only, never deployed, and worth nothing outside this suite.
      #
      # This literal must stay byte-identical to the default in application-local.yml and in the
      # packaged src/main/resources/application-test.yml. V3__seed_reference_data.sql seeds fifty
      # customer.govt_issued_id values as ENC1 envelopes, an envelope opens under exactly one key,
      # and every non-production profile applies V3 - so a divergent key here would leave the seeded
      # rows unreadable in this suite while remaining readable elsewhere.
      key: Y2FyZGRlbW8tbm9ucHJvZC1maXh0dXJlLWtleSEhISE=
    # RELAXES A REQUIRED BASELINE, stated here so the concession is visible in the profile taking it.
    # application.yml requires transport security. A Testcontainers-provided endpoint is reached over
    # the loopback interface by the process that started it and is destroyed with the suite, so there
    # is no wire for a token or a decrypted field to be observed on. Nothing else is relaxed: the
    # management surface and the interface description stay exactly as the baseline closed them, so a
    # test asserting the shipped posture asserts the real one.
    require-https: false
    # OPENS A CLOSED BASELINE, stated here so the concession is visible in the profile taking it.
    # application.yml closes anonymous metrics scraping. This suite reads the exposition over the
    # loopback interface within its own process, so there is no untrusted client to withhold it from,
    # and a suite that could not read it could not assert on a meter. Nothing else is opened, and this
    # value must stay in step with the packaged src/main/resources/application-test.yml. Production
    # does not open this.
    anonymous-metrics-scrape: true
    # -------------------------------------------------------------------------------------------
    # OPERATOR CREDENTIAL FOR THE MANAGEMENT SURFACE. config/SecurityConfig matches the whole
    # management base path with its own filter chain, permits exactly three anonymous paths - the
    # aggregate health endpoint and its two probe groups - and requires the ROLE_MONITORING authority
    # for everything else beneath it. That authority is held ONLY by a caller presenting this
    # credential; neither of the two authorities a sign-on grants can satisfy it, which is the point:
    # a collector is not a user of this application, and an ordinary signed-on cardholder must not be
    # able to read per-endpoint latency, per-batch-step record counts, pool saturation or JVM
    # internals.
    #
    # THIS VALUE IS A TEST LITERAL AND IS NOT A SECRET OF ANYTHING, and it must stay in step with the
    # packaged src/main/resources/application-test.yml for the same reason every other value in this
    # twin does: a test that boots from one copy must observe what the other declares.
    #
    # Overridable by CARDDEMO_TEST_MANAGEMENT_TOKEN so a build agent can supply its own inert value.
    # The setting is bound with an EMPTY default in the baseline, and empty is FAIL-CLOSED: no identity
    # can hold the authority, so the surface admits nobody beyond the three probe paths. Production
    # binds CARDDEMO_MANAGEMENT_TOKEN - a DIFFERENT variable - to a bare reference with no fallback and
    # is refused start-up without it.
    #
    # The name is test-scoped for the same reason the signing secret above is: read under production's
    # name, an operator credential already exported for a deployment would have been bound here
    # silently, and a suite would have exercised the management surface with a live credential.
    management:
      token: ${CARDDEMO_TEST_MANAGEMENT_TOKEN:test-only-management-token-not-used-outside-tests}
