#
# TEST profile - bound to Testcontainers-provided endpoints.
#
# Container URLs are intentionally NOT hardcoded here: integration tests supply them through
# @ServiceConnection (spring-boot-testcontainers) or @DynamicPropertySource from the shared
# support base classes (AbstractPostgresIT / AbstractLocalStackIT). Unit tests that never touch
# a container simply do not start a datasource.

spring:
  datasource:
    # Overridden per test class by Testcontainers; the driver is fixed so slicing tests
    # (@DataJpaTest etc.) do not attempt embedded-database auto-detection.
    driver-class-name: org.postgresql.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    # Reference-data and user-security seeds are required by the gate fixtures.
    locations: classpath:db/migration,classpath:db/seed
    clean-disabled: false

  batch:
    job:
      enabled: false
    jdbc:
      initialize-schema: always

  cloud:
    aws:
      region:
        static: us-east-1
      credentials:
        access-key: test
        secret-key: test
      s3:
        path-style-access-enabled: true

management:
  tracing:
    enabled: false
  otlp:
    tracing:
      # No trace export during tests.
      endpoint: http://localhost:4318/v1/traces

logging:
  level:
    root: WARN
    com.carddemo: INFO
    org.springframework.batch: WARN
    org.testcontainers: WARN
    com.github.dockerjava: WARN
    org.flywaydb: INFO

carddemo:
  aws:
    s3:
      bucket: carddemo-batch-staging
    sqs:
      # The legacy resource name, carried unchanged and suffixed only because a FIFO queue must be;
      # the operator-visible message text still names the transient-data queue as plain JOBS. The
      # 80-byte record width and the ignore-on-error tolerance are deliberately not keys here -
      # both are enforced in the publisher instead. See docs/decision-log.md DL-092 and DL-094.
      job-submission-queue: JOBS.fifo
      message-group-id: carddemo-job-submission
    sns:
      job-notification-topic: carddemo-job-notifications
  security:
    jwt:
      issuer: carddemo-java
      secret: test-only-signing-secret-not-used-outside-tests-0123456789
      expiration: PT15M
    field-encryption:
      # Base64 of exactly 32 bytes. Fixed rather than random so that a sealed fixture is reproducible
      # across runs; test-only, never deployed, and worth nothing outside this suite.
      key: Y2FyZGRlbW8tdGVzdC1vbmx5LWZpeGVkLWtleSEhISE=
    # RELAXES A REQUIRED BASELINE, stated here so the concession is visible in the profile taking it.
    # application.yml requires transport security. A Testcontainers-provided endpoint is reached over
    # the loopback interface by the process that started it and is destroyed with the suite, so there
    # is no wire for a token or a decrypted field to be observed on. Nothing else is relaxed: the
    # management surface and the interface description stay exactly as the baseline closed them, so a
    # test asserting the shipped posture asserts the real one.
    require-https: false
