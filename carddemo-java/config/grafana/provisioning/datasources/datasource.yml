# Grafana data source provisioning for the CardDemo local validation stack.

apiVersion: 1

datasources:
  - name: Prometheus
    uid: carddemo-prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
    jsonData:
      timeInterval: 10s
      httpMethod: POST

  - name: Jaeger
    uid: carddemo-jaeger
    type: jaeger
    access: proxy
    url: http://jaeger:16686
    isDefault: false
    editable: false
