# Grafana dashboard provider: loads every dashboard JSON mounted at /var/lib/grafana/dashboards.

apiVersion: 1

providers:
  - name: carddemo
    orgId: 1
    folder: CardDemo
    folderUid: carddemo
    type: file
    disableDeletion: true
    allowUiUpdates: false
    updateIntervalSeconds: 30
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
