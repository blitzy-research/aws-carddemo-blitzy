# ---------------------------------------------------------------------------
# CardDemo :: carddemo-java :: Maven Wrapper distribution configuration
# ---------------------------------------------------------------------------
# This file is the SINGLE SOURCE OF TRUTH for the Apache Maven version that
# builds this module. Neither mvnw, nor mvnw.cmd, nor the Dockerfile, nor the
# CI workflow may carry a second copy of the version or the distribution URL.
# Holding it in exactly one place is what makes the build hermetic: a clean
# checkout on Linux, macOS or Windows, the Docker builder stage and CI all
# resolve bit-identical Apache Maven 3.9.16, with no preinstalled Maven and no
# prerequisite beyond a JDK.
#
# Both launcher scripts read this file directly; the path below .mvn/wrapper is
# hardcoded in them, so this file must not be renamed, relocated or duplicated.
#
# wrapperVersion         The Maven Wrapper version the launcher scripts were
#                        generated from. Bookkeeping for maven-wrapper-plugin;
#                        the launchers themselves ignore it.
# distributionType       only-script -- the wrapper ships as launcher scripts
#                        alone. This is the declarative record of why no
#                        maven-wrapper.jar is committed anywhere in this
#                        repository: only-script mode provably needs none,
#                        because the scripts resolve, download, verify and
#                        cache the distribution themselves.
# distributionUrl        The exact archive to download. Both launchers reject
#                        any value that does not end in -bin.zip, so never
#                        substitute a tar.gz or a mirror path that rewrites the
#                        filename.
# distributionSha256Sum  SHA-256 of that archive, making the download verified
#                        rather than trusted; a tampered archive fails the
#                        build closed. Two constraints are load-bearing. It
#                        must be present, because the POSIX launcher validates
#                        only when the key is non-empty and otherwise skips
#                        verification silently. It must be lowercase hex of
#                        exactly 64 characters, because the Windows launcher
#                        lowercases the computed hash but not this configured
#                        value, so an uppercase digest would pass on Linux and
#                        fail on Windows.
#
# Every value below is pinned to an exact coordinate. No range, and no
# floating or unresolved reference of any kind.
# ---------------------------------------------------------------------------
wrapperVersion=3.3.4
distributionType=only-script
distributionUrl=https://repo.maven.apache.org/maven2/org/apache/maven/apache-maven/3.9.16/apache-maven-3.9.16-bin.zip
distributionSha256Sum=5af3b743dd8b876b5c45da33b676251e5f1687712644abb4ee519ca56e1d89ce
