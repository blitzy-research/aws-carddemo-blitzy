# Sole declaration of the Maven version that builds this module; mvnw, mvnw.cmd,
# the Dockerfile and the CI workflow all resolve it from here, so no second copy
# of the version or URL may exist. Both launchers hardcode this path, so the file
# must not be renamed or relocated.
#
# distributionType=only-script is why no maven-wrapper.jar is committed: the
# launcher scripts resolve, verify and cache the distribution themselves, and
# they reject any distributionUrl that does not end in -bin.zip.
#
# That last clause is a guarantee, not an aspiration, and each launcher earns it
# without help from any external utility. On Linux and macOS mvnw downloads with
# wget or curl and falls back to the JDK when neither exists, digests with
# sha256sum or shasum and falls back to java.security when neither exists, and
# extracts with unzip and falls back to the JDK's zip filesystem provider when it
# is absent - so a machine carrying only a JDK still builds, and still verifies.
# On Windows mvnw.cmd uses Get-FileHash and Expand-Archive, both shipped with the
# operating system's own PowerShell. Nothing in either path installs, or asks the
# operator to install, a checksum or archive tool.
#
# Both launcher scripts read this file directly; the path below .mvn/wrapper is
# hardcoded in them, so this file must not be renamed, relocated or duplicated.
#
# wrapperVersion         The Maven Wrapper version the launcher scripts were
#                        generated from. Bookkeeping for maven-wrapper-plugin;
#                        the launchers themselves ignore it.
# distributionType       only-script -- the wrapper ships as launcher scripts
#                        alone. This is the declarative record of why no
#                        maven-wrapper.jar is committed anywhere in this
#                        repository: only-script mode provably needs none,
#                        because the scripts resolve, download, verify and
#                        cache the distribution themselves.
# distributionUrl        The exact archive to download. Both launchers reject
#                        any value that does not end in -bin.zip, so never
#                        substitute a tar.gz or a mirror path that rewrites the
#                        filename. Neither launcher rewrites it either: this is
#                        the only archive ever fetched, whatever tooling the
#                        machine happens to have, which is precisely what lets a
#                        single digest below describe the bytes that arrive.
# distributionSha256Sum  SHA-256 of that archive, making the download verified
#                        rather than trusted; a tampered archive fails the
#                        build closed. Because it describes the -bin.zip named
#                        above, and that archive is the only one fetched, this
#                        digest can never be checked against a different
#                        archive than the one it was computed from. Two
#                        constraints are load-bearing. It must be present,
#                        because the POSIX launcher validates only when the key
#                        is non-empty and otherwise skips verification
#                        silently - and when the key IS present, verification
#                        is unconditional: a machine without sha256sum or
#                        shasum digests the archive with the JDK rather than
#                        proceeding unverified. It must be lowercase hex of
#                        exactly 64 characters, because the Windows launcher
#                        lowercases the computed hash but not this configured
#                        value, and the JDK fallback likewise emits lowercase,
#                        so an uppercase digest would fail wherever either is
#                        used.
#
# Every value below is pinned to an exact coordinate. No range, and no
# floating or unresolved reference of any kind.
# ---------------------------------------------------------------------------
wrapperVersion=3.3.4
distributionType=only-script
distributionUrl=https://repo.maven.apache.org/maven2/org/apache/maven/apache-maven/3.9.16/apache-maven-3.9.16-bin.zip
distributionSha256Sum=5af3b743dd8b876b5c45da33b676251e5f1687712644abb4ee519ca56e1d89ce
