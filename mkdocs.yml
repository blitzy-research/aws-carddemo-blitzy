site_name: 'blitzy-card-demo'
# MkDocs cannot emit a single sitemap <loc> without an absolute site_url, so an absent one publishes
# sitemap.xml and sitemap.xml.gz as a bare, empty <urlset>. The host is the GitHub Pages domain of the
# organisation named in catalog-info.yaml's github.com/project-slug annotation; only the sitemap and the
# per-page canonical link consume it, because every in-page link stays relative - which is what lets
# Backstage TechDocs (techdocs-ref: dir:.) serve this same build under a path of its own choosing.
#
# THE PATH IS DELIBERATELY THE SITE ROOT, AND A SUB-PATH HERE BREAKS THE ERROR PAGE. MkDocs renders
# error templates with base_url = urlsplit(site_url).path, because a 404 can be served for a URL at any
# depth and its asset references therefore have to be absolute rather than relative. Any sub-path would
# be baked into 404.html as /<sub-path>/assets/..., which resolves nowhere when the build is served from
# its own root - the themed error page would arrive completely unstyled, with its stylesheet, its script
# bundle and its eight-entry navigation all 404. A root path keeps those references at /assets/..., the
# same shape the page carried before this file declared a site_url at all.
site_url: https://blitzy-sandbox.github.io/
nav:
  - Home: index.md
  - Architecture: architecture.md
  - Onboarding Guide: onboarding-guide.md
  - Traceability Matrix: traceability-matrix.md
  - Decision Log: decision-log.md
  - Gate Evidence: gate-evidence.md
  - Project Guide: project-guide.md
  - Technical Specifications: technical-specifications.md
# PLUGIN ORDER IS LOAD-BEARING, AND THE OBVIOUS ORDER FAILS THE BUILD. techdocs-core is what switches
# the theme to material, and material/search resolves material's own templates during on_config, so
# naming material/search first aborts the build with jinja2 TemplateNotFound 'partials/language.html'.
#
# WHY material/search IS NAMED AT ALL. techdocs-core registers a search plugin itself, under the key
# `search`. mkdocs-material's partials/header.html gates the search UI on `"material/search" in
# config.plugins`, so that key is the only spelling that renders a search box; without it the site
# publishes a multi-megabyte search index no reader can reach. The same drift has a second symptom:
# material no longer declares `search_index_only`, so mkdocs' own contrib search plugin appends
# `search/main.js`, which reads a `base_url` global that only the mkdocs theme defines - one
# ReferenceError on every themed page. use_material_search: true replaces that plugin with material's,
# which carries its own worker and needs no such global, and removes the error at its source.
plugins:
  - techdocs-core:
      use_material_search: true
  - material/search
  - mermaid2
# WHY THE MERMAID FENCE IS DECLARED HERE RATHER THAN LEFT TO THE PLUGIN. techdocs-core configures
# pymdownx.highlight with linenums and pygments_lang_class, and Pygments has no `mermaid` lexer, so a
# ```mermaid fence is highlighted as plain text and its wrapper class becomes `language-text`. Neither
# selector mermaid2 looks for (`pre code.mermaid`, `pre code.language-mermaid`) can then match, and
# every diagram publishes as a line-numbered code table instead of a figure. Claiming the fence for
# mermaid2 before the highlighter sees it is what makes the plugin effective.
#
# The format function is fence_mermaid, which emits <div class="mermaid">, and not the _custom variant:
# techdocs-core relocates a user pymdownx.superfences config into the pymdownx.extra namespace, so
# mermaid2's custom-loader detection can never find it, and the custom variant would render markup whose
# loader is never wired. Fences in any other language keep their Pygments highlighting and line numbers.
markdown_extensions:
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:mermaid2.fence_mermaid
# The publication stylesheet. It carries reading corrections that belong to the theme's layout rather than
# to any page's content - marking the references that intentionally leave the site, and making horizontally
# scrollable content say so - so one rule serves every page instead of every page carrying a workaround.
# It overrides no colour, type or spacing token: the palette is the theme's contract with every other site
# in the Backstage catalogue. The file itself explains each rule and the defect it answers.
extra_css:
  - stylesheets/extra.css
# The publication script. Mermaid 10.4.0 derives a pie chart's coordinate system from the width of the
# element it draws into, but places the legend at a fixed offset whose own width comes from the label text,
# so below roughly 790px the legend is laid out beyond the edge of that coordinate system and the SVG root
# clips it away - at a phone width the ten-slice chart on the project guide loses its entire key. No
# mermaid2 argument reaches this and no stylesheet can, because a viewBox is not a CSS property; the file
# grows the viewBox to the geometry Mermaid actually drew, and only ever grows it, so a diagram that
# already fits is left exactly as it was. The file itself carries the full reasoning.
#
# THE FILENAME MUST NOT CONTAIN "MERMAID". mermaid2 claims the first extra_javascript entry whose basename
# contains that word as the Mermaid library, publishes it in place of the CDN import and then calls
# mermaid.initialize({}) against nothing - which silently unrenders every diagram on the site while the
# build still exits 0. This file was called mermaid-viewbox-fit.js until that happened.
extra_javascript:
  - javascripts/diagram-viewbox-fit.js
