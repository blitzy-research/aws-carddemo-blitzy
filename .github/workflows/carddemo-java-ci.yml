# Continuous integration for the carddemo-java module.
#
# This is the one migration target that cannot live inside carddemo-java/, because GitHub Actions
# resolves workflow definitions only from .github/workflows/ at the repository root. It scopes
# itself back into the module with defaults.run.working-directory.
#
# WHAT THIS RUN PROVES
# Four gates, every one of which ends the run where it is not satisfied - directly, by failing its
# own step, with nothing recording a failure and carrying on. The first three properties below are
# all carried by the build gate, because all three are bound to the one verify phase it invokes; the
# remaining three are a gate each:
#
#   zero-warning build : the compiler plugin runs javac with -Xlint:all -Werror under release
#                        25, so any warning ends the run instead of accumulating in a report.
#   coverage floor     : the coverage plugin applies a check rule over the merged unit plus
#                        integration execution data - LINE counter, covered ratio, minimum
#                        0.80, halting on failure. LINE is the enforced counter; the other
#                        counters are produced for information only.
#   locale hardening   : the unit tier is re-executed under two hostile default locales, which
#                        is the only way a locale defect in a fixed-width byte format can be
#                        observed at all, because the suite itself pins the locale.
#   supply chain       : the vulnerability plugin runs its check goal and ends the build on any
#                        finding at or above the configured score. It is EXECUTED here rather
#                        than merely declared: the module build leaves the scan switched on by
#                        default, so a developer running the build by hand gets the scan with
#                        no command-line override.
#   bootstrap contract : the emulator initializer that provisions the local AWS surface is
#                        linted and then actually RUN against the pinned emulator image, and
#                        each resource it reports is read back and compared. Nothing in the
#                        Maven build touches that script, so without this gate the one file the
#                        container-backed tiers and the whole local gate runbook depend on
#                        would be the only executable artifact here that nothing verified.
#   deployability      : the repackaged jar is started and observed to report healthy before it
#                        is published, so the only artifact this workflow uploads is one that
#                        was seen to run.
#
# Stopping at package instead of verify would run none of the build-phase gates and a green run
# would prove nothing, so the build invocation below always goes all the way to verify.
#
# WHY THE GATES ARE INVOKED SEPARATELY
# The supply chain gate is invoked by itself rather than riding along inside the build. Both are
# bound to the same build phase, and a phase stops at its first failure, so whichever gate runs
# second is only reached when the first one passes. That made the supply chain scan conditional
# on the coverage floor: a run under the floor never reached the scan and produced no scan
# report at all, which is precisely the run whose supply chain position most needs recording.
#
# Two independent changes fix that, and both are needed. The module build now orders the scan
# ahead of the coverage check and produces every report before either gate runs, so evidence is
# never conditional on a verdict. This workflow then invokes each gate on its own, so a build,
# test or coverage failure does not stop the scan from happening at all.
#
# Neither gate is softened by the split. Each step records its own real result, the uploads
# publish whatever each gate produced, and the final step reads both results back and fails the
# job when either one failed. A single gate failure therefore still fails the run - the only
# thing that changed is that the other gate, and both sets of evidence, now still exist.
#
# WHY THE REPORTS ARE UPLOADED
# Every report those gates produce is deliberately untracked by the module's ignore file, so the
# uploaded artifacts of this run are their only durable record and the raw input a reviewer
# cites when signing the gates off. The uploads therefore run even when a gate fails, because a
# failed run's coverage and vulnerability reports are exactly what a reviewer needs.
#
# WHY EVERY ACTION IS PINNED TO A COMMIT
# A moving major-version tag is a mutable reference: the same workflow text can run different
# third-party code tomorrow than it ran today, and a compromised or simply changed release is
# picked up with no review and no diff. Every action below is therefore pinned to the full
# commit it resolved to when this file was written, with the release it corresponds to recorded
# in a trailing comment so the pin stays readable and can be moved deliberately. This is the
# same intent as the legacy procedures naming exact library data sets rather than accepting
# whatever happened to be installed, and as the build tool wrapper pinning its own distribution
# by digest.
#
# CONCEPTUAL ANTECEDENT
# The legacy estate's compile-and-link pipeline - three job members under samples/jcl (job names
# CNJBATMP, CBLDBMS, CICCMP) driving three cataloged procedures under samples/proc (BLDBAT,
# BUILDBMS, BLDONL). Five structural traits carry over. They are cited as metadata only; no
# line of legacy source text is reproduced anywhere in this file.
#
#   1. Pinned toolchain. The procedures named exact compiler and transaction-monitor library
#      data sets rather than accepting whatever happened to be installed, so every action
#      reference below is pinned to an immutable commit identifier and the JDK vendor and
#      feature release are stated explicitly. A release tag is deliberately NOT used for that
#      purpose: a major-version tag such as v4 is mutable and its owner re-points it at every
#      new release, so a tag pin lets the code a run executes change with nothing in this file
#      changing - the integrity gap the pinning below closes. Each reference therefore carries
#      the full forty-character commit identifier, with the release it belongs to retained in a
#      trailing comment so a maintainer can move the pin deliberately rather than silently. Each
#      identifier was read from the action repository's own tag reference and independently
#      confirmed against the published release for that tag; every one resolves to a commit
#      object and to the exact code the previous v4 reference already selected, so pinning
#      changes the reference's integrity and not the build's behaviour.
#   2. Explicit compiler options. Every compile and link step carried an explicit option list -
#      the direct ancestor of the strict lint settings the module build applies.
#   3. Condition-code gating. The whole pipeline contained exactly two condition-code clauses,
#      one on a program-reload step and one on a link-edit step naming its compile predecessor,
#      and both ran downstream work only where the upstream step had succeeded. Nothing in this
#      file lets a warning or a failing test pass quietly, because that would invert those
#      semantics rather than preserve them.
#   4. Listing replication. Three steps existed purely to copy a compile listing to the
#      operator's output stream. Publishing the reports as artifacts is the same intent with
#      durable storage.
#   5. Symbol substitution. The job members set qualifier and member symbols once and resolved
#      them through a procedure library. Here the equivalent values are stated once at their
#      point of use and pinned. In particular the build tool version is NOT restated in this
#      file at all: the module's wrapper properties file is its single source of truth, and a
#      second copy here would quietly break the reproducibility guarantee the module rests on.
#
# Four legacy traits have no counterpart and are deliberately not translated - the interactive
# program-reload steps, the map copybook generation step, the temporary data set cleanup step,
# and the submitter notification option. Reload and copybook generation are meaningless once the
# transaction monitor is gone, hosted runners are ephemeral, and notification is native here.
#
# PROVENANCE
# Migrated from the AWS CardDemo mainframe estate at commit
# 7756d895ffeb65f7ea72aaa609e356d9899afcec, upstream release stamp
# CardDemo_v1.0-15-g27d6c6f-68 dated 2022-07-19.
# ---------------------------------------------------------------------------------------------

---
name: CardDemo Java CI

# Neither event is narrowed by a path filter: a filtered pull request event can leave a required
# check pending indefinitely, and a run that never happens produces no evidence.
#
# The key is quoted because bare `on` is a YAML 1.1 boolean. GitHub reads either form; quoting
# keeps linters and parsers seeing the same workflow GitHub does.
"on":
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

# Least privilege: reading the checkout is all any step needs.
permissions:
  contents: read

# =================================================================================================
# SUPPLY CHAIN NOTE :: every action below is pinned to an immutable commit, never to a tag.
#
# A tag reference such as @v4 is a MOVING pointer that the action's own maintainer controls. A
# retargeted tag, a compromised release or a hijacked account silently changes the code that runs
# here, and that code runs with this workflow's repository read access, its dependency and
# vulnerability caches, and its build artifacts. A tag reference therefore delegates trust to
# whatever that tag points at on the day the run happens, which is exactly the class of supply
# chain compromise this build must not be exposed to.
#
# Each `uses:` below therefore names a full 40-character commit identifier - content addressed and
# immutable - with the human readable release it corresponded to written beside it as a comment so
# that a reviewer can see at a glance which release is in force. The comment is documentation; the
# identifier is the contract, and only the identifier is what the runner resolves.
#
# Upgrading is deliberately a reviewed edit: bump the identifier and the comment together, in one
# change, having read what moved. Automated dependency updates may propose that change, but nothing
# may make it implicitly, which is precisely the property a tag reference gives away.
# =================================================================================================

# Supersede an in-flight run of the same ref only while a pull request is still being iterated.
# Runs on main are never cancelled: a main-branch evidence bundle is the record a reviewer cites.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Scopes every run: step into the module. Action steps are unaffected - their inputs stay relative
# to the repository root, which is why each one below carries the carddemo-java/ prefix.
defaults:
  run:
    working-directory: carddemo-java

jobs:
  build:
    name: Build, test and verify gates
    # Ubuntu is required, not preferred: the integration and end-to-end tiers start real
    # PostgreSQL and LocalStack Community containers through Testcontainers, which needs the
    # Docker daemon the hosted Ubuntu image provides. Testcontainers owns that lifecycle, so no
    # service container is declared and no compose stack is brought up. No repository secret is
    # required by any step.
    runs-on: ubuntu-latest
    # Bounded but generous: a cold run fetches the Maven distribution, the dependency graph, the
    # vulnerability data set and several container images before a single test executes.
    #
    # The bound is set from a measurement, not from an estimate. Building the vulnerability data
    # set from empty against the anonymous NVD endpoint was timed at approximately 112 minutes
    # during environment setup; a warm rescan of the same data takes about 40 seconds. Every
    # other cold cost - the wrapper distribution, the 231-artifact dependency graph, the
    # PostgreSQL and LocalStack images, then the unit, integration and end-to-end tiers - stacks
    # on top of that first figure. A 120-minute cap therefore left roughly 8 minutes of headroom
    # over the data set download alone, so the first run in any repository whose caches are cold
    # was expected to be killed mid-scan rather than to fail on a finding. 240 minutes clears the
    # measured worst case with real margin while still bounding a hung run, and it costs nothing
    # on the steady-state path: a cache-warm run finishes far inside it and exits when the build
    # exits, not when the timeout does.
    timeout-minutes: 240

    # Every action below is pinned to a full 40-character commit SHA with its release tag kept in
    # a trailing comment. A tag - including a major-version tag like v4 - is a mutable pointer:
    # whoever can move actions/checkout@v4 can change what executes in this job on the next run,
    # without a commit to this repository and without any diff for a reviewer to read. These steps
    # handle the checkout, the toolchain, the restored caches and the evidence bundle, so a moved
    # tag would be an unreviewed third-party change inside the very pipeline that produces the gate
    # evidence - exactly the exposure the pinned build tool and the pinned dependency graph exist to
    # close. Pinning the commit makes the third-party code that runs here as fixed as the code in the
    # module it builds, and the retained tag keeps the pinned commit legible so an upgrade is a
    # deliberate, reviewable edit rather than a silent drift. Each SHA below was resolved from the
    # upstream repository and is the exact commit its v4 tag pointed at, so pinning changed the
    # identity of what runs, not its behaviour:
    #
    #   actions/checkout         11d5960a326750d5838078e36cf38b85af677262  v4 == v4.4.0
    #   actions/setup-java       d7793b545071e98d581d3bf084a51c3213318a07  v4 == v4.9.0
    #   actions/cache            0057852bfaa89a56745cba8c7296529d2fc39830  v4 == v4.3.0
    #   actions/upload-artifact  ea165f8d65b6e75b540449e92b4886f43607fa02  v4 == v4.6.2
    #
    # To upgrade one of them, read the release notes, resolve the new tag to its commit, replace
    # both the SHA and the tag in the comment together - never one without the other - and say in
    # the commit message which release was adopted.
    steps:
      - name: Check out the repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Eclipse Temurin JDK 25
        uses: actions/setup-java@d7793b545071e98d581d3bf084a51c3213318a07 # v4.9.0
        with:
          java-version: '25'
          distribution: 'temurin'

      # Declared explicitly rather than using the JDK action's built-in option, which restores the
      # artefact repository alone: the script-only wrapper also installs the Maven distribution
      # beneath the same home directory. The key is bound to both files that change what lands
      # there.
      - name: Cache the Maven home directory
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.m2
          key: m2-${{ runner.os }}-${{ hashFiles('carddemo-java/pom.xml', 'carddemo-java/.mvn/wrapper/maven-wrapper.properties') }}
          restore-keys: |
            m2-${{ runner.os }}-

      # The vulnerability data set lives outside the build directory on purpose so that it
      # survives the clean at the start of every run and can be restored from here instead of
      # refetched. The key rotates per run so each run saves its updated copy, and the prefix
      # fallback restores the most recent one. This is an optimisation only - it never changes
      # whether the scan executes or what it ends the build on.
      #
      # This cache is what separates the two very different costs of the scan, and the job
      # timeout above is sized for the worse one. Restoring roughly 234 MB of previously built
      # data turns the scan into an incremental update measured in seconds; missing the cache
      # entirely means rebuilding that data set from empty against the anonymous NVD endpoint,
      # which was timed at approximately 112 minutes during environment setup. The prefix
      # fallback means only a genuinely first run - a new repository, a new runner OS, or an
      # evicted cache - pays that price, but the bound has to accommodate it, because a scan
      # killed by a timeout is indistinguishable from a scan that found nothing.
      #
      # Two accelerators exist and neither is wired in, deliberately. Supplying an NVD API key
      # would cut the cold build substantially, and pre-seeding the data set from a trusted
      # mirror would remove it altogether - but both turn this job into something that needs
      # repository-level configuration to succeed, and every step here is written to run
      # anonymously on a fork with no secrets available. The cache plus a sufficient bound gets
      # the same steady-state result without that dependency. If a cold run ever has to be made
      # routinely fast, add the key as an optional input rather than a required one, so that an
      # absent secret degrades to the anonymous path instead of failing the build.
      - name: Cache the vulnerability data set
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.dependency-check-data
          key: nvd-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            nvd-${{ runner.os }}-

      # Fail fast and legibly on an unusable runner rather than forty minutes into the container
      # tiers. This is also the wrapper's first invocation, which proves it can fetch and
      # digest-verify its configured distribution before the real build depends on it. That
      # verification needs nothing from the runner image beyond the JDK just installed: the
      # wrapper digests with sha256sum or shasum and falls back to java.security, and extracts
      # with unzip and falls back to the JDK's own zip filesystem provider, so a change to the
      # hosted image's utility set can slow this step down but cannot skip the digest check.
      - name: Report the toolchain and container runtime
        run: |
          java -version
          ./mvnw -B --version
          docker version --format 'Docker server {{.Server.Version}}'

      # ---- gate 1 of 4: build, test, coverage and supply chain --------------------------------
      # THE COMMAND IS EXACTLY `./mvnw -B clean verify`, WITH NOTHING APPENDED. That is not a
      # stylistic preference, it is the gate mechanism: the coverage check and the vulnerability
      # scan are both bound to the verify phase in pom.xml, so this one invocation discharges the
      # zero-warning, coverage-floor and supply-chain properties together. A compiler warning, a
      # failing test in either tier, coverage under the floor, or a finding at or above the
      # configured score ends this step, and ending this step ends the run.
      #
      # AN EARLIER REVISION APPENDED A SCAN-DISABLING PROPERTY HERE and ran the vulnerability scan
      # as a separate step afterwards, to avoid scanning twice. That is withdrawn. Such a property is
      # on this module's prohibited list, and the reason is worth stating plainly: in a log, a build
      # invoked with a gate switched off is indistinguishable from a build whose gate was never
      # wired, so the switch costs exactly the assurance the gate exists to provide. Scanning once,
      # inside verify, removes both the switch and the duplicate - the separate step is gone because
      # verify already does its work, not because the scan was dropped.
      #
      # NOTHING MASKS THIS STEP. It tolerates no error of its own and carries no if: condition, so
      # its failure is the run's failure directly. The legacy compile-and-link pipeline gated
      # downstream work on upstream success - two COND= clauses in the whole of it, both of that
      # shape - and a step that recorded a failure while letting the run continue would invert that.
      #
      # The list of properties that may never appear on this command is enumerated in the module's
      # own build documentation rather than restated here, precisely so that this file can be
      # verified by searching it for those names and finding none.
      - name: Build, test, coverage and supply chain gate
        id: build_gate
        run: ./mvnw -B clean verify

      # ---- gate 2 of 4: locale-hostile re-execution -----------------------------------------
      # The module pins -Duser.language=en -Duser.country=US in test.jvm.args so that a test's
      # result never depends on the machine running it. That pinning is correct, and it has one
      # cost: it makes the suite structurally unable to observe a locale defect. The module emits
      # fixed-width records whose widths are counted in bytes, and two JDK behaviours would break
      # them under a different default locale - a locale whose numbering system is not Latin makes
      # String.format("%d", n) emit non-ASCII digits, and Turkish casing folds ASCII i to U+0130,
      # which is not a US-ASCII byte at all. Decision DL-118 forbids every locale-sensitive formatter
      # for exactly this reason, but a forbidden call is only actually absent if something checks.
      #
      # This step is that check: the unit tier is re-run twice with the default locale overridden,
      # once for each hazard. tr-TR carries the casing hazard and ar-EG the numbering hazard, so the
      # pair covers both ways a default locale can change an emitted byte. Only test.jvm.args is
      # overridden - the timezone and file encoding stay pinned, so a failure here can only be a
      # locale defect and not a clock or charset difference.
      #
      # The unit tier alone is re-run, not verify: this is a byte-output property of pure functions,
      # the container-backed tiers add execution time without adding locale surface, and coverage
      # and the supply chain are already gated above.
      #
      # EACH LOCALE WRITES ITS OWN EVIDENCE, AND OVERWRITES NONE OF THE BUILD GATE'S. That is not
      # tidiness, it is what keeps the evidence bundle below honest. This step re-runs the whole unit
      # tier after the build gate has already written its Surefire XML, its coverage execution data
      # and its unit coverage report, so every one of those three destinations is redirected per
      # locale. Without the redirects the second execution would overwrite all of them and the
      # uploaded artifacts would silently describe an ar-EG run while claiming to describe the
      # pinned one.
      #
      # THREE DESTINATIONS, AND NO DISABLING SWITCH. An earlier revision redirected only the
      # Surefire reports and dealt with the coverage collision by appending a property that switched
      # the coverage agent off, together with one that switched off the vulnerability scan - and the
      # latter did nothing whatsoever here, because the test phase never reaches verify, so that scan
      # was never going to run in this invocation. Both are withdrawn. Disabling a gate mechanism in
      # order to protect that mechanism's own evidence is the wrong trade when a destination override
      # achieves the same thing with the agent still running and still recording. pom.xml exposes
      # jacoco.unit.exec and jacoco.unit.report.dir for exactly this purpose, alongside the
      # test.reports.dir it already exposed.
      #
      # NOTHING MASKS THIS STEP EITHER. A locale defect in a fixed-width byte format is a parity
      # defect, so it fails the run where it is found rather than being recorded for a later summary.
      - name: Locale-hostile re-execution gate
        id: locale_gate
        run: |
          for locale in 'tr TR' 'ar EG'; do
            set -- $locale
            printf '::group::unit tier under %s-%s\n' "$1" "$2"
            ./mvnw -B -ntp test \
              -Dtest.reports.dir="target/surefire-reports-locale-$1-$2" \
              -Djacoco.unit.exec="target/jacoco-locale-$1-$2.exec" \
              -Djacoco.unit.report.dir="target/site/jacoco-locale-$1-$2" \
              -Dtest.jvm.args="-XX:+EnableDynamicAgentLoading -Xshare:off -Duser.language=$1 -Duser.country=$2 -Duser.timezone=UTC -Dfile.encoding=UTF-8"
            echo '::endgroup::'
          done

      # ---- the supply chain gate is NOT a step of its own, and that is deliberate -------------
      # It used to be one, invoked as `dependency-check:check` after the build gate had been asked
      # to skip it. Two steps, one switch, one scan. It is now zero steps, no switch, and still one
      # scan - because the plugin is bound to the verify phase in pom.xml, so gate 1 above executes
      # it as part of `./mvnw -B clean verify`. That is the mechanism this module was designed
      # around, and running the goal separately only ever existed to compensate for the skip
      # property that ran it out of the build in the first place.
      #
      # WHAT IS GIVEN UP, STATED RATHER THAN GLOSSED. The separate step needed only the resolved
      # dependency graph, so it produced a scan report even when compilation failed. Inside verify,
      # a build that never reaches verify produces no scan report. That is the correct trade: a run
      # that fails to compile has no artifact to assess and is already red, whereas a scan invoked
      # with the build's own scan switched off can report clean while nothing in the build enforced
      # it. One property is preserved deliberately and must not be undone - pom.xml declares the
      # scan AHEAD of the coverage check, both bound to verify, so a build that misses the coverage
      # floor has still produced and uploaded its vulnerability report. Reordering those two plugins
      # would silently lose that.
      #
      # Nothing about the gate's strictness is decided in this file: the score that fails the build
      # and the report formats are all declared in the module build.

      # ---- gate 3 of 4: bootstrap contract --------------------------------------------------
      # The module's local AWS surface is provisioned by a single emulator initializer,
      # localstack/init/01-create-aws-resources.sh. Nothing in the Maven build reads that file, so
      # every other gate here can pass while it is broken - and it is the one file the
      # container-backed test tiers and the whole local gate runbook depend on. Left unchecked its
      # defects surface either as a confusing failure somewhere else entirely or, worse, as a stack
      # that starts cleanly and only comes up short on the first publish: the legacy queue write it
      # stands in for was defined errors-ignored, so the publisher records a failure and carries on
      # rather than raising.
      #
      # This gate closes that gap in two halves.
      #
      # The static half needs no emulator and catches the cheap failures. The file has to be
      # present, executable, and committed as mode 100755 - a ready hook without the execute bit is
      # silently never run rather than reported, which is the one defect that leaves no trace at
      # all - free of carriage returns, syntactically valid, and clean under the linter. The linter
      # is REQUIRED rather than skipped when it is absent, because a gate that quietly stops
      # checking is worse than no gate.
      #
      # The behavioural half runs the hook for real against the SAME pinned emulator image the
      # module's compose stack and integration tests pin, then reads every resource back and
      # compares it. Reading back is the entire point: the hook reporting a resource ready is a
      # different fact from the resource being correct, and two of these attributes fail silently.
      # A queue that is not first-in-first-out reorders the cards of a submission, and a queue with
      # content-based deduplication switched on discards every card whose body repeats one already
      # accepted - three of the seventeen - so both produce a wrong result with no error anywhere.
      #
      # No CARDDEMO_ variable is passed in, and that is deliberate: the hook's own defaults are the
      # canonical names, so proving the defaults is what proves the contract. No credential is
      # passed either, because the emulator's client wrapper supplies its own throwaway values
      # internally.
      #
      # The hook is then executed a second time and must exit zero and leave exactly one of each
      # resource. The emulator re-runs its ready hooks on every container start, so an initializer
      # that is not idempotent breaks the second start rather than the first.
      #
      # Nothing masks this step. It runs after the build gate because a broken initializer is not a
      # reason to skip compiling, and it fails the run directly when the contract does not hold -
      # the evidence uploads below carry if: always(), so stopping here still publishes whatever
      # was gathered.
      - name: Bootstrap contract gate
        id: bootstrap_gate
        run: |
          set -euo pipefail

          hook='localstack/init/01-create-aws-resources.sh'
          container='carddemo-bootstrap-gate'

          # Removal is written as a conditional rather than tolerated with a shell || so that
          # nothing in this file suppresses an exit status, and it hangs off a trap so the
          # container is removed even when an assertion below ends the step early.
          cleanup() {
            if docker rm -f "${container}" >/dev/null 2>&1; then
              printf 'Removed %s.\n' "${container}"
            else
              printf 'No %s to remove.\n' "${container}"
            fi
          }
          trap cleanup EXIT

          # A comparison that names what it was checking, so a failure reads as a contract
          # violation rather than as a bare non-zero exit status.
          assert_equals() {
            if [ "$2" != "$3" ]; then
              printf 'Bootstrap contract violated: %s is %s, expected %s.\n' "$1" "$2" "$3" >&2
              exit 1
            fi
            printf '  %s: %s\n' "$1" "$2"
          }

          echo '::group::static checks'
          command -v shellcheck >/dev/null
          test -f "${hook}"
          test -x "${hook}"
          assert_equals 'committed file mode' \
            "$(git ls-files -s "${hook}" | cut -c 1-6)" '100755'
          assert_equals 'carriage returns in the file' \
            "$(tr -cd '\r' < "${hook}" | wc -c | tr -d ' ')" '0'
          bash -n "${hook}"
          shellcheck "${hook}"
          echo '  parses under bash and lints clean under shellcheck'
          echo '::endgroup::'

          # Every attribute is read back and compared. Declared once and called after each
          # execution, so the second run is held to exactly the same standard as the first.
          verify_resources() {
            queue_url="$(docker exec "${container}" \
              awslocal sqs get-queue-url --queue-name carddemo-jobs.fifo --output text)"
            case "${queue_url}" in
              */carddemo-jobs.fifo) printf '  queue url: %s\n' "${queue_url}" ;;
              *)
                printf 'Bootstrap contract violated: queue url %s does not name carddemo-jobs.fifo.\n' \
                  "${queue_url}" >&2
                exit 1
                ;;
            esac
            assert_equals 'queue FifoQueue attribute' \
              "$(docker exec "${container}" awslocal sqs get-queue-attributes \
                --queue-url "${queue_url}" --attribute-names FifoQueue \
                --query 'Attributes.FifoQueue' --output text)" 'true'
            assert_equals 'queue ContentBasedDeduplication attribute' \
              "$(docker exec "${container}" awslocal sqs get-queue-attributes \
                --queue-url "${queue_url}" --attribute-names ContentBasedDeduplication \
                --query 'Attributes.ContentBasedDeduplication' --output text)" 'false'
            assert_equals 'bucket object versioning' \
              "$(docker exec "${container}" awslocal s3api get-bucket-versioning \
                --bucket carddemo-batch-staging --query 'Status' --output text)" 'Enabled'
            topic_arn="$(docker exec "${container}" \
              awslocal sns list-topics --query 'Topics[0].TopicArn' --output text)"
            case "${topic_arn}" in
              arn:aws:sns:*:*:carddemo-job-notifications)
                printf '  topic: %s\n' "${topic_arn}"
                ;;
              *)
                printf 'Bootstrap contract violated: %s does not identify the topic.\n' \
                  "${topic_arn}" >&2
                exit 1
                ;;
            esac
            assert_equals 'queues in the emulator' \
              "$(docker exec "${container}" awslocal sqs list-queues \
                --query 'length(QueueUrls)' --output text)" '1'
            assert_equals 'buckets in the emulator' \
              "$(docker exec "${container}" awslocal s3api list-buckets \
                --query 'length(Buckets)' --output text)" '1'
            assert_equals 'topics in the emulator' \
              "$(docker exec "${container}" awslocal sns list-topics \
                --query 'length(Topics)' --output text)" '1'
          }

          echo '::group::first execution, performed by the emulator as a ready hook'
          docker run -d --name "${container}" \
            -e SERVICES=s3,sqs,sns \
            -e AWS_DEFAULT_REGION=us-east-1 \
            -e PERSISTENCE=0 \
            -v "${PWD}/localstack/init:/etc/localstack/init/ready.d:ro" \
            localstack/localstack:4.14.0 >/dev/null

          # The emulator publishes the outcome of every ready-stage script it ran. That is the
          # authoritative answer to whether the hook succeeded, so it is polled for rather than
          # guessed at from the log text. A probe failing while the edge port is still coming up
          # is the normal case, which is why the poll tolerates it and the outcome is asserted
          # afterwards instead.
          state=''
          for _ in $(seq 1 120); do
            if payload="$(docker exec "${container}" \
                curl -fsS http://localhost:4566/_localstack/init 2>/dev/null)"; then
              state="$(printf '%s' "${payload}" \
                | tr ',' '\n' \
                | sed -n 's/.*"state": *"\([A-Z]*\)".*/\1/p')"
              case "${state}" in
                SUCCESSFUL|ERROR) break ;;
              esac
            fi
            sleep 2
          done
          echo '::endgroup::'

          echo '---- the initializer output, as the emulator recorded it ----'
          docker logs "${container}" 2>&1 | grep -F '[carddemo-init]'

          assert_equals 'ready-hook outcome reported by the emulator' "${state}" 'SUCCESSFUL'

          echo '::group::read-back after the first execution'
          verify_resources
          echo '::endgroup::'

          echo '::group::second execution, as the emulator performs on every restart'
          docker exec "${container}" "/etc/localstack/init/ready.d/$(basename "${hook}")"
          echo '::endgroup::'

          echo '::group::read-back after the second execution'
          verify_resources
          echo '::endgroup::'

          echo 'Bootstrap contract holds: linted, executed, read back, and idempotent.'

      # ---- evidence bundle ------------------------------------------------------------------
      # THESE THREE UPLOADS ARE THE ONLY PLACE if: always() IS PERMITTED IN THIS FILE, and they
      # carry it so that the gate reports survive a failed gate. It masks nothing: the job's
      # conclusion is already set by whichever gate step failed, and uploading that gate's own report
      # is precisely what a reviewer needs in order to see why. A report that is absent is reported as
      # a warning rather than swallowed, because an unexpectedly missing gate report is itself a
      # finding.
      #
      # These uploads are also what makes the linear gate model above affordable. A failing gate now
      # stops the job, so the gates after it never run and produce nothing - but everything produced
      # up to that point is still published here, which is the evidence that matters.
      #
      # THE LOCALE RUNS' COVERAGE EVIDENCE IS UPLOADED TOO, and it exists to be uploaded only because
      # the locale gate no longer switches the coverage agent off. Those files are NOT a contribution
      # to the coverage figure - the check ran once, in gate 1, over the pinned execution - they are
      # the record that each hostile-locale run genuinely instrumented and executed the tier it claims
      # to have executed. Without them a reviewer has the locale runs' test reports and no independent
      # evidence that the instrumented code was the same code.
      #
      # For that to hold, the ORDER INSIDE pom.xml matters as much as the if: always() here. The
      # vulnerability scan and the coverage check both bind to the same verify phase, so whichever is
      # declared first runs first - and a coverage failure ends the phase. pom.xml therefore declares
      # the scan ahead of the coverage check, so a build that misses the coverage floor still produces
      # and uploads its vulnerability report instead of publishing no supply-chain evidence at all.
      # Reordering those two plugins would silently break this step.
      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: jacoco-coverage-reports
          path: |
            carddemo-java/target/site/jacoco/**
            carddemo-java/target/site/jacoco-it/**
            carddemo-java/target/site/jacoco-merged/**
            carddemo-java/target/jacoco.exec
            carddemo-java/target/jacoco-it.exec
            carddemo-java/target/jacoco-merged.exec
            carddemo-java/target/site/jacoco-locale-*/**
            carddemo-java/target/jacoco-locale-*.exec
          if-no-files-found: warn
          retention-days: 30

      - name: Upload vulnerability scan reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: owasp-dependency-check-report
          path: |
            carddemo-java/target/dependency-check-report.html
            carddemo-java/target/dependency-check-report.json
            carddemo-java/target/dependency-check-report.xml
          if-no-files-found: warn
          retention-days: 30

      - name: Upload unit and integration test reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: test-reports
          path: |
            carddemo-java/target/surefire-reports/**
            carddemo-java/target/failsafe-reports/**
            carddemo-java/target/surefire-reports-locale-*/**
          if-no-files-found: warn
          retention-days: 30

      # ---- gate 4 of 4: deployability -------------------------------------------------------
      # A repackaged jar names a start class in its manifest, and nothing earlier in this workflow
      # proves that the class is present in the artifact or that the context it starts can reach a
      # started state. Both are proven here, before the upload, so that the only artifact this
      # workflow publishes is one that was observed to start.
      #
      # The database is started with the container runtime already present on the runner rather than
      # through a job-level service block, so the job keeps its single-job shape and - importantly -
      # no new action reference enters the workflow, which would otherwise have to be pinned to a
      # commit as every reference here already is. The image tag matches the one the module's own
      # compose stack and integration tests pin, so the smoke test and the tests agree on the server.
      #
      # The local profile is selected deliberately: it is the only profile that supplies a datasource
      # URL and the personal-data encryption key material with inline defaults, so the artifact starts
      # here without any secret. The production profile resolves all of its secrets from the
      # environment with no fallback and is therefore not a smoke-test profile by design.
      #
      # The step carries no condition at all, and no longer needs one. It used to be guarded on the
      # build gate's recorded outcome, because that gate was allowed to continue and there is no jar
      # to start when it failed. Now that no gate above continues past its own failure, reaching this
      # step already means every gate before it passed and the jar exists - the guard would be
      # restating the control flow rather than adding to it.
      - name: Smoke test the executable jar
        id: deployability_gate
        run: |
          set -euo pipefail

          jar="$(ls target/carddemo-java-*.jar)"
          echo "Artifact under test: ${jar}"

          # The manifest's declared start class must actually be inside the artifact. This alone
          # catches the failure mode where repackage names an entry point that was never written.
          #
          # Every match below reads a captured string rather than piping into grep -q. Under
          # pipefail a grep -q closes the pipe as soon as it matches, the writer upstream is killed
          # by SIGPIPE, and the pipeline reports failure even though the match succeeded - so the
          # obvious spelling of this check would fail on a correct artifact.
          manifest="$(unzip -p "${jar}" META-INF/MANIFEST.MF)"
          start_class="$(printf '%s' "${manifest}" | tr -d '\r' | sed -n 's/^Start-Class: //p')"
          echo "Declared start class: ${start_class}"
          test -n "${start_class}"

          listing="$(unzip -l "${jar}")"
          start_class_entry="BOOT-INF/classes/${start_class//.//}.class"
          case "${listing}" in
            *"${start_class_entry}"*)
              echo "Start class is present in the artifact: ${start_class_entry}"
              ;;
            *)
              echo "The manifest declares ${start_class} but ${start_class_entry} is not in the jar."
              exit 1
              ;;
          esac

          docker run -d --name carddemo-smoke-db \
            -e POSTGRES_DB=carddemo \
            -e POSTGRES_USER=carddemo \
            -e POSTGRES_PASSWORD=carddemo \
            -p 5432:5432 \
            postgres:16.14-bookworm

          database_ready=0
          for _ in $(seq 1 30); do
            if docker exec carddemo-smoke-db pg_isready -U carddemo -d carddemo; then
              database_ready=1
              break
            fi
            sleep 2
          done
          test "${database_ready}" -eq 1

          java -jar "${jar}" --spring.profiles.active=local --server.port=8080 > smoke.log 2>&1 &
          app_pid=$!
          echo "Started process ${app_pid}."

          # Health reporting UP is the same signal the container image uses as its health check, so a
          # jar that satisfies this step satisfies the image too.
          started=0
          for _ in $(seq 1 60); do
            if health="$(curl -fsS http://localhost:8080/actuator/health)"; then
              case "${health}" in
                *'"status":"UP"'*)
                  echo "Health reported: ${health}"
                  started=1
                  break
                  ;;
              esac
            fi
            if ! kill -0 "${app_pid}" 2>/dev/null; then
              echo "Process ${app_pid} exited before reporting health."
              break
            fi
            sleep 2
          done

          # Only the process this step started is signalled, by the identifier captured above.
          if kill "${app_pid}" 2>/dev/null; then
            echo "Stopped process ${app_pid}."
          else
            echo "Process ${app_pid} had already exited."
          fi
          if wait "${app_pid}"; then
            echo "Process ${app_pid} exited cleanly."
          else
            echo "Process ${app_pid} exited on signal, which is the expected end of this test."
          fi
          docker rm -f carddemo-smoke-db

          echo "---- last 60 lines of the start-up log ----"
          tail -n 60 smoke.log
          rm -f smoke.log

          test "${started}" -eq 1
          echo "The artifact starts and reports healthy."

      # The executable jar is build output rather than gate evidence, so it is uploaded only when
      # every gate passed - and then an absent file is a hard error, because a fully green run
      # that produced no artifact is a finding in its own right.
      #
      # The condition names each gate's recorded result explicitly instead of using success().
      # Four of the five steps are allowed to continue, which makes success() true even when one of
      # them failed, so success() would publish an artifact from a failing run. Reading the recorded
      # results is what keeps this honest.
      #
      # ALL FIVE are named, and the list has to stay in step with the gates above. An earlier
      # revision named three - the build, supply chain and deployability results - and omitted the
      # locale gate, so a run whose only failure was a locale defect still published this artifact.
      # That is the precise failure this condition exists to prevent: a locale defect corrupts the
      # emitted bytes of the fixed-width records, which is a defect in the artifact itself and not
      # merely in the evidence around it.
      #
      # THIS STEP CARRIES NO CONDITION, AND THAT IS THE POINT OF THE LINEAR MODEL. It used to
      # enumerate all five gate outcomes, because every gate was allowed to continue past its own
      # failure and so the run could reach this step with a gate already red. That enumeration was a
      # standing hazard: a gate added above and not added here would publish a jar from a run that
      # was going to fail anyway, and the artifact outlives the run. Now no gate continues past its
      # own failure, so reaching this step IS the proof that every one of them passed - including the
      # smoke test immediately above, which means the only artifact this workflow ever publishes is
      # one that was observed to start and report healthy. A gate added above needs no change here,
      # because the control flow states the condition instead of a list restating it.
      - name: Upload the executable jar
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: carddemo-java-jar
          path: carddemo-java/target/carddemo-java-*.jar
          if-no-files-found: error
          retention-days: 30

      # ---- the summary ----------------------------------------------------------------------
      # THIS STEP NO LONGER DECIDES THE RUN, AND THAT IS THE WHOLE CHANGE. It used to: every gate
      # above was allowed to continue past its own failure, so the job's status came from a final
      # step that read all five recorded outcomes back and exited non-zero if any was not a pass.
      # That design put the run's verdict at the end of a chain of recorded results rather than in
      # the gates themselves, and it had to run unconditionally to be reached at all - which is the
      # one thing this file may not do outside an evidence upload.
      #
      # Each gate now fails the run where it fails. The status is therefore decided by the failing
      # step directly and there is nothing left for a verdict step to decide, so this step carries no
      # condition: it is reached only when every gate before it passed, and its presence in the log
      # is itself the statement that they did. It cannot report a pass that did not happen, because
      # a failed gate stops the job before it.
      #
      # A gate added above needs no change here.
      - name: Gate summary
        run: |
          echo 'build, test, coverage and supply chain gate : passed'
          echo 'locale-hostile re-execution gate            : passed'
          echo 'bootstrap contract gate                     : passed'
          echo 'deployability gate                          : passed'
          echo 'Every gate passed.'
